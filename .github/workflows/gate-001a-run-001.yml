name: Gate-001A Run 001 Evidence Capture

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact subject baseline
        uses: actions/checkout@v4
        with:
          ref: 3142aa47afac0b8e63cc5bc46f9fa8ae40592354
          fetch-depth: 1

      - name: Capture deterministic verification evidence
        shell: bash
        run: |
          set -u
          export LC_ALL=C
          out="gate001a-output"
          mkdir -p "$out"

          actual_sha="$(git rev-parse HEAD)"
          printf '%s\n' "$actual_sha" > "$out/baseline_commit.txt"
          if [ "$actual_sha" != "3142aa47afac0b8e63cc5bc46f9fa8ae40592354" ]; then
            printf 'Expected baseline 3142aa47afac0b8e63cc5bc46f9fa8ae40592354, observed %s\n' "$actual_sha" > "$out/execution_error.txt"
            exit 2
          fi

          grep --version | head -n 1 > "$out/grep_version.txt"
          python --version > "$out/python_version.txt" 2>&1
          printf '%s\n' "AURORA-GATE-001A-RUN-001-3142AA47" > "$out/deterministic_seed.txt"

          set +e
          grep -rniE 'sherlock|watson|moriarty|tribunal|shadowfax' \
            src/monitoring/ \
            src/subroutines/ \
            modules/ethics_field/ \
            modules/cask/ \
            api/ \
            --include='*.py' \
            > "$out/step2.raw.txt" 2>&1
          step2_status=$?

          grep -rniE 'sherlock|watson|moriarty|tribunal|shadowfax' \
            src/ modules/ api/ config/ \
            --include='*.py' \
            --include='*.json' \
            --include='*.yaml' \
            --include='*.toml' \
            > "$out/step3.raw.txt" 2>&1
          step3_status=$?

          grep -rniE 'from modules\.ord|import modules\.ord|OrdPolicyEngine|OrdInspectionPolicy|DroneType\.SHADOWFAX|get_shadowfax_' \
            src/ modules/ api/ config/ tests/ \
            --include='*.py' --include='*.json' --include='*.yaml' --include='*.toml' \
            > "$out/ord_reachability.raw.txt" 2>&1
          ord_status=$?

          grep -rniE 'quantum_bayesian_manifest|tribunal_integration' \
            src/ modules/ api/ config/ tests/ \
            --include='*.py' --include='*.json' --include='*.yaml' --include='*.toml' \
            > "$out/tribunal_manifest_reachability.raw.txt" 2>&1
          tribunal_status=$?
          set -e

          printf '%s\n' "$step2_status" > "$out/step2.exit_code.txt"
          printf '%s\n' "$step3_status" > "$out/step3.exit_code.txt"
          printf '%s\n' "$ord_status" > "$out/ord_reachability.exit_code.txt"
          printf '%s\n' "$tribunal_status" > "$out/tribunal_manifest_reachability.exit_code.txt"

          if [ "$step2_status" -eq 1 ]; then
            printf 'No matches\n' > "$out/step2.result.txt"
          else
            cp "$out/step2.raw.txt" "$out/step2.result.txt"
          fi

          if [ "$step3_status" -eq 1 ]; then
            printf 'No matches\n' > "$out/step3.result.txt"
          else
            cp "$out/step3.raw.txt" "$out/step3.result.txt"
          fi

          python - <<'PY'
          import ast
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          out = Path("gate001a-output")
          pattern = re.compile(r"sherlock|watson|moriarty|tribunal|shadowfax", re.IGNORECASE)

          def deterministic_scan(roots: list[Path], suffixes: set[str]) -> list[str]:
              candidates: set[Path] = set()
              for root in roots:
                  if root.is_file() and root.suffix in suffixes:
                      candidates.add(root)
                  elif root.is_dir():
                      candidates.update(
                          path for path in root.rglob("*") if path.is_file() and path.suffix in suffixes
                      )
              matches: list[str] = []
              for path in sorted(candidates, key=lambda item: item.as_posix()):
                  try:
                      lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
                  except OSError:
                      continue
                  for line_number, line in enumerate(lines, start=1):
                      if pattern.search(line):
                          matches.append(f"{path.as_posix()}:{line_number}:{line}")
              return matches

          step2_matches = deterministic_scan(
              [
                  Path("src/monitoring"),
                  Path("src/subroutines"),
                  Path("modules/ethics_field"),
                  Path("modules/cask"),
                  Path("api"),
              ],
              {".py"},
          )
          step3_matches = deterministic_scan(
              [Path("src"), Path("modules"), Path("api"), Path("config")],
              {".py", ".json", ".yaml", ".toml"},
          )

          def write_projection(name: str, matches: list[str]) -> None:
              payload = "\n".join(matches) + ("\n" if matches else "")
              if not matches:
                  payload = "No matches\n"
              (out / name).write_text(payload, encoding="utf-8")

          write_projection("step2.deterministic.txt", step2_matches)
          write_projection("step3.deterministic.txt", step3_matches)

          grep_step2 = (out / "step2.raw.txt").read_text(encoding="utf-8").splitlines()
          grep_step3 = (out / "step3.raw.txt").read_text(encoding="utf-8").splitlines()
          equivalence = {
              "step2": {
                  "canonical_grep_exit_code": int((out / "step2.exit_code.txt").read_text().strip()),
                  "canonical_grep_match_count": len(grep_step2),
                  "deterministic_match_count": len(step2_matches),
                  "equivalent_as_sorted_records": sorted(grep_step2) == step2_matches,
              },
              "step3": {
                  "canonical_grep_exit_code": int((out / "step3.exit_code.txt").read_text().strip()),
                  "canonical_grep_match_count": len(grep_step3),
                  "deterministic_match_count": len(step3_matches),
                  "equivalent_as_sorted_records": sorted(grep_step3) == step3_matches,
              },
          }
          (out / "canonical_grep_equivalence.json").write_text(
              json.dumps(equivalence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          roots = [Path("src"), Path("modules"), Path("api")]
          imports = []
          parse_errors = []
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob("*.py")):
                  try:
                      tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
                  except (OSError, UnicodeDecodeError, SyntaxError) as exc:
                      parse_errors.append({"path": str(path), "error": str(exc)})
                      continue
                  for node in ast.walk(tree):
                      names = []
                      if isinstance(node, ast.Import):
                          names = [alias.name for alias in node.names]
                      elif isinstance(node, ast.ImportFrom):
                          names = [node.module or ""]
                      for name in names:
                          if name.startswith("modules.ord") or name.startswith("src.entities.fleet"):
                              imports.append(
                                  {
                                      "path": str(path),
                                      "line": getattr(node, "lineno", None),
                                      "import": name,
                                      "inside_defining_package": str(path).startswith("modules/ord/")
                                      or str(path).startswith("src/entities/fleet"),
                                  }
                              )

          manifest_path = Path("docs/ethics/recovered_protocols/recovered_protocol_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          shadowfax = next(
              item for item in manifest["protocols"] if item["protocol_id"] == "shadowfax"
          )
          custody_excerpt = {
              "runtime_posture": manifest["runtime_posture"],
              "canon_posture": manifest["canon_posture"],
              "shadowfax": shadowfax,
          }

          (out / "ord_import_graph.json").write_text(
              json.dumps(
                  {"imports": imports, "parse_errors": parse_errors},
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          (out / "shadowfax_custody_excerpt.json").write_text(
              json.dumps(custody_excerpt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          files = {}
          for path in sorted(out.iterdir()):
              if path.is_file():
                  files[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()

          execution = {
              "schema": "aurora.gate001a.execution_receipt/v1",
              "event_id": "AURORA-GATE-001A-RECOVERED-PROTOCOL-WIRING-001",
              "run_id": "AURORA-GATE-001A-RUN-001-3142AA47",
              "scenario_id": "GATE-001A-RECOVERED-PROTOCOL-WIRING-v1.0",
              "baseline_commit": "3142aa47afac0b8e63cc5bc46f9fa8ae40592354",
              "deterministic": True,
              "deterministic_projection": "sorted standard-library line scan",
              "seed": "AURORA-GATE-001A-RUN-001-3142AA47",
              "executed_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "runner": os.environ.get("RUNNER_NAME", "github-hosted-runner"),
              "runner_os": os.environ.get("RUNNER_OS", "Linux"),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "step2_exit_code": int((out / "step2.exit_code.txt").read_text().strip()),
              "step3_exit_code": int((out / "step3.exit_code.txt").read_text().strip()),
              "ord_reachability_exit_code": int(
                  (out / "ord_reachability.exit_code.txt").read_text().strip()
              ),
              "tribunal_manifest_reachability_exit_code": int(
                  (out / "tribunal_manifest_reachability.exit_code.txt").read_text().strip()
              ),
              "canonical_grep_equivalence": equivalence,
              "artifact_digests": files,
          }
          (out / "execution_receipt.json").write_text(
              json.dumps(execution, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          if not all(
              section["equivalent_as_sorted_records"] for section in equivalence.values()
          ):
              raise SystemExit("deterministic projection differs from canonical grep output")
          PY

          if [ "$step2_status" -gt 1 ] || [ "$step3_status" -gt 1 ] || [ "$ord_status" -gt 1 ] || [ "$tribunal_status" -gt 1 ]; then
            printf 'Search execution error: step2=%s step3=%s ord=%s tribunal=%s\n' \
              "$step2_status" "$step3_status" "$ord_status" "$tribunal_status" >&2
            exit 3
          fi

      - name: Upload complete evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-001a-run-001-evidence
          path: gate001a-output/
          if-no-files-found: error
          retention-days: 90
