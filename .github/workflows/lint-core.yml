name: Lint (Core Python)

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8 (tools + opal2)
        run: |
          flake8 tools/symbolic tools/cli modules/opal2 --max-line-length=120 --extend-ignore=E203,W503,F811
        # Note: broader linting for src/modules/tests is managed locally via pre-commit.
        # We are expanding CI lint coverage to include modules/opal2 now that it passes locally.