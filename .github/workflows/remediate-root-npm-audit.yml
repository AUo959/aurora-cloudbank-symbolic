name: Remediate root npm audit

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/remediate-root-npm-audit.yml

permissions:
  contents: write

jobs:
  remediate:
    name: Lockfile-only audit remediation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/remediate-root-npm-audit
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Capture baseline and remediate lockfile
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm audit --audit-level=moderate --json > audit-before.json || true
          cp package.json package.json.before
          set +e
          npm audit fix --package-lock-only 2>&1 | tee audit-fix.log
          AUDIT_FIX_EXIT=${PIPESTATUS[0]}
          set -e
          echo "npm audit fix exit code: ${AUDIT_FIX_EXIT}"
          if ! cmp -s package.json package.json.before; then
            echo "::error::Lockfile-only remediation changed package.json"
            diff -u package.json.before package.json || true
            mv package.json.before package.json
            exit 1
          fi
          rm package.json.before
          git diff -- package-lock.json

      - name: Clean install from remediated lockfile
        run: npm ci

      - name: Require clean moderate audit
        run: npm audit --audit-level=moderate --json > audit-after.json

      - name: Run Node tests
        run: npm run test:node

      - name: Run web tests
        run: npm run test:web

      - name: Run Constellation TypeScript check
        run: npx tsc --project tsconfig.constellation.json --noEmit --skipLibCheck --pretty false

      - name: Capture dependency versions (informational)
        continue-on-error: true
        run: npm ls ws engine.io socket.io-adapter js-yaml brace-expansion body-parser --all --json > dependency-versions-after.json

      - name: Upload remediation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-remediation-1341
          path: |
            audit-before.json
            audit-fix.log
            audit-after.json
            dependency-versions-after.json
          retention-days: 30
          if-no-files-found: warn

      - name: Commit validated lockfile and self-clean
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          if git diff --quiet -- package-lock.json; then
            echo "::error::npm audit fix produced no package-lock.json change"
            exit 1
          fi
          git rm .github/workflows/remediate-root-npm-audit.yml
          git rm .github/agent-tasks/issue-1341.md
          git add package-lock.json
          printf '%s\n' \
            '.github/agent-tasks/issue-1341.md' \
            '.github/workflows/remediate-root-npm-audit.yml' \
            'package-lock.json' > expected-files.txt
          git diff --cached --name-only | sort > staged-files.txt
          diff -u expected-files.txt staged-files.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: remediate root npm audit lockfile'
          git push origin HEAD:agent/remediate-root-npm-audit
