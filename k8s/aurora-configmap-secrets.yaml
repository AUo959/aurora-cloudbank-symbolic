# Aurora CloudBank Symbolic - MCP Bridge ConfigMap and Secrets
# Kubernetes configuration for MCP Bridge Core and sensitive data
#
# Ethics Protocol: Picard_Delta_3 - Secure configuration management
# T1: ConfigMap creation timestamp
# SRB: K8S_CONFIGMAP_v1
# Chain Notation: #K8S//CONFIGMAP//MCP_BRIDGE//
#
# Features:
# - Externalized MCP Bridge Core configuration
# - Separate Secrets for sensitive API keys
# - Ethics protocol compliance validation
# - Zero-trust security layers configuration

apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-bridge-config
  namespace: aurora-cloudbank
  labels:
    app: aurora-gui-cloudhub
    component: mcp-bridge
    ethics-protocol: picard-delta-3
  annotations:
    aurora.io/chain-notation: "#K8S//CONFIGMAP//MCP_BRIDGE//"
    aurora.io/srb: "K8S_CONFIGMAP_v1"
    aurora.io/ethics-protocol: "Picard_Delta_3"
    aurora.io/module-id: "MCP_BRIDGE_CORE_v1"
data:
  # MCP Bridge Core configuration JSON
  # This is the master configuration for symbolic command routing
  mcp_bridge_core.json: |
    {
      "module_id": "MCP_BRIDGE_CORE_v1",
      "version": "1.0.0",
      "anchor_seed": "EOS_SEED_ORION",
      "ethics_protocol": "Picard_Delta_3",
      "governance_layer": "Aurora_Command_Node_CPU",
      "core_functions": [
        "SYMBOLIC_COMMAND_ROUTING",
        "ANCHOR_VALIDATION_INTERFACE",
        "GUARDIAN_SECURITY_BRIDGE",
        "DRIFT_MONITORING_GATEWAY",
        "LOOM_SYNCHRONIZATION",
        "THREADCORE_VECTOR_HANDOFF",
        "RECURSIVE_THREAD_AUDIT"
      ],
      "security_layers": {
        "drift_lock": "ACTIVE",
        "guardian_ring": "STAGED_ACTIVE",
        "ethics_lock": "ENFORCED"
      },
      "external_hooks": {
        "gpt_parallel_nodes": [
          "OPPY",
          "ARCHY",
          "LIORA",
          "STARLING_AU",
          "RIVERTHREAD_808"
        ],
        "symbolic_mesh_sync": "ACTIVE"
      },
      "notes": "MCP Bridge initialized for Aurora Constellation Mesh continuity operations. This module provides the master interface for symbolic command routing, cross-thread integrity governance, and L0/L1 harmonization protocols."
    }
  
  # Application configuration
  app-config.yaml: |
    # Aurora GUI CloudHub Application Configuration
    server:
      host: "0.0.0.0"
      port: 8000
      workers: 4
      reload: false
      log_level: "info"
    
    cors:
      allow_origins: ["*"]
      allow_credentials: true
      allow_methods: ["*"]
      allow_headers: ["*"]
    
    vsa:
      default_dimension: 512
      max_dimension: 8192
      storage_limit: 10000  # Maximum VSA vectors in memory
    
    quantum:
      default_qubits: 8
      max_qubits: 32
      default_shots: 1000
      backend: "aer_simulator"
    
    uploads:
      max_size_mb: 10
      allowed_extensions: [".zip", ".json", ".yaml"]
      storage_path: "/app/uploads"
    
    monitoring:
      prometheus_enabled: true
      prometheus_port: 9090
      health_check_interval: 10
    
    aurora:
      chain_notation: "#K8S//APP//CONFIG//"
      ethics_protocol: "Picard_Delta_3"
      governance_layer: "Aurora_Command_Node_CPU"

---
# Kubernetes Secret for API keys
# IMPORTANT: This is a template. Replace with actual secrets or use external secret management
apiVersion: v1
kind: Secret
metadata:
  name: aurora-api-keys
  namespace: aurora-cloudbank
  labels:
    app: aurora-gui-cloudhub
    component: secrets
    ethics-protocol: picard-delta-3
  annotations:
    aurora.io/chain-notation: "#K8S//SECRET//API_KEYS//"
    aurora.io/srb: "K8S_SECRET_v1"
    aurora.io/ethics-protocol: "Picard_Delta_3"
    aurora.io/encryption: "REQUIRED"
    # Kubernetes secret encryption at rest
    kubernetes.io/description: "API keys for external AI services (Anthropic Claude, OpenAI GPT)"
type: Opaque
data:
  # Base64 encoded API keys
  # Replace these with actual base64-encoded keys: echo -n "your-key" | base64
  # DO NOT commit actual keys to git - use sealed-secrets or external secret management
  
  # Anthropic Claude API key (base64 encoded placeholder)
  anthropic-api-key: cGxhY2Vob2xkZXItYW50aHJvcGljLWtleQ==  # "placeholder-anthropic-key"
  
  # OpenAI GPT API key (base64 encoded placeholder)
  openai-api-key: cGxhY2Vob2xkZXItb3BlbmFpLWtleQ==  # "placeholder-openai-key"
  
  # Additional secrets
  csrf-secret-key: Y3NyZi1zZWNyZXQta2V5LXBsYWNlaG9sZGVy  # CSRF token secret
  jwt-secret-key: and0LXNlY3JldC1rZXktcGxhY2Vob2xkZXI=  # JWT signing key

stringData:
  # Alternative: Use stringData for non-base64 values (Kubernetes auto-encodes)
  # anthropic-api-key: "your-actual-key-here"
  # openai-api-key: "your-actual-key-here"

---
# Ethics Protocol ConfigMap
# Defines zero-trust security policies and ethical guidelines
apiVersion: v1
kind: ConfigMap
metadata:
  name: aurora-ethics-protocol
  namespace: aurora-cloudbank
  labels:
    app: aurora-gui-cloudhub
    component: ethics
    protocol: picard-delta-3
  annotations:
    aurora.io/chain-notation: "#K8S//CONFIGMAP//ETHICS//"
    aurora.io/srb: "K8S_ETHICS_PROTOCOL_v1"
data:
  ethics-rules.yaml: |
    # Picard Delta 3 Ethics Protocol
    # Zero-trust security and ethical AI guidelines
    
    protocol_name: "Picard_Delta_3"
    version: "3.0.0"
    
    # Zero-trust security principles
    zero_trust:
      - "Never trust, always verify"
      - "Least privilege access"
      - "Assume breach mentality"
      - "Verify explicitly at every interaction"
      - "Use least privileged access"
      - "Segment access by workload"
    
    # Ethical AI guidelines
    ethical_ai:
      - "Transparency in AI decision-making"
      - "Fairness and bias mitigation"
      - "Privacy by design"
      - "Human oversight required"
      - "Explainable AI outputs"
      - "Data minimization"
    
    # Data protection rules
    data_protection:
      - "Encrypt data at rest and in transit"
      - "PII must be anonymized or pseudonymized"
      - "Data retention policies enforced"
      - "Audit all data access"
      - "Right to deletion (GDPR compliance)"
    
    # Symbolic continuity requirements
    symbolic_continuity:
      - "Maintain T1 temporal anchors"
      - "Preserve SRB (Symbolic Reference Base)"
      - "DLP (Data Lineage Protocol) tracking"
      - "Chain notation for all operations"
      - "Anchor validation on all transitions"
    
    # Security layer enforcement
    security_layers:
      drift_lock: "ACTIVE"
      guardian_ring: "STAGED_ACTIVE"
      ethics_lock: "ENFORCED"
    
    # Monitoring and compliance
    compliance:
      - "Log all security events"
      - "Real-time anomaly detection"
      - "Quarterly ethics audits"
      - "Incident response procedures"
      - "Continuous compliance validation"

---
# Runtime Configuration ConfigMap
# Environment-specific settings that may change between deployments
apiVersion: v1
kind: ConfigMap
metadata:
  name: aurora-runtime-config
  namespace: aurora-cloudbank
  labels:
    app: aurora-gui-cloudhub
    component: runtime
  annotations:
    aurora.io/chain-notation: "#K8S//CONFIGMAP//RUNTIME//"
data:
  # Logging configuration
  LOGGING_LEVEL: "INFO"
  LOGGING_FORMAT: "json"
  
  # Feature flags
  ENABLE_QUANTUM_CIRCUIT: "true"
  ENABLE_GEOMETRIC_ALGEBRA: "true"
  ENABLE_VSA_OPERATIONS: "true"
  ENABLE_WEBSOCKET: "true"
  
  # Performance tuning
  WORKER_PROCESSES: "4"
  WORKER_CONNECTIONS: "1000"
  KEEPALIVE_TIMEOUT: "65"
  
  # Resource limits
  MAX_UPLOAD_SIZE: "10485760"  # 10MB in bytes
  MAX_REQUEST_SIZE: "104857600"  # 100MB in bytes
  REQUEST_TIMEOUT: "300"  # 5 minutes
  
  # Cache settings
  CACHE_TTL: "3600"  # 1 hour
  CACHE_MAX_SIZE: "1000"
  
  # Metrics and monitoring
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"
  TRACING_ENABLED: "false"
  TRACING_ENDPOINT: "http://jaeger-collector:14268/api/traces"
