name: Node.js CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Explicit permissions for security
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Check for package.json
        id: check-package
        run: echo "exists=$(test -f package.json && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
      - name: Use Node.js ${{ matrix.node-version }}
        if: steps.check-package.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        if: steps.check-package.outputs.exists == 'true'
        run: npm ci || npm install
      - name: Run linting
        if: steps.check-package.outputs.exists == 'true'
        run: npm run lint || echo "::warning::Linting failed, but continuing..."
      - name: Run tests
        if: steps.check-package.outputs.exists == 'true'
        run: npm test || echo "::warning::Tests failed, but continuing..."
      - name: Skip Node.js CI
        if: steps.check-package.outputs.exists == 'false'
        run: echo "::notice::No package.json found, skipping Node.js CI"
