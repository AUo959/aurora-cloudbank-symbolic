name: "Constellation Integration CI"

# Ref: Aurora Constellation Architecture Proposal v1.0.0 — Gap 4

on:
  push:
    branches: [main]
    paths:
      - "constellation-contracts/**"
      - ".aurora/constellation.json"
      - "modules/qgia/**"
      # Without this, the workflow cannot run on changes to itself: a PR
      # editing only this file matched no path and skipped every validation
      # job, so a change to the checks below shipped unexercised.
      - ".github/workflows/constellation-integration.yml"
  pull_request:
    branches: [main]
    paths:
      - "constellation-contracts/**"
      - ".aurora/constellation.json"
      - "modules/qgia/**"
      # Without this, the workflow cannot run on changes to itself: a PR
      # editing only this file matched no path and skipped every validation
      # job, so a change to the checks below shipped unexercised.
      - ".github/workflows/constellation-integration.yml"
  schedule:
    - cron: "17 6 * * 1"  # Weekly Monday 06:17 UTC

permissions:
  contents: read

jobs:
  validate-schemas:
    name: Validate JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate all schema files are valid JSON
        run: |
          echo "Validating JSON schemas..."
          ERRORS=0
          for f in constellation-contracts/schemas/*.json; do
            if ! python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "::error::Invalid JSON: $f"
              ERRORS=$((ERRORS + 1))
            else
              echo "  ✓ $f"
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::$ERRORS schema(s) failed validation"
            exit 1
          fi
          echo "All schemas are valid JSON"

      - name: Validate JSON Schema draft-07 compliance
        run: |
          pip install jsonschema
          python3 -c "
          import json, glob, sys
          from jsonschema import Draft7Validator

          errors = 0
          for path in sorted(glob.glob('constellation-contracts/schemas/*.json')):
              with open(path) as f:
                  schema = json.load(f)
              validator = Draft7Validator(schema)
              if not validator.is_valid({}):
                  # Schema itself should be a valid JSON Schema
                  pass
              # Check the schema is a valid JSON Schema document
              try:
                  Draft7Validator.check_schema(schema)
                  print(f'  ✓ {path}')
              except Exception as e:
                  print(f'  ✗ {path}: {e}', file=sys.stderr)
                  errors += 1

          if errors:
              sys.exit(1)
          print('All schemas are valid JSON Schema draft-07')
          "

  validate-openapi:
    name: Validate OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install validator
        run: npm install -g @apidevtools/swagger-cli

      - name: Validate OpenAPI
        run: swagger-cli validate constellation-contracts/openapi/constellation-api.yaml

  validate-python-types:
    name: Validate Python Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jsonschema

      - name: Import and validate types
        run: |
          cd constellation-contracts/types/python
          python3 -c "
          from constellation_types import (
              ForecastRequest, ForecastResult, ForecastTier, EvidenceFragment,
              ConstellationEvent, EventType,
              KnowledgeIndex, KnowledgeDocument,
              NodeHealth, NodeStatus, HealthChecks,
              Provenance, ConstellationNode,
              validate_against_schema,
          )
          print('All types imported successfully')

          # Validate sample data
          sample = {
              'scenario_id': 'SCN-TEST-001',
              'scenario_title': 'Test Scenario',
              'description': 'A test scenario for CI validation',
              'domain': 'cyber',
              'time_horizon_days': 30
          }
          assert validate_against_schema(sample, 'forecast-request.schema.json')
          print('Sample validation passed')
          "

  validate-manifests:
    name: Validate Constellation Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate hub manifest exists and is valid JSON
        run: |
          if [ ! -f .aurora/constellation.json ]; then
            echo "::error::Hub manifest .aurora/constellation.json not found"
            exit 1
          fi
          python3 -m json.tool .aurora/constellation.json > /dev/null
          echo "Hub manifest is valid JSON"

      - name: Validate spoke manifest templates
        run: |
          for f in constellation-contracts/manifests/*.json; do
            if ! python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "::error::Invalid manifest: $f"
              exit 1
            fi
            echo "  ✓ $f"
          done
          echo "All spoke manifests are valid"

      - name: Check constellation version consistency
        run: |
          python3 -c "
          import json, glob, sys

          with open('.aurora/constellation.json') as f:
              hub = json.load(f)
          hub_version = hub['constellation_version']
          print(f'Hub version: {hub_version}')

          errors = 0

          # constellation-contracts/VERSION and .aurora/constellation.json are
          # the same concept in two files, read by two different workflows:
          # the health audit compares deployed spoke manifests against VERSION,
          # while the loop below locks the registry manifests to the hub node
          # manifest. Nothing previously compared the two to each other, so
          # they could drift silently — #1546 advanced VERSION to 1.1.0-alpha
          # and left the hub manifest at 1.0.0-alpha, and every check stayed
          # green because both sides of each comparison were internally
          # consistent. See #1562.
          with open('constellation-contracts/VERSION') as f:
              version_file = f.read().strip()
          if version_file != hub_version:
              print(
                  f'  ✗ constellation-contracts/VERSION: {version_file} != '
                  f'hub manifest {hub_version}',
                  file=sys.stderr,
              )
              errors += 1
          else:
              print(f'  ✓ constellation-contracts/VERSION: {version_file}')
          # Only spoke manifests participate in constellation-version locking.
          # Other JSON documents in this directory (for example neutral shipment
          # manifests) are still syntax/schema validated by their dedicated jobs.
          for path in sorted(glob.glob('constellation-contracts/manifests/*.manifest.json')):
              with open(path) as f:
                  spoke = json.load(f)
              sv = spoke.get('constellation_version', 'MISSING')
              if sv != hub_version:
                  print(f'  ✗ {path}: version {sv} != hub {hub_version}', file=sys.stderr)
                  errors += 1
              else:
                  print(f'  ✓ {path}: {sv}')

          if errors:
              sys.exit(1)
          print('All manifest versions match')
          "

      - name: Check constellation graph consistency
        run: |
          python3 -c "
          import json, glob, sys

          # Node registry: the hub declares itself in .aurora/constellation.json;
          # every other node has a manifest. Two nodes may share a repo — the hub
          # repo hosts both CONSTELLATION-PRIME (role hub) and
          # SENTINEL-COORDINATOR (role spoke, PROJECT SENTINEL, issue #1069) —
          # so nodes are keyed by symbolic_tag, never by repo.
          nodes = {}
          sources = [('.aurora/constellation.json', json.load(open('.aurora/constellation.json')))]
          for path in sorted(glob.glob('constellation-contracts/manifests/*.manifest.json')):
              sources.append((path, json.load(open(path))))

          errors = 0
          for path, doc in sources:
              tag = doc['node']['symbolic_tag']
              if tag in nodes:
                  print(f'  x {path}: duplicate symbolic_tag {tag} (also in {nodes[tag][0]})', file=sys.stderr)
                  errors += 1
                  continue
              nodes[tag] = (path, doc)

          # Every edge must be declared from both ends. A one-directional edge
          # means the graph disagrees with itself about who talks to whom:
          # SENTINEL-COORDINATOR declared the hub as upstream while the hub's
          # downstream omitted it, and nothing objected.
          for tag, (path, doc) in sorted(nodes.items()):
              des = doc['node']['designation']
              for other, near, far in (
                  ('upstream', 'upstream', 'downstream'),
                  ('downstream', 'downstream', 'upstream'),
              ):
                  for peer in doc.get(near, []):
                      if peer not in nodes:
                          print(f'  x {des}: {near} {peer} is not a declared node', file=sys.stderr)
                          errors += 1
                      elif tag not in nodes[peer][1].get(far, []):
                          peer_des = nodes[peer][1]['node']['designation']
                          print(f'  x {des} declares {near} {peer}, but {peer_des}.{far} omits {tag}', file=sys.stderr)
                          errors += 1

          # Every declared node must be a routable source_node. The reverse is
          # deliberately NOT enforced: the enum may reserve a designation before
          # its node exists (ORIONCORE-CONTROL does), and removing a published
          # enum value is a breaking contract change. See #1562, #1563.
          enum = set(json.load(open('constellation-contracts/schemas/constellation-event.schema.json'))['properties']['source_node']['enum'])
          for tag, (path, doc) in sorted(nodes.items()):
              des = doc['node']['designation']
              if des not in enum:
                  print(f'  x {des} ({path}) is not in the constellation-event source_node enum', file=sys.stderr)
                  errors += 1

          if errors:
              sys.exit(1)
          print(f'Constellation graph is consistent: {len(nodes)} nodes, all edges bidirectional')
          for tag, (path, doc) in sorted(nodes.items()):
              n = doc['node']
              print(f\"  ok {n['designation']} ({n['role']}) in {n['repo']}\")
          "

  health-report:
    name: Constellation Health Report
    needs: [validate-schemas, validate-openapi, validate-python-types, validate-manifests]
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "## Constellation Integration Report"
          echo ""
          echo "| Check | Status |"
          echo "|-------|--------|"
          echo "| JSON Schemas | ${{ needs.validate-schemas.result }} |"
          echo "| OpenAPI Spec | ${{ needs.validate-openapi.result }} |"
          echo "| Python Types | ${{ needs.validate-python-types.result }} |"
          echo "| Manifests    | ${{ needs.validate-manifests.result }} |"
