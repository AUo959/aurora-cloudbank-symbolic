name: GUMAS Command Policy

on:
  pull_request:
    paths:
      - 'simulation/runtime/gumas_command_policy/**'
      - 'simulation/specs/GUMAS__SPEC__DETERMINISTIC_COMMAND_TEAM_POLICY__v1.0__2026-08-13.md'
      - 'simulation/baselines/gumas/GUMAS__BASELINE__FLASH_REBELLION_PLANETOID_EQUAL_FLEETS__v1.2__2026-08-11.json'
      - 'tests/test_gumas_command_policy.py'
      - 'tests/test_gumas_command_policy_provenance.py'
      - '.github/workflows/gumas-command-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-command-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CloudBank
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: >-
          python -m pip install --only-binary=:all: pytest==9.0.3

      - name: Run deterministic command-policy tests
        run: >-
          pytest --noconftest
          tests/test_gumas_command_policy.py
          tests/test_gumas_command_policy_provenance.py
          -q --no-header

      - name: Run frozen-team command-policy smoke
        env:
          PYTHONHASHSEED: '0'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -o pipefail
          python simulation/runtime/gumas_command_policy/command_policy_smoke.py \
            2>&1 | tee gumas-command-policy.log

      - name: Upload command-policy acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gumas-command-policy-evidence
          path: gumas-command-policy.log
          retention-days: 30
          if-no-files-found: error
