permissions:
  contents: read
  actions: read
name: Aurora Maintenance & Monitoring
'on':
  schedule:
  - cron: 0 2 * * 1
  workflow_dispatch: {}
jobs:
  approval-gate:
    uses: ./.github/workflows/t1-approval-gate.yml
    with:
      reason: "Maintenance batch approval"

  dependency-audit:
    name: "\U0001F512 Dependency Security Audit"
    runs-on: ubuntu-latest
    needs: approval-gate
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Audit npm dependencies
      run: npm audit --audit-level=moderate || true
    - name: Update dependencies
      run: npm update && npm audit fix || true
  cleanup-tasks:
    name: "\U0001F9F9 Repository Cleanup"
    runs-on: ubuntu-latest
    needs: approval-gate
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Clean old artifacts
      run: find . -name "*.log" -mtime +7 -delete || true
    - name: Optimize repository
      run: ./smart-devops optimize || echo "Optimization completed"
