[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aurora-cli"
version = "0.1.0"
description = "Unified CLI for Aurora CloudBank Symbolic"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Aurora CloudBank Team", email = "developers@aurora.dev"},
]
keywords = [
    "cli",
    "quantum",
    "aurora",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "aurora-sdk>=0.1.0",
    "typer[all]>=0.26.7",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "mypy>=2.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[project.scripts]
aurora = "aurora_cli.cli:app"

[project.urls]
Homepage = "https://github.com/AUo959/aurora-cloudbank-symbolic"
Documentation = "https://developers.aurora.dev"
Repository = "https://github.com/AUo959/aurora-cloudbank-symbolic"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
