name: CI Status Project Automation

# This workflow tracks aggregate CI state for pull requests without recursively
# triggering on every check suite or bot-authored workflow completion.

on:
  workflow_run:
    workflows:
      - "Aurora CI (Minimal)"
      - "CodeQL"
      - "PR Evaluation"
      - "Constellation CI"
      - "Code Quality"
      - "Codacy Analysis"
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: read
  checks: read

concurrency:
  group: ci-status-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  update-pr-ci-status:
    name: Update PR CI Labels and Comment
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile CI status labels and comment
        uses: actions/github-script@v7
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            const pr = workflowRun.pull_requests?.[0];

            if (!pr) {
              core.notice('No pull request associated with this workflow run; skipping.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pr.number;
            const sha = workflowRun.head_sha;
            const ciLabels = {
              'ci: pending': {
                color: 'ededed',
                description: 'CI checks are still running or waiting to start',
              },
              'ci: passed': {
                color: '0e8a16',
                description: 'CI checks completed successfully',
              },
              'ci: failed': {
                color: 'd73a4a',
                description: 'One or more CI checks failed',
              },
            };
            const commentMarker = '<!-- CI_STATUS_UPDATE -->';

            async function ensureLabel(name, config) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color: config.color,
                  description: config.description,
                });
              }
            }

            async function removeLabel(name) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: prNumber,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            async function findExistingComment() {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: prNumber,
                per_page: 100,
              });

              return comments.find((comment) => comment.body?.includes(commentMarker));
            }

            const { data: checksForRef } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: sha,
              per_page: 100,
            });

            const { data: combinedStatus } = await github.rest.repos.getCombinedStatusForRef({
              owner,
              repo,
              ref: sha,
            });

            const checkRuns = checksForRef.check_runs;
            const failureConclusions = new Set(['failure', 'cancelled', 'timed_out', 'action_required', 'startup_failure']);
            const successConclusions = new Set(['success', 'neutral', 'skipped']);
            const maxFailedChecksToShow = 10;
            const completedChecks = checkRuns.filter((check) => check.status === 'completed');
            const failedChecks = completedChecks.filter((check) => failureConclusions.has(check.conclusion));
            const pendingChecks = checkRuns.filter((check) => check.status !== 'completed');
            const passedChecks = completedChecks.filter((check) => successConclusions.has(check.conclusion));
            const allCompletedChecksSucceeded = completedChecks.every(
              (check) => Boolean(check.conclusion) && successConclusions.has(check.conclusion)
            );

            let statusLabel = 'ci: pending';
            let statusSummary = 'pending';

            if (failedChecks.length > 0 || ['failure', 'error'].includes(combinedStatus.state)) {
              statusLabel = 'ci: failed';
              statusSummary = 'failed';
            } else if (
              checkRuns.length > 0 &&
              pendingChecks.length === 0 &&
              allCompletedChecksSucceeded &&
              combinedStatus.state === 'success'
            ) {
              statusLabel = 'ci: passed';
              statusSummary = 'passed';
            }

            for (const [name, config] of Object.entries(ciLabels)) {
              await ensureLabel(name, config);
            }

            for (const labelName of Object.keys(ciLabels)) {
              if (labelName !== statusLabel) {
                await removeLabel(labelName);
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: prNumber,
              labels: [statusLabel],
            });

            const existingComment = await findExistingComment();

            if (statusLabel === 'ci: failed') {
              const failedList = failedChecks
                .slice(0, maxFailedChecksToShow)
                .map((check) => `- ${check.name}`)
                .join('\n');
              const body = [
                commentMarker,
                '## ⚠️ CI Status Update',
                '',
                `**Status:** Checks ${statusSummary}`,
                `**Commit:** \`${sha.slice(0, 7)}\``,
                `**Completed Checks:** ${completedChecks.length}`,
                `**Passed:** ${passedChecks.length}`,
                `**Failed:** ${failedChecks.length}`,
                '',
                '### Failed Checks',
                failedList || '- A required status reported failure without an attached check run name.',
                '',
                'Please review the failed checks and push a follow-up fix.',
              ].join('\n');

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body,
                });
              }
            } else if (existingComment) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: existingComment.id,
              });
            }
