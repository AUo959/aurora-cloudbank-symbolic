name: Aurora Release Pipeline

permissions:
  contents: write  # Write releases and tags
  actions: read    # Read workflow status

'on':
  push:
    tags:
    - v*
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: v1.0.0
jobs:
  create-release:
    name: "\U0001F4E6 Create Release"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
    - name: Generate changelog
      run: git log --oneline --since="1 month ago" > CHANGELOG.md || true
    # SRB-T1: Upgraded to softprops/action-gh-release due to actions/create-release@v1 deprecation (2025-08-19)
    - name: Create GitHub release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
      with:
        name: Aurora CloudBank ${{ github.ref_name }}
        body_path: CHANGELOG.md
        draft: false
        prerelease: false
        generate_release_notes: true
