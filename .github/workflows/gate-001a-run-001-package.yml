name: Gate-001A Run 001 Package Installation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out evidence branch
        uses: actions/checkout@v4
        with:
          ref: security/gate-001a-run-001-recovered-protocol-wiring
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and validate evidence
        id: validate
        shell: bash
        run: |
          set +e
          mkdir -p gate001a-package-diagnostic
          event="docs/security/assurance_runs/gate-001a/2026-07-27-run-001-recovered-protocol-wiring/AURORA_SECURITY__EVENT__GATE_001A_RECOVERED_PROTOCOL_WIRING__v1.0__2026-07-27.json"

          python tools/security/_install_gate001a_run001.py \
            > gate001a-package-diagnostic/01-installer.log 2>&1
          installer_status=$?

          validator_status=99
          tests_status=99
          if [ "$installer_status" -eq 0 ]; then
            python tools/security/validate_institutional_assurance_event.py "$event" \
              > gate001a-package-diagnostic/02-validator.log 2>&1
            validator_status=$?
            python -m pip install --disable-pip-version-check pytest \
              > gate001a-package-diagnostic/00-dependency-install.log 2>&1
            dependency_status=$?
            if [ "$dependency_status" -eq 0 ]; then
              python -m pytest -q tests/test_gate_001a_run_001_package.py \
                > gate001a-package-diagnostic/03-pytest.log 2>&1
              tests_status=$?
            else
              tests_status=$dependency_status
              cp gate001a-package-diagnostic/00-dependency-install.log \
                gate001a-package-diagnostic/03-pytest.log
            fi
          fi

          printf 'installer=%s\nvalidator=%s\ntests=%s\n' \
            "$installer_status" "$validator_status" "$tests_status" \
            > gate001a-package-diagnostic/status.txt
          cat gate001a-package-diagnostic/status.txt
          cat gate001a-package-diagnostic/01-installer.log
          test "$installer_status" -eq 0
          cat gate001a-package-diagnostic/02-validator.log
          test "$validator_status" -eq 0
          cat gate001a-package-diagnostic/03-pytest.log
          test "$tests_status" -eq 0

      - name: Upload package validation diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-001a-run-001-package-diagnostic
          path: gate001a-package-diagnostic/
          if-no-files-found: error
          retention-days: 14

      - name: Remove execution scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf gate001a-package-diagnostic
          rm -f .github/workflows/gate-001a-run-001.yml
          rm -f .github/workflows/gate-001a-run-001-deterministic-replay.yml
          rm -f .github/workflows/gate-001a-run-001-package.yml
          rm -f tools/security/_install_gate001a_run001.py
          rm -rf tools/security/.gate001a_payload

      - name: Commit durable first-class run package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aurora-githubops"
          git config user.email "githubops@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "security: record Gate-001A Run 001 evidence package"
          git push origin HEAD:security/gate-001a-run-001-recovered-protocol-wiring
