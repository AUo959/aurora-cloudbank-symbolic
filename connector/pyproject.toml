[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aurora-cloudbank-connector"
version = "0.1.0"
description = "MCP connector exposing Aurora Cloudbank symbolic state to any LLM interface"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
sse = [
    "mcp[sse]>=1.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.40.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",  # httpx mock for bridge tests
]

[project.scripts]
aurora-mcp = "connector.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/connector"]

[tool.hatch.build.targets.wheel]
packages = ["connector"]
