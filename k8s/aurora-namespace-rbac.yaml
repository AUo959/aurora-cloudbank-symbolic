# Aurora CloudBank Symbolic - Namespace and RBAC Configuration
# Kubernetes namespace, service accounts, roles, and role bindings
#
# Ethics Protocol: Picard_Delta_3 - Zero-trust RBAC
# T1: Namespace creation timestamp
# SRB: K8S_NAMESPACE_v1
# Chain Notation: #K8S//NAMESPACE//AURORA_CLOUDBANK//
#
# Features:
# - Isolated namespace for Aurora workloads
# - Least privilege service accounts
# - Role-based access control (RBAC)
# - Resource quotas and limits

apiVersion: v1
kind: Namespace
metadata:
  name: aurora-cloudbank
  labels:
    name: aurora-cloudbank
    ethics-protocol: picard-delta-3
    governance-layer: aurora-command-node-cpu
  annotations:
    aurora.io/chain-notation: "#K8S//NAMESPACE//AURORA_CLOUDBANK//"
    aurora.io/srb: "K8S_NAMESPACE_v1"
    aurora.io/ethics-protocol: "Picard_Delta_3"
    aurora.io/purpose: "Isolated namespace for Aurora CloudBank Symbolic workloads"

---
# Service Account for Aurora GUI CloudHub pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aurora-gui-cloudhub
  namespace: aurora-cloudbank
  labels:
    app: aurora-gui-cloudhub
    ethics-protocol: picard-delta-3
  annotations:
    aurora.io/chain-notation: "#K8S//SA//AURORA_GUI_CLOUDHUB//"
    aurora.io/srb: "K8S_SA_v1"
# Disable automatic mounting if pods don't need Kubernetes API access
automountServiceAccountToken: false

---
# Role for Aurora GUI CloudHub
# Defines permissions within the namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aurora-gui-cloudhub-role
  namespace: aurora-cloudbank
  labels:
    app: aurora-gui-cloudhub
  annotations:
    aurora.io/chain-notation: "#K8S//ROLE//AURORA_GUI_CLOUDHUB//"
rules:
# ConfigMap read access
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
  resourceNames: ["mcp-bridge-config", "aurora-ethics-protocol", "aurora-runtime-config"]

# Secret read access (only specific secrets)
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
  resourceNames: ["aurora-api-keys"]

# Pod read access for health checks
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

# Service read access
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]

# Events (optional, for debugging)
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]

---
# RoleBinding for Aurora GUI CloudHub
# Binds the role to the service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aurora-gui-cloudhub-rolebinding
  namespace: aurora-cloudbank
  labels:
    app: aurora-gui-cloudhub
  annotations:
    aurora.io/chain-notation: "#K8S//ROLEBINDING//AURORA_GUI_CLOUDHUB//"
subjects:
- kind: ServiceAccount
  name: aurora-gui-cloudhub
  namespace: aurora-cloudbank
roleRef:
  kind: Role
  name: aurora-gui-cloudhub-role
  apiGroup: rbac.authorization.k8s.io

---
# ClusterRole for cross-namespace operations (if needed)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aurora-gui-cloudhub-clusterrole
  labels:
    app: aurora-gui-cloudhub
  annotations:
    aurora.io/chain-notation: "#K8S//CLUSTERROLE//AURORA_GUI_CLOUDHUB//"
rules:
# Node read access for topology awareness
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]

# Namespace list access
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]

---
# ClusterRoleBinding (only if ClusterRole is needed)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aurora-gui-cloudhub-clusterrolebinding
  labels:
    app: aurora-gui-cloudhub
  annotations:
    aurora.io/chain-notation: "#K8S//CLUSTERROLEBINDING//AURORA_GUI_CLOUDHUB//"
subjects:
- kind: ServiceAccount
  name: aurora-gui-cloudhub
  namespace: aurora-cloudbank
roleRef:
  kind: ClusterRole
  name: aurora-gui-cloudhub-clusterrole
  apiGroup: rbac.authorization.k8s.io

---
# ResourceQuota for namespace
# Limits total resource consumption in the namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: aurora-cloudbank-quota
  namespace: aurora-cloudbank
  labels:
    ethics-protocol: picard-delta-3
  annotations:
    aurora.io/chain-notation: "#K8S//QUOTA//AURORA_CLOUDBANK//"
spec:
  hard:
    # Compute resources
    requests.cpu: "20"          # Max 20 CPU cores requested
    requests.memory: "40Gi"     # Max 40GB memory requested
    limits.cpu: "40"            # Max 40 CPU cores limit
    limits.memory: "80Gi"       # Max 80GB memory limit
    
    # Object counts
    pods: "50"                  # Max 50 pods
    services: "20"              # Max 20 services
    configmaps: "30"            # Max 30 config maps
    secrets: "20"               # Max 20 secrets
    persistentvolumeclaims: "10"  # Max 10 PVCs
    
    # Storage
    requests.storage: "100Gi"   # Max 100GB storage

---
# LimitRange for default resource limits
# Sets default and max resources for containers
apiVersion: v1
kind: LimitRange
metadata:
  name: aurora-cloudbank-limitrange
  namespace: aurora-cloudbank
  labels:
    ethics-protocol: picard-delta-3
  annotations:
    aurora.io/chain-notation: "#K8S//LIMITRANGE//AURORA_CLOUDBANK//"
spec:
  limits:
  # Container limits
  - type: Container
    default:
      # Default limits if not specified
      cpu: "1000m"
      memory: "2Gi"
    defaultRequest:
      # Default requests if not specified
      cpu: "250m"
      memory: "512Mi"
    max:
      # Maximum allowed
      cpu: "4000m"
      memory: "8Gi"
    min:
      # Minimum required
      cpu: "100m"
      memory: "128Mi"
  
  # Pod limits
  - type: Pod
    max:
      cpu: "8000m"
      memory: "16Gi"
    min:
      cpu: "100m"
      memory: "128Mi"
  
  # PersistentVolumeClaim limits
  - type: PersistentVolumeClaim
    max:
      storage: "50Gi"
    min:
      storage: "1Gi"

---
# NetworkPolicy for zero-trust networking
# Controls ingress and egress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aurora-gui-cloudhub-netpol
  namespace: aurora-cloudbank
  labels:
    app: aurora-gui-cloudhub
    ethics-protocol: picard-delta-3
  annotations:
    aurora.io/chain-notation: "#K8S//NETPOL//AURORA_GUI_CLOUDHUB//"
    aurora.io/ethics-protocol: "Picard_Delta_3"
spec:
  podSelector:
    matchLabels:
      app: aurora-gui-cloudhub
  
  policyTypes:
  - Ingress
  - Egress
  
  # Ingress rules - what can connect to these pods
  ingress:
  # Allow from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  
  # Allow from within same namespace
  - from:
    - podSelector:
        matchLabels:
          app: aurora-gui-cloudhub
    ports:
    - protocol: TCP
      port: 8000
  
  # Allow from monitoring namespace (Prometheus)
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8000
  
  # Egress rules - what these pods can connect to
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  
  # Allow HTTPS to external APIs (Anthropic, OpenAI)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
  
  # Allow to Kubernetes API server
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 6443
  
  # Allow inter-pod communication
  - to:
    - podSelector:
        matchLabels:
          app: aurora-gui-cloudhub
    ports:
    - protocol: TCP
      port: 8000
