name: GitWiz Quality Gates
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Python lint tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort pylint bandit autopep8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Node.js lint tools
        run: |
          npm install -g eslint prettier markdownlint-cli

      - name: Verify tool installation
        run: |
          echo "=== Verifying Python tools ==="
          flake8 --version || echo "flake8 failed"
          black --version || echo "black failed"
          isort --version || echo "isort failed" 
          pylint --version || echo "pylint failed"
          bandit --version || echo "bandit failed"
          autopep8 --version || echo "autopep8 failed"
          echo "=== Verifying Node tools ==="
          eslint --version || echo "eslint failed"
          prettier --version || echo "prettier failed"
          markdownlint --version || echo "markdownlint failed"

      - name: GitWiz Status Check
        run: |
          if [ -f scripts/gitwiz_integrated_command.py ]; then
            python scripts/gitwiz_integrated_command.py status || echo "::warning::GitWiz status check failed"
          else
            echo "::notice::GitWiz integrated command not found"
          fi

      - name: GitWiz Quality Check
        run: |
          if [ -f scripts/gitwiz_integrated_command.py ]; then
            python scripts/gitwiz_integrated_command.py quality-check --output json > quality_report.json || echo "::warning::GitWiz quality check failed"
            cat quality_report.json
          else
            echo "::notice::GitWiz not available, running basic quality checks"
            # Basic Python syntax check
            find . -name "*.py" -not -path "./venv*" -not -path "./.venv/*" -exec python -m py_compile {} + || true
            # Basic flake8 check
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv_opal2,.venv,node_modules || true
            echo '{"status": "basic", "message": "GitWiz not available, ran basic checks"}' > quality_report.json
          fi

      - name: Basic Security Scan
        run: |
          bandit -r scripts/ -f json -o bandit_report.json || true
          echo "Security scan completed"

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ github.run_id }}
          path: |
            quality_report.json
            bandit_report.json

      - name: Generate Summary
        run: |
          echo "# 🔍 GitWiz Quality Gates Summary" > ci_summary.md
          echo "**Generated:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> ci_summary.md
          echo "" >> ci_summary.md
          if [ -f quality_report.json ]; then
            quality_score=$(jq -r '.summary.quality_score // "N/A"' quality_report.json 2>/dev/null || echo "N/A")
            total_issues=$(jq -r '.summary.total_issues // "N/A"' quality_report.json 2>/dev/null || echo "N/A")
            echo "## 📊 Quality Analysis Results" >> ci_summary.md
            echo "* **Quality Score:** ${quality_score}/100" >> ci_summary.md
            echo "* **Total Issues:** ${total_issues}" >> ci_summary.md
            echo "* **Status:** ✅ GitWiz Quality Gates operational" >> ci_summary.md
          else
            echo "## ⚠️ Quality Analysis" >> ci_summary.md
            echo "* **Status:** Basic checks completed" >> ci_summary.md
          fi
          echo "" >> ci_summary.md
          echo "**GitWiz Quality Gates** - Streamlined code quality management" >> ci_summary.md

      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('ci_summary.md')) {
              const summary = fs.readFileSync('ci_summary.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            }
