name: PR Evaluation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0  # Need full history for git operations

    - name: Detect first-class directory changes (gate)
      id: detect
      run: |
        BASE_SHA="${{ github.event.pull_request.base.sha }}"
        HEAD_SHA="${{ github.sha }}"
        echo "Comparing $BASE_SHA...$HEAD_SHA"
        changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
        echo "Changed files:\n$changed"
        should_run=false
        echo "$changed" | grep -E '^(api/|src/|tools/|tests/|modules/(hr_system|resilience_sentinel|gumas|symbolic_core|aumemmanager)/)' && should_run=true || true
        echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
        if [ "$should_run" != "true" ]; then
          echo "No first-class directory changes detected; evaluation will be skipped."
        fi

    - name: Set up Python
      if: steps.detect.outputs.should_run == 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      if: steps.detect.outputs.should_run == 'true'
      run: |
        python -m pip install --upgrade pip
        # Hash-checked: requirements-ci-hashed.txt is compiled from both
        # requirements.txt and requirements-test.txt (#1366).
        python -m pip install --require-hashes --only-binary=:all: \
          -r requirements-ci-hashed.txt

    - name: Run PR Evaluation
      if: steps.detect.outputs.should_run == 'true'
      id: evaluate
      run: |
        set +e
        python3 tools/pr_evaluator.py --pr ${{ github.event.pull_request.number }} --output pr_results.json
        EXIT_CODE=$?
        set -e
        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

    - name: Upload evaluation results
      if: steps.detect.outputs.should_run == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: pr-evaluation-results
        path: pr_results.json

    - name: Comment on PR
      if: steps.detect.outputs.should_run == 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      with:
        script: |
          const fs = require('fs');

          if (!fs.existsSync('pr_results.json')) {
            console.log('No evaluation results found, skipping comment');
            return;
          }

          const results = JSON.parse(fs.readFileSync('pr_results.json', 'utf8'));
          const scoreThreshold = 0.7;

          const MARKER = '<!-- PR_EVALUATION -->';

          // Build comment body
          let commentBody;
          if (results.overall_score >= 0.9) {
            commentBody = `${MARKER}\n✅ **PR Evaluation: PASSED** (Score: ${results.overall_score.toFixed(2)}/1.00)`;
          } else {
            const status = results.passed ? '✅ APPROVED' : '⚠️ NEEDS WORK';
            const statusEmoji = results.passed ? '✅' : '⚠️';

            const criticalIssues = [];
            const recommendations = [];
            for (const result of results.results) {
              if (!result.passed && result.score < 0.7) {
                if (result.findings && result.findings.length > 0) {
                  criticalIssues.push(`**${result.category}** (${result.score.toFixed(2)}): ${result.findings[0]}`);
                }
                if (result.recommendations && result.recommendations.length > 0) {
                  recommendations.push(...result.recommendations.slice(0, 2));
                }
              }
            }

            commentBody = `${MARKER}\n## ${statusEmoji} PR Evaluation: ${status}\n\n`;
            commentBody += `**Overall Score:** ${results.overall_score.toFixed(2)}/1.00 | **Recommendation:** ${results.recommendation}\n\n`;

            if (criticalIssues.length > 0) {
              commentBody += `### Issues\n\n`;
              criticalIssues.forEach(issue => commentBody += `- ${issue}\n`);
              commentBody += `\n`;
            }

            if (recommendations.length > 0) {
              commentBody += `### Recommendations\n\n`;
              recommendations.slice(0, 5).forEach(rec => commentBody += `- ${rec}\n`);
            }
          }

          // Update existing comment in-place or create new
          const { data: comments } = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100,
          });
          const existing = comments.find(c => c.body && c.body.includes(MARKER));
          if (existing) {
            await github.rest.issues.updateComment({
              comment_id: existing.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody,
            });
          } else {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody,
            });
          }

    - name: Check evaluation status (advisory; tracked in #1342)
      if: steps.detect.outputs.should_run == 'true' && steps.evaluate.outputs.exit_code != '0'
      continue-on-error: true
      run: |
        echo "PR evaluation found issues. Review the artifact and #1342 before merge."
        exit 1

    - name: Skip summary
      if: steps.detect.outputs.should_run != 'true'
      run: |
        echo "No first-class changes detected; PR Evaluation skipped." >> "$GITHUB_STEP_SUMMARY"
