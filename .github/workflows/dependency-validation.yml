name: Aurora CloudBank Dependency Validation

on:
  push:
    paths:
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/dependency-validation.yml'
  pull_request:
    paths:
      - 'requirements*.txt'
      - 'pyproject.toml'

jobs:
  validate-dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
    
    - name: Create virtual environment
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install --upgrade pip wheel setuptools
    
    - name: Test dependency resolution (dry run)
      run: |
        source .venv/bin/activate
        echo "🧪 Testing dependency resolution..."
        if [[ -f "requirements-lock.txt" ]]; then
          pip install -r requirements-lock.txt --dry-run --report dependency_report.json
        elif [[ -f "requirements.txt" ]]; then
          pip install -r requirements.txt --dry-run
        fi
    
    - name: Install dependencies
      run: |
        source .venv/bin/activate
        if [[ -f "requirements-lock.txt" ]]; then
          pip install -r requirements-lock.txt
        elif [[ -f "requirements.txt" ]]; then
          pip install -r requirements.txt
        fi
    
    - name: Validate dependency compatibility
      run: |
        source .venv/bin/activate
        echo "🔍 Checking for dependency conflicts..."
        pip check
    
    - name: Run Aurora dependency validator
      run: |
        source .venv/bin/activate
        if [[ -f "scripts/validate_dependencies.py" ]]; then
          python scripts/validate_dependencies.py
        else
          echo "⚠️ Dependency validator not found, skipping Aurora-specific validation"
        fi
    
    - name: Test critical imports
      run: |
        source .venv/bin/activate
        python -c "
import sys
try:
    import fastapi
    import httpx
    import httpcore
    import h11
    print(f'✅ Core dependencies loaded successfully')
    print(f'FastAPI: {fastapi.__version__}')
    print(f'httpx: {httpx.__version__}')
    print(f'httpcore: {httpcore.__version__}')
    print(f'h11: {h11.__version__}')
    
    # Verify compatibility
    import packaging.version as pv
    if pv.parse(httpx.__version__) >= pv.parse('0.28.0'):
        print('✅ httpx version compatible with httpcore 1.x')
    else:
        print('⚠️ httpx version may not support httpcore 1.x')
        
    if pv.parse(httpcore.__version__) >= pv.parse('1.0.0'):
        print('✅ httpcore version compatible with h11 0.16.0')
    else:
        print('⚠️ httpcore version may not support h11 0.16.0')
        
except ImportError as e:
    print(f'❌ Import error: {e}')
    sys.exit(1)
"
    
    - name: Upload dependency report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: dependency-report-python-${{ matrix.python-version }}
        path: |
          dependency_report.json
          .venv/lib/python*/site-packages/*/METADATA
        retention-days: 7
    
    - name: Dependency security check
      run: |
        source .venv/bin/activate
        pip install safety bandit
        echo "🔒 Running security checks..."
        safety check --json --output safety-report.json || echo "⚠️ Safety check completed with warnings"
        
    - name: Upload security report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: security-report-python-${{ matrix.python-version }}
        path: safety-report.json
        retention-days: 7