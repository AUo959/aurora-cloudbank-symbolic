name: Project Board CI Sync

# This workflow mirrors CI state into durable PR labels so project automation
# can consume stable signals without requiring direct Projects API mutations.

on:
  workflow_run:
    workflows:
      - "Aurora CI (Minimal)"
      - "CodeQL"
      - "PR Evaluation"
      - "Constellation CI"
      - "Code Quality"
      - "Codacy Analysis"
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: read
  checks: read

jobs:
  sync-project-status:
    name: Sync Project Status Labels
    runs-on: ubuntu-latest
    steps:
      - name: Update status labels from aggregate CI state
        uses: actions/github-script@v7
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            const pr = workflowRun.pull_requests?.[0];

            if ((workflowRun.pull_requests?.length || 0) > 1) {
              core.notice(`Workflow run ${workflowRun.id} is linked to multiple PRs; using #${pr.number}.`);
            }

            if (!pr) {
              core.notice('No pull request associated with this workflow run; skipping.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pr.number;
            const sha = workflowRun.head_sha;
            const managedLabels = {
              'status: in-progress': {
                color: '0e8a16',
                description: 'CI is failing or still in flight; follow-up work is needed',
              },
              'status: review-needed': {
                color: 'fbca04',
                description: 'CI passed and the pull request is ready for reviewer attention',
              },
            };

            async function ensureLabel(name, config) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color: config.color,
                  description: config.description,
                });
              }
            }

            async function removeLabel(name) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: prNumber,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            const { data: checksForRef } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: sha,
              per_page: 100,
            });

            const { data: combinedStatus } = await github.rest.repos.getCombinedStatusForRef({
              owner,
              repo,
              ref: sha,
            });

            const checkRuns = checksForRef.check_runs;
            const completedChecks = checkRuns.filter((check) => check.status === 'completed');
            const successConclusions = new Set(['success', 'neutral', 'skipped']);
            const allCompletedChecksSucceeded = completedChecks.every(
              (check) => Boolean(check.conclusion) && successConclusions.has(check.conclusion)
            );
            const allSuccessful =
              checkRuns.length > 0 &&
              completedChecks.length === checkRuns.length &&
              allCompletedChecksSucceeded &&
              combinedStatus.state === 'success';

            const targetLabel = allSuccessful ? 'status: review-needed' : 'status: in-progress';

            for (const [name, config] of Object.entries(managedLabels)) {
              await ensureLabel(name, config);
            }

            for (const labelName of Object.keys(managedLabels)) {
              if (labelName !== targetLabel) {
                await removeLabel(labelName);
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: prNumber,
              labels: [targetLabel],
            });
