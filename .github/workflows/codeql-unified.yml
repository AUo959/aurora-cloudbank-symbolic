name: CodeQL
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  analyze:
    if: false
    runs-on: ubuntu-latest
    name: Analyze
    steps:
      - uses: actions/checkout@v2
      - name: Set up the CodeQL tool
        uses: github/codeql-action/setup@v1
      - name: Analyze code
        uses: github/codeql-action/analyze@v1