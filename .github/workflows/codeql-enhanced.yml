name: "🛡️ Enhanced CodeQL Security Analysis"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '15 2 * * 0'  # Weekly on Sunday at 2:15 AM

jobs:
  analyze:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: +security-and-quality
        config: |
          name: "Aurora Security Configuration"
          
          # Enhanced query suites for comprehensive security analysis
          queries:
            - uses: security-and-quality
            - uses: security-extended
          
          # Custom paths to scan
          paths-ignore:
            - node_modules
            - "**/*.test.js"
            - "**/*.spec.js"
            - venv_opal2
            - .git
          
          # Include additional paths for security scanning
          paths:
            - static/js
            - middleware
            - config
            - scripts
            - modules

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

  security-extras:
    name: Additional Security Checks
    runs-on: ubuntu-latest
    needs: analyze
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit
      run: |
        npm audit --audit-level=moderate --json > npm-audit-results.json || true
        echo "NPM Audit completed"

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Python security tools
      run: |
        pip install bandit[toml] safety semgrep
        echo "Security tools installed"

    - name: Run Bandit Python security analysis
      run: |
        bandit -r . -f sarif -o bandit-results.sarif --exclude ./venv_opal2,./node_modules,./.git || true
        echo "Bandit scan completed"

    - name: Run Safety dependency check
      run: |
        safety check --json --output safety-results.json || true
        echo "Safety check completed"

    - name: Run Semgrep security analysis
      run: |
        semgrep --config=auto --sarif --output=semgrep-results.sarif . || true
        echo "Semgrep scan completed"

    - name: Upload Bandit results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: bandit-results.sarif
        category: bandit

    - name: Upload Semgrep results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: semgrep-results.sarif
        category: semgrep

    - name: Create security summary
      run: |
        echo "# 🛡️ Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## CodeQL Analysis" >> $GITHUB_STEP_SUMMARY
        echo "✅ JavaScript and Python security analysis completed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Additional Security Tools" >> $GITHUB_STEP_SUMMARY
        echo "- 🐍 **Bandit**: Python security issues" >> $GITHUB_STEP_SUMMARY
        echo "- 📦 **Safety**: Python dependency vulnerabilities" >> $GITHUB_STEP_SUMMARY
        echo "- 🔍 **Semgrep**: Multi-language security patterns" >> $GITHUB_STEP_SUMMARY
        echo "- 📋 **npm audit**: JavaScript dependency vulnerabilities" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Check the Security tab for detailed findings." >> $GITHUB_STEP_SUMMARY

    - name: Archive security results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-scan-results
        path: |
          bandit-results.sarif
          semgrep-results.sarif
          safety-results.json
          npm-audit-results.json
        retention-days: 30
