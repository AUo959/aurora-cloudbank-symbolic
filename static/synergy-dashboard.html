<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:;">
    <title>Aurora Component Synergy Dashboard - R-2 Agent Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .dashboard-container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .dashboard-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .dashboard-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00f5ff, #ff00f5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .dashboard-header p {
            opacity: 0.8;
            font-size: 1.1rem;
        }
        
        .controls-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        .filter-button {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .filter-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .filter-button.active {
            background: linear-gradient(45deg, #00f5ff, #0080ff);
            border-color: #00f5ff;
        }
        
        .search-box {
            flex: 1;
            min-width: 250px;
        }
        
        .search-box input {
            width: 100%;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: #fff;
            font-size: 14px;
        }
        
        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        #metrics-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .metric-card h3 {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            color: #00f5ff;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .dashboard-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .dashboard-section h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 2px solid rgba(0, 245, 255, 0.3);
            padding-bottom: 10px;
        }
        
        #components-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        
        .component-card {
            background: rgba(255, 255, 255, 0.08);
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .component-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0, 245, 255, 0.3);
            border-color: #00f5ff;
        }
        
        .component-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .component-header h4 {
            font-size: 1.1rem;
        }
        
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: bold;
        }
        
        .health-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .health-bar {
            height: 100%;
            transition: width 0.5s;
        }
        
        .component-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            opacity: 0.8;
        }
        
        .detail-button {
            margin-top: 10px;
            width: 100%;
            padding: 8px;
            background: rgba(0, 245, 255, 0.2);
            border: 1px solid #00f5ff;
            border-radius: 5px;
            color: #00f5ff;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .detail-button:hover {
            background: rgba(0, 245, 255, 0.3);
            transform: scale(1.02);
        }
        
        #topology-visualization {
            min-height: 400px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .topology-node {
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .topology-node:hover {
            filter: brightness(1.5);
        }
        
        #interactions-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .interaction-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 3px solid #00f5ff;
        }
        
        .interaction-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        .arrow {
            color: #00f5ff;
        }
        
        .interaction-metrics {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            opacity: 0.8;
            flex-wrap: wrap;
        }
        
        #synergy-scores-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }
        
        .synergy-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .synergy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .synergy-header h4 {
            font-size: 0.95rem;
        }
        
        .trend-badge {
            font-size: 0.8rem;
            padding: 3px 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        
        .synergy-score {
            font-size: 2rem;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .integration-level {
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        
        .badge {
            padding: 2px 6px;
            background: rgba(0, 245, 255, 0.2);
            border-radius: 3px;
            color: #00f5ff;
        }
        
        .opportunities {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
        }
        
        .opportunities ul {
            margin-top: 5px;
            padding-left: 20px;
        }
        
        .opportunities li {
            margin: 5px 0;
            opacity: 0.8;
        }
        
        .detail-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 10px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .close-modal {
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
            padding: 0;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .detail-section {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .detail-section:last-child {
            border-bottom: none;
        }
        
        .detail-section h3 {
            margin-bottom: 10px;
            color: #00f5ff;
        }
        
        .interaction-detail {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .error-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #f44336;
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            z-index: 2000;
        }
        
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            #components-list {
                grid-template-columns: 1fr;
            }
            
            #synergy-scores-list {
                grid-template-columns: 1fr;
            }
            
            .dashboard-header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>Aurora Component Synergy Dashboard</h1>
            <p>R-2 Agent Component Monitoring & Integration Analytics</p>
        </div>
        
        <div class="controls-bar">
            <button class="filter-button active" data-filter="all">All Components</button>
            <button class="filter-button" data-filter="active">Active Only</button>
            <button class="filter-button" data-filter="degraded">Degraded</button>
            <button class="filter-button" data-filter="offline">Offline</button>
            <div class="search-box">
                <input type="text" id="component-search" placeholder="Search components...">
            </div>
        </div>
        
        <div id="metrics-summary"></div>
        
        <div class="dashboard-grid">
            <div class="dashboard-section">
                <h2>Component Topology</h2>
                <div id="topology-visualization"></div>
            </div>
            
            <div class="dashboard-section">
                <h2>Component Interactions</h2>
                <div id="interactions-list"></div>
            </div>
        </div>
        
        <div class="dashboard-section">
            <h2>Active Components</h2>
            <div id="components-list"></div>
        </div>
        
        <div class="dashboard-section">
            <h2>Synergy Scores & Optimization Opportunities</h2>
            <div id="synergy-scores-list"></div>
        </div>
    </div>
    
    <script src="/static/js/synergy-dashboard.js"></script>
</body>
</html>
