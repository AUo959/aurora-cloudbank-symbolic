name: Verify Aurora App Access

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Verify secrets are present
        run: |
          if [ -z "${{ secrets.APP_ID }}" ]; then echo "APP_ID missing"; exit 1; fi
          if [ -z "${{ secrets.INSTALLATION_ID }}" ]; then echo "INSTALLATION_ID missing"; exit 1; fi
          if [ -z "${{ secrets.PRIVATE_KEY }}" ]; then echo "PRIVATE_KEY missing"; exit 1; fi
          echo "✅ All secrets are set."

      - name: Generate JWT and fetch installation ID
        env:
          APP_ID: ${{ secrets.APP_ID }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          pip install PyJWT requests cryptography
          python - <<'EOF'
          import jwt, time, requests, os
          APP_ID = os.environ["APP_ID"]
          PRIVATE_KEY = os.environ["PRIVATE_KEY"]
          payload = {
              "iat": int(time.time()) - 60,
              "exp": int(time.time()) + (10 * 60),
              "iss": APP_ID
          }
          token = jwt.encode(payload, PRIVATE_KEY, algorithm="RS256")
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
          r = requests.get("https://api.github.com/app/installations", headers=headers)
          print("Installations:", r.json())
          EOF
