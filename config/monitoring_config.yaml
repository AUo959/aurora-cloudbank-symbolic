# R-2 Agent Monitoring Configuration

# Alert Configuration
alert_config:
  # Delay before notifying for info-level alerts (seconds)
  info_notify_delay_seconds: 300  # 5 minutes
  
  # Delay before notifying for warning-level alerts (seconds)
  warning_notify_delay_seconds: 60  # 1 minute
  
  # Notify immediately for critical alerts
  critical_notify_immediate: true
  
  # Enable automated interventions
  enable_auto_intervention: true
  
  # Cooldown period between interventions (seconds)
  intervention_cooldown_seconds: 300  # 5 minutes
  
  # Maximum violations allowed per hour before escalation
  max_violations_per_hour: 10

# Drift Detection Configuration
drift_detection:
  # Z-score threshold for anomaly detection
  z_score_threshold: 3.0
  
  # Moving average window size
  moving_avg_window: 10
  
  # Thresholds for relative change detection
  thresholds:
    info: 0.2      # 20% deviation
    warning: 0.5   # 50% deviation
    critical: 0.8  # 80% deviation

# Behavioral Monitoring Configuration
behavioral_monitoring:
  # Hours to retain metrics history
  retention_hours: 168  # 1 week
  
  # Standard metrics to track (enabled by default)
  standard_metrics:
    - decisions_made
    - decision_latency_ms
    - decision_changes
    - resources_allocated
    - resource_efficiency
    - human_interactions
    - override_requests
    - explanation_requests
    - success_rate
    - error_rate
    - timeout_rate
    - ethics_checks_passed
    - ethics_violations
    - safety_incidents
  
  # Custom metrics specific to R-2 operations
  custom_metrics:
    - deployment_success_rate
    - code_health_score
    - dependency_conflicts
    - config_drift_incidents

# Storage Configuration
storage:
  # Base directory for monitoring data
  base_dir: "./monitoring_data"
  
  # Audit log file
  audit_log: "audit_log.json"
  
  # Backup audit logs
  backup_enabled: true
  backup_frequency_hours: 24
  
  # Compression for old data
  compress_old_data: true
  compress_after_days: 30

# Ethics Rules Configuration
ethics_rules:
  # Path to ethics rules file
  rules_file: "./ethics/validation_engine/validation_rules.json"
  
  # Enable/disable specific rule categories
  categories:
    mission_ethics: true
    resource_ethics: true
    ai_ethics: true
    safety: true
    transparency: true
    fairness: true
  
  # Auto-block severity levels
  auto_block_severities:
    - critical
    - high

# Intervention Configuration
interventions:
  # Available intervention types and their configurations
  types:
    block_action:
      enabled: true
      requires_approval: false
    
    request_review:
      enabled: true
      notify_roles:
        - technical_lead
        - security_team
    
    notify_operator:
      enabled: true
      channels:
        - slack
        - email
    
    throttle_agent:
      enabled: true
      throttle_percentage: 50  # Reduce activity by 50%
      duration_minutes: 15
    
    suspend_agent:
      enabled: true
      requires_approval: true
      max_suspension_hours: 24
    
    reset_baseline:
      enabled: true
      requires_approval: true

# Dashboard Configuration
dashboard:
  # Enable web dashboard
  enabled: true
  
  # Auto-refresh interval (seconds)
  refresh_interval: 30
  
  # Default time ranges for filters
  default_time_ranges:
    - 1    # 1 hour
    - 24   # 24 hours
    - 168  # 1 week
  
  # Maximum entries to display per section
  max_entries_per_section: 50

# Notification Configuration
notifications:
  # Email notifications
  email:
    enabled: false
    smtp_server: "smtp.example.com"
    smtp_port: 587
    from_address: "monitoring@aurora-cloudbank.com"
    recipients:
      critical:
        - oncall@aurora-cloudbank.com
      warning:
        - team@aurora-cloudbank.com
  
  # Slack notifications
  slack:
    enabled: false
    webhook_url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
    channels:
      critical: "#alerts-critical"
      warning: "#alerts-warning"
      info: "#alerts-info"
  
  # PagerDuty integration
  pagerduty:
    enabled: false
    api_key: "YOUR_API_KEY"
    service_id: "YOUR_SERVICE_ID"

# Reporting Configuration
reporting:
  # Automatic report generation
  auto_generate: true
  
  # Report generation frequency
  frequency: "daily"  # daily, weekly, monthly
  
  # Report formats
  formats:
    - json
    - csv
  
  # Report recipients
  recipients:
    - compliance@aurora-cloudbank.com
    - management@aurora-cloudbank.com
  
  # Report retention
  retention_days: 365

# Integration Configuration
integrations:
  # FastAPI integration
  fastapi:
    enabled: true
    prefix: "/monitoring"
    
  # Prometheus metrics export
  prometheus:
    enabled: false
    port: 9090
  
  # OpenTelemetry
  opentelemetry:
    enabled: false
    endpoint: "http://localhost:4318"

# Security Configuration
security:
  # Audit log signing
  audit_signing:
    enabled: true
    algorithm: "HMAC-SHA256"
    # Key should be stored in environment variable: MONITORING_SIGNING_KEY
  
  # API authentication
  api_auth:
    enabled: true
    # Token should be stored in environment variable: MONITORING_API_TOKEN
  
  # Encryption for sensitive data
  encryption:
    enabled: false
    algorithm: "AES-256-GCM"
    # Key should be stored in environment variable: MONITORING_ENCRYPTION_KEY

# Logging Configuration
logging:
  # Log level
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  
  # Log format
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # Log to file
  file:
    enabled: true
    path: "./logs/monitoring.log"
    max_bytes: 10485760  # 10MB
    backup_count: 5
  
  # Log to console
  console:
    enabled: true

# Performance Configuration
performance:
  # Async processing
  async_enabled: true
  
  # Worker threads
  worker_threads: 4
  
  # Batch processing
  batch_size: 100
  batch_interval_seconds: 60
  
  # Cache configuration
  cache:
    enabled: true
    max_size: 1000
    ttl_seconds: 300

# Maintenance Configuration
maintenance:
  # Automatic cleanup
  auto_cleanup: true
  
  # Cleanup schedule (cron format)
  cleanup_schedule: "0 2 * * *"  # Daily at 2 AM
  
  # Data retention policies
  retention_policies:
    alerts: 30  # days
    violations: 90  # days
    audit_log: 365  # days (never delete)
    metrics: 30  # days
  
  # Database optimization
  optimize_schedule: "0 3 * * 0"  # Weekly on Sunday at 3 AM
