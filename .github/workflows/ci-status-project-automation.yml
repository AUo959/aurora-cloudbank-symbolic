name: CI Status Project Automation

# This workflow manages project board status based on CI/test results
# - When CI/tests fail: move items to 'In Progress' with warning
# - When CI passes: move PRs to 'In Review', issues to 'Ready' or 'Done'
# - Display CI/test status on project cards

on:
  status:
  check_suite:
    types: [completed]
  check_run:
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["*"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: read
  checks: read

jobs:
  update-project-on-ci-status:
    name: Update Project Based on CI Status
    runs-on: ubuntu-latest
    steps:
      - name: Get PR or Issue Info
        id: get-info
        uses: actions/github-script@v7
        with:
          script: |
            const context_name = context.eventName;
            let item_number = null;
            let item_type = null;
            let sha = null;
            
            // Determine the item (PR or issue) and commit SHA
            if (context.payload.pull_request) {
              item_number = context.payload.pull_request.number;
              item_type = 'pull_request';
              sha = context.payload.pull_request.head.sha;
            } else if (context.payload.issue) {
              item_number = context.payload.issue.number;
              item_type = 'issue';
            } else if (context.payload.check_suite) {
              // Get PRs associated with this check suite
              const prs = context.payload.check_suite.pull_requests;
              if (prs && prs.length > 0) {
                item_number = prs[0].number;
                item_type = 'pull_request';
              }
              sha = context.payload.check_suite.head_sha;
            } else if (context.payload.check_run) {
              const prs = context.payload.check_run.pull_requests;
              if (prs && prs.length > 0) {
                item_number = prs[0].number;
                item_type = 'pull_request';
              }
              sha = context.payload.check_run.head_sha;
            } else if (context.payload.workflow_run) {
              const prs = context.payload.workflow_run.pull_requests;
              if (prs && prs.length > 0) {
                item_number = prs[0].number;
                item_type = 'pull_request';
              }
              sha = context.payload.workflow_run.head_sha;
            }
            
            core.setOutput('item_number', item_number);
            core.setOutput('item_type', item_type);
            core.setOutput('sha', sha);

      - name: Check CI Status
        id: check-ci
        if: steps.get-info.outputs.sha
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.get-info.outputs.sha }}';
            
            // Get all check runs for this commit
            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha
            });
            
            // Get combined status
            const { data: combinedStatus } = await github.rest.repos.getCombinedStatusForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha
            });
            
            // Determine overall status
            let ci_passed = true;
            let ci_status = 'success';
            let failed_checks = [];
            
            // Check if any required checks failed
            for (const check of checkRuns.check_runs) {
              if (check.conclusion === 'failure' || check.conclusion === 'cancelled' || check.conclusion === 'timed_out') {
                ci_passed = false;
                ci_status = 'failure';
                failed_checks.push(check.name);
              }
            }
            
            // Also check commit statuses
            if (combinedStatus.state === 'failure' || combinedStatus.state === 'error') {
              ci_passed = false;
              ci_status = 'failure';
            }
            
            core.setOutput('ci_passed', ci_passed);
            core.setOutput('ci_status', ci_status);
            core.setOutput('failed_checks', failed_checks.join(', '));

      - name: Update CI Status (Smart, Non-Spammy)
        if: steps.get-info.outputs.item_number
        uses: actions/github-script@v7
        env:
          ITEM_NUMBER: ${{ steps.get-info.outputs.item_number }}
          ITEM_TYPE: ${{ steps.get-info.outputs.item_type }}
          CI_PASSED: ${{ steps.check-ci.outputs.ci_passed }}
          FAILED_CHECKS: ${{ steps.check-ci.outputs.failed_checks }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const AuroraBot = require('./.github/scripts/bot-helper.js');
            const bot = new AuroraBot(github, context);
            
            const itemNumber = parseInt(process.env.ITEM_NUMBER);
            const itemType = process.env.ITEM_TYPE;
            const ciPassed = process.env.CI_PASSED === 'true';
            const failedChecks = process.env.FAILED_CHECKS;
            
            // Only comment on state changes or critical failures
            const shouldComment = bot.config.ci_status_automation?.comments?.only_on_state_change ?? true;
            
            if (ciPassed) {
              // Only comment on success if configured to do so (usually after a failure)
              console.log('✅ CI passed, updating labels silently');
              
              // Update labels silently
              await bot.manageLabels(itemNumber, ['ci: passed'], 'ci', true);
              
              // Don't spam with success comments
              return;
            }
            
            // CI failed - check if we should comment
            const failedList = failedChecks.split(', ');
            const minThreshold = bot.config.ci_status_automation?.comments?.failure_threshold || 3;
            
            if (failedList.length < minThreshold && !failedList.some(c => c.includes('security') || c.includes('test'))) {
              console.log(`Only ${failedList.length} non-critical checks failed, updating labels silently`);
              await bot.manageLabels(itemNumber, ['ci: failed'], 'ci', true);
              return;
            }
            
            // Critical failures - post actionable comment
            const commentData = {
              title: 'CI Status Update',
              status: '⚠️ Checks Failed',
              statusEmoji: '⚠️',
              criticalIssues: failedList.slice(0, 5).map(check => `**${check}**`),
              nextSteps: 'Review failed checks and push fixes. CI will re-run automatically.',
              actionItems: [
                'Check the Details link for each failed check',
                'Fix the issues locally and test',
                'Push your fixes to trigger a new CI run'
              ]
            };
            
            const commentBody = bot.formatComment(commentData, 'actionable');
            
            await bot.postComment(itemNumber, commentBody, {
              identifier: 'ci-status',
              updateExisting: true
            });
            
            await bot.manageLabels(itemNumber, ['ci: failed'], 'ci', true);

  add-ci-status-to-cards:
    name: Display CI Status on Project Cards
    runs-on: ubuntu-latest
    if: github.event.pull_request || github.event.issue
    steps:
      - name: Add CI Status Label (Silent)
        uses: actions/github-script@v7
        with:
          script: |
            const item_number = context.payload.pull_request?.number || context.payload.issue?.number;
            const sha = context.payload.pull_request?.head?.sha;
            
            if (!sha) {
              console.log('No SHA available, skipping');
              return;
            }
            
            // Get CI status
            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha
            });
            
            // Determine status label
            let statusLabel = 'ci: pending';
            const hasFailures = checkRuns.check_runs.some(c => c.conclusion === 'failure');
            const allSuccess = checkRuns.check_runs.length > 0 && 
                              checkRuns.check_runs.every(c => 
                                c.conclusion === 'success' || 
                                c.conclusion === 'skipped' ||
                                c.conclusion === null
                              );
            
            if (hasFailures) {
              statusLabel = 'ci: failed';
            } else if (allSuccess) {
              statusLabel = 'ci: passed';
            }
            
            // Remove old CI labels silently
            const labels = ['ci: pending', 'ci: passed', 'ci: failed'];
            for (const label of labels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: item_number,
                  name: label
                });
              } catch (e) {
                // Label doesn't exist, ignore
              }
            }
            
            // Add current status label silently
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item_number,
                labels: [statusLabel]
              });
              console.log(`✅ Updated CI label to: ${statusLabel}`);
            } catch (e) {
              console.log(`⚠️ Could not add label: ${e.message}`);
            }
