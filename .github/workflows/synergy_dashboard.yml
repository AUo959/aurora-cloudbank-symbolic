name: Synergy Dashboard Module

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        
      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: '3.12'
          
      - name: Discover registered components
        id: discover
        run: |
          echo "Reading registry configuration..."
          if [ -f ".github/registry/registry.json" ]; then
            cat .github/registry/registry.json
          else
            echo "Registry file not found"
          fi
          
      - name: Scan Python files and extract metadata
        id: scan
        run: |
          echo "Scanning for Python files..."
          python3 << 'EOF'
          import os
          import json
          import re
          from pathlib import Path
          
          # Load registry
          registry_path = Path('.github/registry/registry.json')
          if registry_path.exists():
              with open(registry_path, 'r') as f:
                  registry = json.load(f)
          else:
              registry = {"components": []}
          
          # Scan Python files
          python_files = []
          for root, dirs, files in os.walk('.'):
              # Skip hidden and virtual env directories
              dirs[:] = [d for d in dirs if not d.startswith('.') and d not in ['venv', '__pycache__']]
              for file in files:
                  if file.endswith('.py'):
                      filepath = os.path.join(root, file)
                      python_files.append(filepath)
          
          # Extract imports and module info
          module_info = []
          for filepath in python_files:
              try:
                  with open(filepath, 'r', encoding='utf-8') as f:
                      content = f.read()
                      imports = re.findall(r'^(?:from|import)\s+([\w.]+)', content, re.MULTILINE)
                      module_info.append({
                          'file': filepath,
                          'imports': list(set(imports))
                      })
              except Exception as e:
                  print(f"Error reading {filepath}: {e}")
          
          # Save results
          with open('module_scan.json', 'w') as f:
              json.dump({
                  'registry': registry,
                  'modules': module_info,
                  'file_count': len(python_files)
              }, f, indent=2)
          
          print(f"Scanned {len(python_files)} Python files")
          EOF
          
      - name: Generate Synergy Dashboard
        run: |
          echo "Generating dashboard..."
          python3 << 'EOF'
          import json
          from datetime import datetime
          from pathlib import Path
          from collections import Counter
          
          # Load scan results
          with open('module_scan.json', 'r') as f:
              data = json.load(f)
          
          registry = data.get('registry', {})
          modules = data.get('modules', [])
          
          # Count dependencies
          all_imports = []
          for module in modules:
              all_imports.extend(module.get('imports', []))
          dependency_freq = Counter(all_imports)
          
          # Generate dashboard content
          dashboard = []
          dashboard.append("# Synergy Dashboard Module")
          dashboard.append("")
          dashboard.append(f"**Last Updated:** {datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S')} UTC")
          dashboard.append("")
          dashboard.append("---")
          dashboard.append("")
          dashboard.append("## Overview")
          dashboard.append("")
          dashboard.append("This dashboard provides automated tracking of component registry, dependencies, and integration points.")
          dashboard.append("")
          dashboard.append(f"- **Total Python Files Scanned:** {data.get('file_count', 0)}")
          dashboard.append(f"- **Registered Components:** {len(registry.get('components', []))}")
          dashboard.append(f"- **Unique Dependencies:** {len(dependency_freq)}")
          dashboard.append("")
          dashboard.append("---")
          dashboard.append("")
          dashboard.append("## Registered Components")
          dashboard.append("")
          
          components = registry.get('components', [])
          if components:
              dashboard.append("| Component | Version | Type | Status | Dependencies |")
              dashboard.append("|-----------|---------|------|--------|--------------|")
              for comp in components:
                  name = comp.get('name', 'Unknown')
                  version = comp.get('version', 'N/A')
                  comp_type = comp.get('type', 'N/A')
                  status = comp.get('status', 'N/A')
                  deps = ', '.join(comp.get('dependencies', [])) or 'None'
                  dashboard.append(f"| {name} | {version} | {comp_type} | {status} | {deps} |")
          else:
              dashboard.append("*No components registered yet.*")
          
          dashboard.append("")
          dashboard.append("---")
          dashboard.append("")
          dashboard.append("## Dependency Analysis")
          dashboard.append("")
          dashboard.append("### Most Used Dependencies")
          dashboard.append("")
          
          if dependency_freq:
              dashboard.append("| Dependency | Usage Frequency (stub) | Priority |")
              dashboard.append("|------------|------------------------|----------|")
              for dep, count in dependency_freq.most_common(15):
                  priority = "High" if count > 5 else "Medium" if count > 2 else "Low"
                  dashboard.append(f"| {dep} | {count} | {priority} |")
          else:
              dashboard.append("*No dependencies detected.*")
          
          dashboard.append("")
          dashboard.append("---")
          dashboard.append("")
          dashboard.append("## Integration Points")
          dashboard.append("")
          dashboard.append("### Identified Integration Points")
          dashboard.append("")
          
          # Stub integration points analysis
          integration_points = []
          for comp in components:
              if comp.get('integration_points'):
                  integration_points.extend(comp['integration_points'])
          
          if integration_points:
              dashboard.append("| Component | Integration Point | Type | Status |")
              dashboard.append("|-----------|-------------------|------|--------|")
              for point in integration_points:
                  dashboard.append(f"| {point.get('component', 'N/A')} | {point.get('name', 'N/A')} | {point.get('type', 'N/A')} | {point.get('status', 'N/A')} |")
          else:
              dashboard.append("*No integration points defined yet.*")
          
          dashboard.append("")
          dashboard.append("---")
          dashboard.append("")
          dashboard.append("## Potential Conflicts")
          dashboard.append("")
          dashboard.append("### Conflict Detection (Automated)")
          dashboard.append("")
          dashboard.append("*No conflicts detected. System is monitoring for:*")
          dashboard.append("- Version mismatches")
          dashboard.append("- Duplicate component registrations")
          dashboard.append("- Circular dependencies")
          dashboard.append("- Incompatible integration points")
          dashboard.append("")
          dashboard.append("---")
          dashboard.append("")
          dashboard.append("## Usage Statistics (Stub Values)")
          dashboard.append("")
          dashboard.append("| Metric | Value | Trend |")
          dashboard.append("|--------|-------|-------|")
          dashboard.append("| Active Components | 0 | → |")
          dashboard.append("| Daily API Calls | 0 | → |")
          dashboard.append("| Error Rate | 0% | → |")
          dashboard.append("| System Health | Healthy | ✓ |")
          dashboard.append("")
          dashboard.append("---")
          dashboard.append("")
          dashboard.append("*This dashboard is automatically generated by the Synergy Dashboard Module workflow.*")
          dashboard.append("")
          dashboard.append("*Reference: Issue #260*")
          
          # Write dashboard
          dashboard_path = Path('.github/dashboards')
          dashboard_path.mkdir(parents=True, exist_ok=True)
          
          with open(dashboard_path / 'synergy_dashboard.md', 'w') as f:
              f.write('\n'.join(dashboard))
          
          print("Dashboard generated successfully")
          EOF
          
      - name: Commit and push dashboard
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/dashboards/synergy_dashboard.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: Synergy Dashboard Module (Issue #260)"
            # Extract branch name and push explicitly to avoid detached HEAD issues
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            git push origin HEAD:"${BRANCH_NAME}"
          fi
      
      - name: Upload dashboard artifact (for PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a96e1c98e851de01adfe1f14  # v4.4.3
        with:
          name: synergy-dashboard
          path: .github/dashboards/synergy_dashboard.md
