name: Auto Labeler

on:
  push:
    branches:
      - main

jobs:
  label:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13  # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          config: .github/labeler.yml