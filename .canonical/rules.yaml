# Aurora CloudBank Canonical Validation Rules
version: "1.0"

rules:
  branch_naming:
    enabled: true
    patterns:
      - "main"
      - "feature/*"
      - "fix/*"
      - "R-*"
      - "codex/*"
  
  commit_messages:
    enabled: true
    require_prefix: false
    min_length: 10
  
  file_structure:
    enabled: true
    required_dirs:
      - "src"
      - "modules"
      - "scripts"
      - "tests"
  
  code_quality:
    enabled: true
    check_syntax: true
    check_imports: true
