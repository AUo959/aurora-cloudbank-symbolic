[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | deploykit_tmp
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = [".venv/*", "deploykit_tmp/*"]

[tool.pylint.messages_control]
disable = [
    "C0103",  # Invalid name
    "C0114",  # Missing module docstring
    "C0115",  # Missing class docstring
    "C0116",  # Missing function docstring
    "R0903",  # Too few public methods
    "W0613",  # Unused argument
]

[tool.pylint.format]
max-line-length = 120

[tool.autopep8]
max_line_length = 120
ignore = ["E501", "W6"]
in-place = true
recursive = true
aggressive = 1

[tool.pytest.ini_options]
# Test discovery and execution
minversion = "6.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=tests",
    "--cov=modules",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=30",
    "-p", "no:warnings",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# asyncio_mode = "auto"  # Commented out - requires pytest-asyncio

# Performance optimized markers for selective testing
markers = [
    # Speed-based markers
    "unit: Fast unit tests (< 1 second)",
    "integration: Integration tests (1-10 seconds)",
    "slow: Slow tests (> 10 seconds)",
    "smoke: Critical smoke tests for quick validation",

    # Component-based markers
    "opal2: Opal2 modular system tests",
    "aurora: Aurora core system tests",
    "quantum: Quantum processing tests",
    "security: Security and authentication tests",
    "api: API and web interface tests",
    "cli: Command line interface tests",
    "git: Git operations and workflow tests",

    # Environment markers
    "local: Tests for local development only",
    "ci: Tests for CI/CD pipeline",
    "gpu: Tests requiring GPU acceleration",
    "network: Tests requiring network access",

    # Priority markers
    "critical: Must-pass tests for production",
    "regression: Regression prevention tests",
    "performance: Performance and benchmarking tests",
    "memory: Memory usage and optimization tests",
]

# Test filtering options
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning",
]
