name: ✨ Feature Request
description: Suggest a new feature or enhancement for Aurora CloudBank Symbolic
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Help us understand your idea.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm frustrated when... / It would be helpful if...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      placeholder: I'd like to see... / The system should...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe alternatives you've considered
      placeholder: Alternative approaches could include...

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component would this affect?
      options:
        - Field State Manager
        - Geometric Ethics
        - Signal Propagation
        - Memory Compression
        - API (FastAPI)
        - ChatGPT Agent Mode
        - Claude Sonnet Integration
        - Quantum Processing
        - VSA (Vector Symbolic Architecture)
        - CLI Tools
        - Testing/CI
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical (blocking work)
        - High (significant impact)
        - Medium (nice to have)
        - Low (minor improvement)
    validations:
      required: true

  - type: checkboxes
    id: implementation
    attributes:
      label: Implementation Willingness
      description: Are you willing to help implement this?
      options:
        - label: I'd like to implement this feature myself
          required: false
        - label: I can help test this feature
          required: false
        - label: I can help with documentation
          required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, mockups, or examples
      placeholder: Add diagrams, examples, or references...

  - type: checkboxes
    id: alignment
    attributes:
      label: Aurora Alignment
      description: Does this align with Aurora's principles?
      options:
        - label: This feature supports organic field dynamics (not centralized control)
          required: false
        - label: This feature enhances consciousness/awareness properties
          required: false
        - label: This feature maintains ethical validation principles
          required: false
        - label: This feature respects DLP (Data Lineage Protocol) tracking
          required: false
