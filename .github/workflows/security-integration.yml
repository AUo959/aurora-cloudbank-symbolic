name: Security Integration Workflow

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Mondays at 2 AM

# Explicit permissions for security
permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write
  checks: write

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          fi

      - name: Run Aurora Security Audit
        run: |
          chmod +x scripts/security_audit.sh
          ./scripts/security_audit.sh

      - name: Check for XSS vulnerabilities
        run: |
          echo "🔍 Checking for XSS vulnerabilities..."

          # Check for unsafe innerHTML usage
          if grep -r "innerHTML.*+=" --include="*.html" --include="*.js" . | grep -v "AuroraSecurity\|createSafeElement"; then
            echo "❌ Unsafe innerHTML usage found"
            exit 1
          else
            echo "✅ No unsafe innerHTML usage detected"
          fi

          # Check for missing CSP headers
          html_files=$(find . -name "*.html" -not -path "./node_modules/*")
          for file in $html_files; do
            if ! grep -q "Content-Security-Policy" "$file"; then
              echo "⚠️ Missing CSP in $file"
            else
              echo "✅ CSP found in $file"
            fi
          done

      - name: Validate workflow permissions
        run: |
          echo "🔑 Validating workflow permissions..."

          workflow_files=$(find .github/workflows -name "*.yml" 2>/dev/null || true)
          if [ -z "$workflow_files" ]; then
            echo "ℹ️ No workflow files found"
          else
            for file in $workflow_files; do
              if grep -q "permissions:" "$file"; then
                echo "✅ Explicit permissions found in $(basename $file)"
              else
                echo "❌ Missing explicit permissions in $(basename $file)"
                exit 1
              fi
            done
          fi

      - name: Security dependency check
        run: |
          echo "📦 Checking for security vulnerabilities in dependencies..."

          if [ -f package.json ]; then
            # Run npm audit
            if npm audit --audit-level high; then
              echo "✅ No high-severity vulnerabilities found"
            else
              echo "❌ High-severity vulnerabilities detected"
              npm audit --audit-level high --json > security-report.json || true
              if [ -f security-report.json ]; then
                echo "Security report generated"
              fi
            fi
          fi

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: |
            security-report.json
            audit-results.txt
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 🔐 Security Audit Results

            ❌ **Security issues detected in this PR**

            Please review and fix the security vulnerabilities before merging:

            1. Check for XSS vulnerabilities in HTML/JavaScript files
            2. Ensure all workflow files have explicit permissions
            3. Review dependency vulnerabilities

            Run \`./scripts/security_audit.sh\` locally to see detailed results.

            📊 **Artifacts**: Security audit report is available in the workflow artifacts.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'python' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
