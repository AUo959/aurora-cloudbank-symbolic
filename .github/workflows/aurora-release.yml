name: Aurora Release Pipeline

'on':
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: v1.0.0

permissions:
  contents: write

concurrency:
  group: aurora-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          else
            echo "value=${RELEASE_VERSION_INPUT}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Generate changelog
        run: git log --oneline --since="1 month ago" > CHANGELOG.md || true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Aurora CloudBank ${{ steps.version.outputs.value }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: true
