[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

# ------------------------------------------------------------------
# PEP 621 project metadata (#836)
#
# This block supersedes the historic setup.py. The dependency list is
# loaded dynamically from requirements*.txt so there is a single source
# of truth for human edits AND the build backend.
#
# Tracked by:
#   #831  upper-bound pins on critical packages
#   #787  reproducible lock file in CI
#   #835  --require-hashes installs
#   #834  Python floor (>=3.11)
# ------------------------------------------------------------------
[project]
name = "aurora-cloudbank-symbolic"
version = "1.0.0"
description = "Quantum-Symbolic Computing Platform with AI Integration"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Aurora CloudBank Contributors" }]
keywords = ["quantum", "symbolic", "ai", "fastapi", "memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dynamic = ["dependencies", "optional-dependencies"]

[project.urls]
Homepage = "https://github.com/AUo959/aurora-cloudbank-symbolic"
Issues = "https://github.com/AUo959/aurora-cloudbank-symbolic/issues"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies.dev = { file = ["requirements-dev.txt"] }
optional-dependencies.optional = { file = ["requirements-optional.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | deploykit_tmp
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = [".venv/*", "deploykit_tmp/*"]

[tool.pylint.messages_control]
disable = [
    "C0103",  # Invalid name
    "C0114",  # Missing module docstring
    "C0115",  # Missing class docstring
    "C0116",  # Missing function docstring
    "R0903",  # Too few public methods
    "W0613",  # Unused argument
]

[tool.pylint.format]
max-line-length = 120

[tool.autopep8]
max_line_length = 120
ignore = ["E501", "W6"]
in-place = true
recursive = true
aggressive = 1

[tool.pytest.ini_options]
# Test discovery and execution
minversion = "6.0"
addopts = [
    "-ra",
    "-v",
    # "--timeout=300",  # 5 minute timeout per test (requires pytest-timeout)
    # "--timeout-method=thread",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

# Performance optimized markers for selective testing
markers = [
    # Speed-based markers
    "unit: Fast unit tests (< 1 second)",
    "integration: Integration tests (1-10 seconds)",
    "slow: Slow tests (> 10 seconds)",
    "smoke: Critical smoke tests for quick validation",

    # Component-based markers
    "native: Native implementation tests",
    "opal2: Opal2 modular system tests",
    "aurora: Aurora core system tests",
    "quantum: Quantum processing tests",
    "simulation: Simulation engine tests",
    "security: Security and authentication tests",
    "api: API and web interface tests",
    "cli: Command line interface tests",
    "resilience: Resilience Sentinel monitoring tests",
    "improvement: Code improvement engine tests",
    "bridge_v2: Thread Transfer Bridge V2 tests",
    "synergy: Synergy module integration tests",
    "observability: Telemetry and observability tests",
    "ai: AI and unified AI interface tests",
    "benchmark: Performance benchmarking tests",

    # Environment markers
    "local: Tests for local development only",
    "ci: Tests for CI/CD pipeline",
    "network: Tests requiring network access",

    # Priority markers
    "critical: Must-pass tests for production",
    "regression: Regression prevention tests",
    "performance: Performance and benchmarking tests",

    # Domain-specific markers
    "flightcontrol: Flight control infrastructure tests",
]

# Fix pytest-asyncio deprecation warning
asyncio_default_fixture_loop_scope = "function"
