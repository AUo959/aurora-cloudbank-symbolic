name: 🛡️ Aurora Enhanced Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM

jobs:
  comprehensive-security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || pip install bandit[toml] safety
    
    - name: 🔍 Multi-Tool Security Scan
      run: |
        # Bandit for Python security
        bandit -r . -f sarif -o bandit-results.sarif || true
        
        # Safety for dependency vulnerabilities
        safety check --json > safety-results.json || true
        
        # Basic security checks
        echo "🔍 Running basic security checks..."
        if grep -r "password.*=" --include="*.py" src/ 2>/dev/null | grep -v "\*\*\*"; then
          echo "⚠️ Check for hardcoded passwords"
        fi
        echo "✅ Security scan completed"
    
    - name: 📊 Upload Security Results
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: bandit-results.sarif
        category: bandit
      continue-on-error: true
    
    - name: 🚨 Security Alert on High Severity
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          console.log('🔐 Security scan completed with findings')
      continue-on-error: true
