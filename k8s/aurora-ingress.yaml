---
# Certificate for TLS (if using cert-manager)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aurora-tls-cert
  namespace: aurora-cloudbank
  labels:
    app: aurora-gui-cloudhub
  annotations:
    aurora.io/chain-notation: "#K8S//CERT//AURORA_TLS//"
spec:
  secretName: aurora-tls-cert
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - aurora.example.com
  - www.aurora.example.com
  - api.aurora.example.com
  duration: 2160h  # 90 days
  renewBefore: 360h  # 15 days before expiry

---
# ClusterIssuer for Let's Encrypt (if using cert-manager)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    aurora.io/chain-notation: "#K8S//ISSUER//LETSENCRYPT//"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@aurora.example.com  # Replace with your email
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          class: nginx
