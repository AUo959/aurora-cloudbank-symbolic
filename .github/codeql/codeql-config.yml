name: "Aurora CodeQL Unified Config"

queries:
  - uses: security-extended

paths:
  - src
  - modules
  - scripts
  - tools

paths-ignore:
  - tests
  - "**/*_test.py"
  - "**/*test*.py"
  - node_modules
  - venv
  - .venv
  - __pycache__
  - "*.pyc"
  - CASK_Assets.zip
  - "**/*.zip"
  - "**/*.gz"
  - "**/*.tar"
