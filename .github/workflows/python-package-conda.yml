name: Python Package using Conda

on: 
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Add conda to system path
      run: |
        # $CONDA is an environment variable pointing to the root of the miniconda directory
        echo $CONDA/bin >> $GITHUB_PATH
        
    - name: Install dependencies
      run: |
        if [ -f environment.yml ]; then
          conda env update --file environment.yml --name base
        else
          echo "⚠️ environment.yml not found, using fallback"
          conda install python=3.11 pip numpy pandas
          pip install -r requirements.txt
        fi
        
    - name: Lint with flake8
      run: |
        conda install flake8 -y || pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "⚠️ Critical errors found"
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Test with pytest
      run: |
        conda install pytest -y || pip install pytest
        pytest tests/test_aurora_symbolic.py -v || echo "⚠️ Some tests failed"
