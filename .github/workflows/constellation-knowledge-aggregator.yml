name: "Constellation Knowledge Aggregator"

# Triggered by repository_dispatch from QGIA spoke repos
on:
  repository_dispatch:
    types: [qgia.knowledge.updated]

  # Also allow manual trigger for testing
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source repo to aggregate from"
        required: false
        default: "all"

permissions:
  contents: write

concurrency:
  group: constellation-knowledge-aggregator-main
  cancel-in-progress: false

jobs:
  aggregate:
    name: Aggregate Knowledge Indexes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync latest main before aggregation
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Log trigger info
        run: |
          echo "Event type: ${{ github.event.action }}"
          echo "Source node: ${{ github.event.client_payload.source_node }}"
          echo "Source repo: ${{ github.event.client_payload.source_repo }}"
          echo "Correlation ID: ${{ github.event.client_payload.correlation_id }}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Run aggregator
        run: python scripts/aggregate-knowledge-indexes.py

      - name: Commit aggregated index
        run: |
          git config user.name "aurora-constellation[bot]"
          git config user.email "aurora-constellation[bot]@users.noreply.github.com"
          git add knowledge-indexes/
          if git diff --cached --quiet; then
            echo "No knowledge-index changes to commit."
            exit 0
          fi
          git commit -m "chore: aggregate knowledge indexes from ${{ github.event.client_payload.source_node || 'manual' }} [skip ci]"
          git pull --rebase origin main
          git push
