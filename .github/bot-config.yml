# Aurora CloudBank GitHub Actions Bot Configuration
# Centralized configuration for all automated bot behaviors
# Version: 1.0.0

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================

global:
  # Prevent duplicate comments on same PR
  deduplication: true
  # Minimum time between bot comments (minutes)
  comment_throttle: 60
  # Maximum comments per PR before silencing
  max_comments_per_pr: 5
  # Bot identification marker
  bot_signature: "🤖 *Aurora CloudBank Automation*"
  
# =============================================================================
# PR EVALUATION SETTINGS
# =============================================================================

pr_evaluation:
  # Enable/disable PR evaluation workflow
  enabled: true
  
  # When to run evaluation
  triggers:
    - opened
    - synchronize  # When new commits pushed
    # NOT on reopened - avoid duplicate analysis
  
  # Comment behavior
  comments:
    # Only comment if there are actionable findings
    only_on_issues: true
    # Minimum threshold to comment (0.0-1.0)
    score_threshold: 0.7
    # Update existing comment instead of creating new one
    update_existing: true
    # Comment template
    template: minimal  # Options: minimal, standard, detailed
  
  # What to include in comments
  content:
    show_score: true
    show_status: true
    show_critical_issues_only: true
    show_recommendations: true
    collapse_detailed_results: true  # Use <details> tags
    show_philosophy_section: false  # Only for non-admin PRs
  
  # Label behavior
  labels:
    enabled: true
    # Remove old score labels before adding new one
    cleanup_old: true
    prefix: "eval"  # e.g., eval: needs-work, eval: excellent
  
# =============================================================================
# SELECTIVE INTEGRATION SETTINGS
# =============================================================================

selective_integration:
  # Enable/disable selective integration analysis
  enabled: true
  
  # Only run after PR evaluation completes
  depends_on: ["pr_evaluation"]
  
  # When to run
  triggers:
    - opened  # Only on first open, not on every commit
  
  # Comment behavior
  comments:
    # Only comment if strategy is NOT direct_merge
    only_on_special_cases: true
    # Update existing comment instead of creating new one
    update_existing: true
    template: actionable  # Options: actionable, detailed
  
  # What to include
  content:
    show_strategy: true
    show_reasoning: true
    show_next_steps: true
    show_philosophy_explainer: false  # Only if strategy != direct_merge
    collapse_safeguards: true
    collapse_risks: true
  
  # Label behavior
  labels:
    enabled: true
    cleanup_old: true
    prefix: "integration"
    # Only add if score < 0.9 or strategy != direct_merge
    conditional: true

# =============================================================================
# CI STATUS AUTOMATION SETTINGS
# =============================================================================

ci_status_automation:
  # Enable/disable CI status updates
  enabled: true
  
  # Comment behavior
  comments:
    # Only comment on failures or first success after failure
    only_on_state_change: true
    # Don't comment on every check completion
    batch_updates: true
    # Minimum failed checks to comment
    failure_threshold: 3
    # Update existing comment instead of creating new one
    update_existing: true
  
  # What to include
  content:
    show_failed_checks: true
    show_passed_checks: false
    show_pending_checks: false
    # Only show actionable information
    show_fix_suggestions: true
  
  # Label behavior
  labels:
    enabled: true
    cleanup_old: true
    prefix: "ci"
    # Update labels silently without comments
    silent: true

# =============================================================================
# CODE REVIEW AUTOMATION SETTINGS
# =============================================================================

code_review:
  # Enable/disable automated code review
  enabled: true
  
  # When to run
  triggers:
    - opened
    - synchronize
  
  # Comment behavior
  comments:
    # Only comment if there are violations
    only_on_violations: true
    # Severity threshold to comment
    min_severity: "high"  # Options: low, medium, high, critical
    # Group findings by file
    group_by_file: true
    # Maximum findings to show
    max_findings: 10
    # Update existing comment
    update_existing: true
    template: actionable
  
  # What to include
  content:
    show_severity_breakdown: true
    show_critical_issues_inline: true
    show_fix_suggestions: true
    collapse_low_priority: true
    show_quality_gate_status: true
  
  # Auto-approve behavior
  auto_approve:
    enabled: true
    # Conditions for auto-approval
    conditions:
      max_violations: 0
      min_score: 0.95
      all_tests_pass: true
      admin_pr: false  # Don't auto-approve admin PRs

# =============================================================================
# LABEL AUTOMATION SETTINGS
# =============================================================================

labeling:
  # Enable/disable auto-labeling
  enabled: true
  
  # Run silently without comments
  silent: true
  
  # Label types
  types:
    # Path-based labels
    path_based:
      enabled: true
      silent: true
    
    # Content-based labels
    content_based:
      enabled: true
      silent: true
      # Only add if PR description mentions keywords
      require_mention: true
    
    # Size labels
    size_based:
      enabled: true
      silent: true

# =============================================================================
# ASSIGNMENT AUTOMATION SETTINGS
# =============================================================================

assignment:
  # Enable/disable auto-assignment
  enabled: true
  
  # Assignment behavior
  behavior:
    # Assign to PR author's default reviewer
    assign_reviewers: true
    # Assign to component owners
    assign_owners: true
    # Don't comment when assigning
    silent: true
  
  # Label-based assignment
  label_based:
    enabled: true
    silent: true

# =============================================================================
# SPAM PREVENTION RULES
# =============================================================================

spam_prevention:
  # Enable anti-spam measures
  enabled: true
  
  # Duplicate comment prevention
  detect_duplicates:
    enabled: true
    # Consider comments with >90% similarity as duplicates
    similarity_threshold: 0.9
    # Time window to check for duplicates (hours)
    time_window: 24
  
  # Comment rate limiting
  rate_limiting:
    enabled: true
    # Max comments per workflow per PR
    max_per_workflow: 2
    # Max total bot comments per PR
    max_total: 10
    # Cooldown period between comments (minutes)
    cooldown: 30
  
  # Content aggregation
  aggregation:
    enabled: true
    # Combine multiple pending comments into one
    combine_pending: true
    # Wait time before posting (seconds)
    debounce: 60
  
  # Comment consolidation
  consolidation:
    enabled: true
    # Update existing comments instead of creating new ones
    update_existing: true
    # Delete outdated bot comments
    cleanup_old: true
    # Keep at most N bot comments per PR
    max_retained: 3

# =============================================================================
# NOTIFICATION PREFERENCES
# =============================================================================

notifications:
  # When to send GitHub notifications
  conditions:
    # Always notify on critical issues
    critical_issues: true
    # Notify on blocking failures
    blocking_failures: true
    # Don't notify on minor updates
    minor_updates: false
    # Don't notify on label changes
    label_changes: false
    # Don't notify on assignment
    assignments: false
  
  # Notification grouping
  grouping:
    enabled: true
    # Combine notifications from same workflow
    by_workflow: true
    # Wait period before sending (minutes)
    debounce: 15

# =============================================================================
# TEMPLATES
# =============================================================================

templates:
  # Minimal template - just the essentials
  minimal:
    sections:
      - status
      - critical_issues
      - next_steps
    max_length: 500
  
  # Standard template - balanced information
  standard:
    sections:
      - status
      - summary
      - key_findings
      - recommendations
    max_length: 1500
  
  # Detailed template - comprehensive information
  detailed:
    sections:
      - status
      - summary
      - detailed_findings
      - recommendations
      - resources
    max_length: 5000
  
  # Actionable template - focus on what to do
  actionable:
    sections:
      - status
      - action_items
      - blocking_issues
      - fix_suggestions
    max_length: 1000
