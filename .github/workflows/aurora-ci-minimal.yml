---
name: Aurora CI (Minimal)
# Single, robust CI workflow that focuses on what matters
# Designed to pass reliably while catching real issues
#
# For deployment and setup documentation, see: docs/aurora_deployment_reference.md
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'LICENSE'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: "CI Check"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Legacy references detector (non-blocking)
        continue-on-error: true
        run: |
          bash scripts/verify_removed_paths_unused.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check requirements-lock.txt drift (informational)
        continue-on-error: true
        run: |
          pip install pip-tools 2>/dev/null || true
          # Generate a fresh freeze from current installed packages
          pip freeze | sort > /tmp/current_freeze.txt
          # Compare with committed lock file (if it exists)
          if [ -f requirements-lock.txt ]; then
            if diff -u requirements-lock.txt /tmp/current_freeze.txt > /tmp/lock_drift.txt 2>&1; then
              echo "Lock file is current — no drift detected."
            else
              echo "::warning::Lock file drift detected. Run 'pip freeze | sort > requirements-lock.txt' and commit."
              cat /tmp/lock_drift.txt | head -50
            fi
          else
            echo "requirements-lock.txt not found — skipping drift check."
          fi

      # SYNTAX CHECKS ONLY - must pass
      - name: Python syntax check
        run: |
          # Only check if Python files would actually break, scoped to first-class areas
          paths=""
          for d in api src tools tests modules/hr_system modules/resilience_sentinel modules/gumas modules/symbolic_core modules/aumemmanager modules/nexus modules/opal2; do
            [ -d "$d" ] && paths="$paths $d"
          done
          if [ -z "$paths" ]; then
            echo "No target directories found for syntax check" && exit 0
          fi
          flake8 $paths --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=.git,__pycache__,.pytest_cache,venv,env,.venv,.tox,dist,build,scripts/deprecated/*,examples/*,integrations/*,.security/*

      # STYLE CHECKS - informational only, allowed to fail
      - name: Code style check (informational)
        continue-on-error: true
        run: |
          # Check style but don't fail the build; use same scoped areas as syntax check
          paths=""
          for d in api src tools tests modules/hr_system modules/resilience_sentinel modules/gumas modules/symbolic_core modules/aumemmanager modules/nexus modules/opal2; do
            [ -d "$d" ] && paths="$paths $d"
          done
          if [ -z "$paths" ]; then
            echo "No target directories found for style check" && exit 0
          fi
          flake8 $paths --count --max-complexity=10 --max-line-length=127 --statistics \
            --exclude=.git,__pycache__,.pytest_cache,venv,env,.venv,.tox,dist,build,scripts/deprecated/*,examples/*,integrations/*,.security/*

      # OPAL2 LANDING GATE - must pass, fail closed
      - name: Run OPAL2 standalone foundry tests
        env:
          CSRF_SECRET_KEY: opal2-ci-csrf-secret-not-for-production
          WS_AUTH_SECRET: opal2-ci-ws-secret-not-for-production
        run: |
          pytest -q \
            tests/test_opal2_api_routes.py \
            tests/test_opal2_deployment.py \
            tests/test_opal2_foundry.py \
            tests/test_opal2_glyph_cache.py \
            tests/test_opal2_glyph_core.py \
            tests/test_opal2_integration.py \
            tests/test_opal2_regex_workshop.py \
            tests/test_opal2_simple.py \
            tests/test_opal2_staging_dashboard.py \
            tests/test_opal2_system.py \
            tests/test_opal2_tool_package.py

      # CRITICAL TESTS - must pass, fail closed
      # Only fails on actual test FAILURES, not on collection errors from
      # unrelated test files that have missing optional dependencies.
      - name: Run critical tests
        run: |
          echo "Python version: $(python --version)"
          if [ ! -d tests ]; then
            echo "No tests directory found - skipping"
            exit 0
          fi
          FILES=$(grep -rl "@pytest.mark.critical\|@pytest.mark.smoke" tests/ --include="*.py" 2>/dev/null | tr '\n' ' ')
          if [ -z "$FILES" ]; then
            echo "No critical/smoke tests found - skipping"
            exit 0
          fi
          set +e
          pytest $FILES -m "critical or smoke" -q --no-header --continue-on-collection-errors --tb=line
          PYTEST_EXIT=$?
          set -e
          echo "pytest exit code: $PYTEST_EXIT"
          if [ $PYTEST_EXIT -eq 1 ]; then
            echo "::error::Critical/smoke tests FAILED (exit 1)"
            exit 1
          fi
          echo "Critical tests done (exit $PYTEST_EXIT — treating as pass)"

      # SUPPLY-CHAIN INTEGRITY CHECK - non-blocking, warns on hash mismatch
      # Validates that every installed package matches a known-good SHA-256 hash.
      # Regenerate requirements-hashed.txt with: bash scripts/generate_hashed_requirements.sh
      - name: Validate package hashes (informational)
        continue-on-error: true
        run: |
          if [ -f requirements-hashed.txt ]; then
            echo "Checking package integrity with hashed requirements..."
            pip install --require-hashes -r requirements-hashed.txt --dry-run 2>&1 | tail -10 || \
              echo "::warning::Hash validation failed — regenerate requirements-hashed.txt with: bash scripts/generate_hashed_requirements.sh"
          else
            echo "::warning::requirements-hashed.txt not found — run: bash scripts/generate_hashed_requirements.sh"
          fi

      # FULL TEST SUITE - mandatory, fail closed
      - name: Run full test suite
        run: |
          if [ -d tests ]; then
            set -o pipefail
            pytest tests/ -v --cov=. --cov-report=term-missing --tb=short 2>&1 | tee pytest-full.log
          fi

      - name: Upload full test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pytest-full-log
          path: pytest-full.log
          retention-days: 30
          if-no-files-found: ignore
