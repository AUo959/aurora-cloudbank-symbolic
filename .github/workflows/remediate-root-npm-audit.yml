name: Remediate root npm audit

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/remediate-root-npm-audit.yml

permissions:
  contents: write

jobs:
  remediate:
    name: Lockfile and targeted override remediation after harness repair
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/remediate-root-npm-audit
          fetch-depth: 0

      - name: Incorporate current main
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Apply lockfile-first remediation
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm audit --audit-level=moderate --json > audit-before.json || true
          cp package.json package.json.before
          set +e
          npm audit fix --package-lock-only 2>&1 | tee audit-fix.log
          AUDIT_FIX_EXIT=${PIPESTATUS[0]}
          set -e
          echo "npm audit fix exit code: ${AUDIT_FIX_EXIT}"
          if ! cmp -s package.json package.json.before; then
            echo "::error::Lockfile-only remediation changed package.json"
            diff -u package.json.before package.json || true
            mv package.json.before package.json
            exit 1
          fi
          git diff -- package-lock.json

      - name: Clean install lockfile-first result
        run: npm ci

      - name: Capture remaining lockfile-only findings
        run: npm audit --audit-level=moderate --json > audit-after-lockfile.json || true

      - name: Add targeted brace-expansion override
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('package.json')
          data = json.loads(path.read_text())
          before = json.loads(Path('package.json.before').read_text())

          if data.get('dependencies') != before.get('dependencies'):
              raise SystemExit('direct dependencies changed before override')
          if data.get('devDependencies') != before.get('devDependencies'):
              raise SystemExit('devDependencies changed before override')

          overrides = dict(data.get('overrides', {}))
          overrides['brace-expansion'] = '5.0.8'
          data['overrides'] = overrides
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          npm install --package-lock-only

      - name: Validate manifest scope
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path('package.json.before').read_text())
          after = json.loads(Path('package.json').read_text())

          assert after.get('dependencies') == before.get('dependencies')
          assert after.get('devDependencies') == before.get('devDependencies')

          expected = dict(before.get('overrides', {}))
          expected['brace-expansion'] = '5.0.8'
          assert after.get('overrides', {}) == expected
          PY
          git diff -- package.json package-lock.json

      - name: Clean install final candidate
        run: npm ci

      - name: Require clean moderate audit
        run: npm audit --audit-level=moderate --json > audit-after.json

      - name: Run JavaScript and TypeScript validation
        run: |
          set +e
          set -o pipefail

          npm run test:node 2>&1 | tee node-tests.log
          NODE_EXIT=${PIPESTATUS[0]}

          npm run test:web 2>&1 | tee web-tests.log
          WEB_EXIT=${PIPESTATUS[0]}

          npx tsc --project tsconfig.constellation.json --noEmit --skipLibCheck --pretty false 2>&1 | tee typescript-check.log
          TSC_EXIT=${PIPESTATUS[0]}

          printf 'node=%s\nweb=%s\ntypescript=%s\n' "$NODE_EXIT" "$WEB_EXIT" "$TSC_EXIT" | tee validation-status.txt

          if [ "$NODE_EXIT" -ne 0 ] || [ "$WEB_EXIT" -ne 0 ] || [ "$TSC_EXIT" -ne 0 ]; then
            exit 1
          fi

      - name: Capture dependency versions (informational)
        if: always()
        continue-on-error: true
        run: npm ls ws engine.io socket.io-adapter js-yaml brace-expansion body-parser --all --json > dependency-versions-after.json

      - name: Preserve candidate evidence
        if: always()
        run: |
          cp package.json package-candidate.json || true
          cp package-lock.json package-lock-candidate.json || true

      - name: Upload remediation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-remediation-1341
          path: |
            audit-before.json
            audit-fix.log
            audit-after-lockfile.json
            audit-after.json
            dependency-versions-after.json
            node-tests.log
            web-tests.log
            typescript-check.log
            validation-status.txt
            package-candidate.json
            package-lock-candidate.json
          retention-days: 30
          if-no-files-found: warn

      - name: Commit validated candidate and self-clean
        run: |
          set -euo pipefail
          rm package.json.before
          git rm .github/workflows/remediate-root-npm-audit.yml
          git rm .github/agent-tasks/issue-1341.md
          git add package.json package-lock.json
          printf '%s\n' \
            '.github/agent-tasks/issue-1341.md' \
            '.github/workflows/remediate-root-npm-audit.yml' \
            'package-lock.json' \
            'package.json' > expected-files.txt
          git diff --cached --name-only | sort > staged-files.txt
          diff -u expected-files.txt staged-files.txt
          git commit -m 'security: remediate root npm audit baseline'
          git push origin HEAD:agent/remediate-root-npm-audit
