name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Explicit permissions for security
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found, skipping npm install"
          fi

      - name: Build static files
        run: |
          # Create build directory
          mkdir -p _site
          # Copy static files
          cp -r static/* _site/ 2>/dev/null || echo "No static directory found"
          cp index.html _site/ 2>/dev/null || echo "No index.html found"
          # Add security headers
          echo "X-Content-Type-Options: nosniff" > _site/.htaccess
          echo "X-Frame-Options: DENY" >> _site/.htaccess
          echo "X-XSS-Protection: 1; mode=block" >> _site/.htaccess

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
