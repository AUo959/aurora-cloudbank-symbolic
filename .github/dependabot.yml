# Dependabot configuration
#
# Nine ecosystem/directory entries previously ran ungrouped at a limit of five
# each — up to 45 concurrent pull requests, one per dependency. In practice that
# produced a standing backlog of ~23, which reads to any visitor as an
# unmaintained repository regardless of how current the code actually is.
#
# Every entry below groups its updates, so a week's worth of bumps arrives as
# one reviewable PR per ecosystem rather than one per package. Limits are low
# because grouping makes them sufficient: if a limit is ever hit, that is a
# signal the queue is not being reviewed, not a reason to raise it.
#
# Majors are deliberately separated from patch/minor on the larger ecosystems.
# A grouped patch PR is usually safe to merge on green CI; a major needs
# reading. Mixing them forces the whole group to move at the speed of its
# riskiest member — which is how the previous backlog accumulated.

version: 2
updates:
  # ── CI infrastructure ──────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "github-actions"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:15"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "pre-commit"]
    groups:
      pre-commit:
        patterns: ["*"]

  # ── Python ─────────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "python"]
    # pydantic-core is not an independently upgradable package: each pydantic
    # release pins an EXACT pydantic-core build (pydantic 2.13.4 requires
    # pydantic-core==2.46.4). Dependabot was proposing pydantic-core on its own,
    # which is unsatisfiable -- no pydantic release pairs with it yet -- so the
    # PR failed with ResolutionImpossible and simply re-rolled each week:
    # #1390, then #1412, identical failure both times.
    #
    # Ignoring it here does not freeze it. It still moves whenever pydantic
    # moves, because regenerating the lock resolves it transitively; it just
    # stops being offered as a standalone bump.
    ignore:
      - dependency-name: "pydantic-core"
    groups:
      python-patch-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "pip"
    directory: "/cli"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:45"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "python"]
    groups:
      cli-python:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/sdk/python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "python"]
    groups:
      sdk-python:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/services/nemo_service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "python", "service"]
    groups:
      nemo-service:
        patterns: ["*"]

  # ── JavaScript ─────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]
    groups:
      npm-patch-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:45"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "frontend"]
    groups:
      frontend-patch-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      frontend-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "npm"
    directory: "/services/command_node"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "service"]
    groups:
      command-node:
        patterns: ["*"]
