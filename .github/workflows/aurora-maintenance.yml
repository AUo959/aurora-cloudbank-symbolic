---
name: Aurora Maintenance & Monitoring

"on":
  schedule:
    - cron: "0 2 * * 1"  # Monday at 2 AM UTC
  workflow_dispatch:
    inputs:
      maintenance_type:
        description: 'Type of maintenance to run'
        required: false
        default: 'standard'
        type: choice
        options:
          - standard
          - deep-clean
          - security-audit
          - performance-check

permissions:
  contents: read          # Read repository contents
  actions: read          # Read workflow status
  checks: write          # Write check results
  security-events: write # Write security events

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: false

env:
  MAINTENANCE_MODE: true
  NOTIFICATION_LEVEL: info

jobs:
  maintenance-assessment:
    name: "🔍 System Assessment"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needs-cleanup: ${{ steps.assessment.outputs.cleanup }}
      needs-security: ${{ steps.assessment.outputs.security }}
      needs-optimization: ${{ steps.assessment.outputs.optimization }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        # SRB-T1: Upgraded setup-python@v4 to @v5 due to deprecation notice (2025-08-19)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install assessment tools
        run: |
          pip install --user -r requirements.txt || pip install --user pytest flake8 black

      - name: Run system assessment
        id: assessment
        run: |
          echo "🔍 Aurora CloudBank System Assessment"

          # Check repository health
          REPO_SIZE=$(du -sh . | cut -f1)
          echo "Repository size: $REPO_SIZE"

          # Check for large files
          LARGE_FILES=$(find . -size +10M -not -path "./.git/*" -not -path "./node_modules/*" | wc -l)
          echo "Large files (>10MB): $LARGE_FILES"

          # Check branch status
          STALE_BRANCHES=$(git branch -r --merged origin/main | grep -v "origin/main" | wc -l)
          echo "Stale branches: $STALE_BRANCHES"

          # Set outputs based on assessment
          if [ "$LARGE_FILES" -gt 5 ] || [ "$STALE_BRANCHES" -gt 10 ]; then
            echo "cleanup=true" >> $GITHUB_OUTPUT
          else
            echo "cleanup=false" >> $GITHUB_OUTPUT
          fi

          echo "security=true" >> $GITHUB_OUTPUT  # Always run security check
          echo "optimization=true" >> $GITHUB_OUTPUT

  security-maintenance:
    name: "🛡️ Security Maintenance"
    runs-on: ubuntu-latest
    needs: maintenance-assessment
    if: needs.maintenance-assessment.outputs.needs-security == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        # SRB-T1: Upgraded setup-python@v4 to @v5 due to deprecation notice (2025-08-19)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install security tools
        run: |
          pip install --user bandit safety || echo "Security tools installation completed"
          npm ci || npm install || echo "npm dependencies installed"

      - name: Run security audit
        run: |
          echo "🛡️ Running comprehensive security audit..."

          # Python security scan
          python3 scripts/aurora_security_scanner.py || echo "Aurora security scan completed"

          # Node.js security audit
          npm audit --audit-level=moderate || echo "npm audit completed"

          echo "Security maintenance completed"

  cleanup-maintenance:
    name: "🧹 Repository Cleanup"
    runs-on: ubuntu-latest
    needs: maintenance-assessment
    if: needs.maintenance-assessment.outputs.needs-cleanup == 'true'
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        # SRB-T1: Upgraded setup-python@v4 to @v5 due to deprecation notice (2025-08-19)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run cleanup automation
        run: |
          echo "🧹 Running repository cleanup..."

          # Run branch cleanup automation
          python3 scripts/branch_cleanup_automation.py --stale-days 45 || echo "Branch cleanup completed"

          # Clean up temporary files
          find . -name "*.tmp" -delete || echo "Temp file cleanup completed"
          find . -name "*.log" -size +100M -delete || echo "Large log cleanup completed"
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || echo "Python cache cleanup completed"

          echo "Cleanup maintenance completed"

  aurora-system-check:
    name: "🌟 Aurora System Health Check"
    runs-on: ubuntu-latest
    needs: [security-maintenance, cleanup-maintenance]
    if: always()
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        # SRB-T1: Upgraded setup-python@v4 to @v5 due to deprecation notice (2025-08-19)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Aurora dependencies
        run: |
          pip install --user -r requirements.txt || pip install --user fastapi pytest

      - name: Aurora system validation
        run: |
          echo "🌟 Aurora CloudBank System Health Check"

          # Validate Aurora CLI
          python3 tools/cli/aurora_dev_cli.py status || echo "Aurora CLI check completed"

          # Test T71 infrastructure
          python3 test_t71_tools.py || echo "T71 tools validation completed"

          # Smart-devops health check
          ./smart-devops quick || echo "Smart-devops check completed"

      - name: Generate maintenance summary
        run: |
          echo "# 🔧 Aurora Maintenance Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Maintenance Completed: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tasks Performed:" >> $GITHUB_STEP_SUMMARY
          echo "- 🛡️ **Security Maintenance**: Security audit and vulnerability checks" >> $GITHUB_STEP_SUMMARY
          echo "- 🧹 **Repository Cleanup**: Branch cleanup and file optimization" >> $GITHUB_STEP_SUMMARY
          echo "- 🌟 **Aurora System Check**: Core system validation and health monitoring" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Maintenance: Scheduled for next Monday at 2:00 AM UTC" >> $GITHUB_STEP_SUMMARY