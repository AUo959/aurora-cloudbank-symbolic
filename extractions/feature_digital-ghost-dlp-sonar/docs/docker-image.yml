# Extracted from feature/digital-ghost-dlp-sonar

name: Docker Image CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build . --file services/command_node/Dockerfile --tag aurora-cloudbank-command-node:$(date +%s)
