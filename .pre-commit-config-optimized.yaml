# Optimized Pre-commit Configuration for Aurora CloudBank
# Focused on essential checks with smart triggering

repos:
  # Essential file checks - lightweight and fast
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$|\.txt$'  # Skip markdown and text files where trailing spaces might be intentional
      - id: end-of-file-fixer
        exclude: '\.min\.(js|css)$|\.zip$|\.pdf$'  # Skip minified and binary files
      - id: check-yaml
        files: '\.(yaml|yml)$'
      - id: check-json
        files: '\.json$'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=5120']  # 5MB limit instead of default 500KB
        exclude: '\.zip$|\.pdf$|\.png$|\.jpg$|\.jpeg$'  # Allow large archives and images

  # Python linting - optimized for performance
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: [
          '--max-line-length=100',
          '--ignore=E203,W503,F401',  # Ignore common formatting issues
          '--exclude=.venv,__pycache__,.git,build,dist,*.egg-info',
          '--per-file-ignores=__init__.py:F401'  # Allow unused imports in __init__.py
        ]
        files: '\.py$'
        exclude: '(migrations|tests|\.venv)/.*\.py$'  # Skip migrations, tests, and venv

  # Auto-formatting - only for Python files that need it
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        args: ['--line-length=100', '--skip-string-normalization']
        files: '\.py$'
        exclude: '(migrations|\.venv)/.*\.py$'

  # Import sorting - lightweight and fast
  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.1
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=100']
        files: '\.py$'
        exclude: '(migrations|\.venv)/.*\.py$'

  # Security checks - only for sensitive files
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ['-ll', '--skip=B101,B601']  # Low confidence, skip assert and shell usage
        files: '\.py$'
        exclude: '(tests|\.venv)/.*\.py$'

  # Markdown linting - optimized with exclusions
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.37.0
    hooks:
      - id: markdownlint
        args: [
          '--disable=MD013,MD033,MD041',  # Disable line length, HTML tags, first line H1
          '--ignore=node_modules',
          '--ignore=.venv'
        ]
        files: '\.md$'
        exclude: '(CHANGELOG|README|\.github)/.*\.md$'  # Skip auto-generated docs

  # JavaScript/TypeScript - only when Node.js files are present
  - repo: local
    hooks:
      - id: eslint-check
        name: ESLint (conditional)
        entry: bash -c 'if [ -f package.json ] && [ -d node_modules ]; then npx eslint --ext .js,.ts --fix --quiet .; else echo "Skipping ESLint - no Node.js setup detected"; fi'
        language: system
        files: '\.(js|ts)$'
        exclude: '(node_modules|\.min\.js|build)/.*\.(js|ts)$'
        pass_filenames: false
        
  # Git hooks optimization
  - repo: local
    hooks:
      - id: optimize-git-hooks
        name: Optimize Git Hooks
        entry: bash -c 'echo "Pre-commit optimization: $(date)" >> .git/hooks/commit-msg.log'
        language: system
        stages: [commit-msg]
        pass_filenames: false
        always_run: true

# Global configuration
default_stages: [commit]
fail_fast: false  # Continue running other hooks even if one fails
minimum_pre_commit_version: 3.0.0

# Performance optimizations
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks
    
    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: monthly
  skip: [eslint-check, optimize-git-hooks]  # Skip local hooks in CI
  submodules: false
