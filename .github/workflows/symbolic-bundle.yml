name: Symbolic Bundle Automation

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Create symbolic core bundle
        run: npm run bundle-symbolic-core
      - name: Verify bundle integrity
        run: npm run verify-bundle
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: symbolic_core_bundle
          path: symbolic_core_bundle.zip
