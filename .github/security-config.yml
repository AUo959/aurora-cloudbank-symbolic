# Aurora CloudBank Security Configuration
# This file defines security policies and configurations

# Content Security Policy for all HTML files
csp:
  default-src: "'self'"
  script-src: "'self' 'unsafe-inline'"
  style-src: "'self' 'unsafe-inline'"
  img-src: "'self' data: https:"
  connect-src: "'self' ws: wss:"
  font-src: "'self'"
  object-src: "'none'"
  media-src: "'self'"
  frame-src: "'none'"
  base-uri: "'self'"
  form-action: "'self'"

# Security headers to be applied
security_headers:
  - 'X-Content-Type-Options: nosniff'
  - 'X-Frame-Options: DENY'
  - 'X-XSS-Protection: 1; mode=block'
  - 'Referrer-Policy: strict-origin-when-cross-origin'
  - 'Permissions-Policy: camera=(), microphone=(), geolocation=()'

# Input validation rules
input_validation:
  max_string_length: 1000
  allowed_html_tags:
    - 'p'
    - 'span'
    - 'strong'
    - 'em'
    - 'br'
  blocked_patterns:
    - '<script'
    - 'javascript:'
    - 'data:text/html'
    - "on\\w+\\s*="

# WebSocket security
websocket:
  max_message_size: 8192
  rate_limit: 100 # messages per minute
  allowed_origins:
    - 'localhost'
    - '127.0.0.1'
    - '*.github.io' # For GitHub Pages

# File upload restrictions (if applicable)
file_upload:
  max_size: 10485760 # 10MB
  allowed_types:
    - '.txt'
    - '.json'
    - '.py'
    - '.js'
    - '.html'
    - '.css'
  blocked_extensions:
    - '.exe'
    - '.bat'
    - '.sh'
    - '.php'
    - '.asp'

# Database security (if applicable)
database:
  use_prepared_statements: true
  encrypt_sensitive_data: true
  audit_queries: true

# API security
api:
  rate_limit: 1000 # requests per hour
  require_authentication: false # Set to true for production
  cors_origins:
    - 'localhost'
    - '127.0.0.1'
    - '*.github.io'

# Logging and monitoring
logging:
  log_security_events: true
  log_failed_requests: true
  retention_days: 90
  sensitive_fields:
    - 'password'
    - 'token'
    - 'secret'
    - 'key'
