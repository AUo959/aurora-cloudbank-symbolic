---
name: Temporary Fix 1345

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.ref == 'agent/fix-memory-retrieval-router-1345'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: agent/fix-memory-retrieval-router-1345
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Apply scoped source and assurance fixes
        run: python scripts/temporary_apply_issue_1345.py

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Validate fix
        run: |
          python -m py_compile api/aurora_api.py tests/test_memory_retrieval_app_registration.py
          python -m pytest -q \
            tests/test_memory_retrieval_app_registration.py \
            tests/test_api_router_coverage.py \
            tests/test_api_surface_inventory.py

      - name: Commit scoped fix
        run: |
          git config user.name "aurora-githubops"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/aurora_api.py docs/api/api_surface_inventory.json tests/test_memory_retrieval_app_registration.py
          git commit -m "fix: restore memory retrieval router registration (#1345)"
          git push origin HEAD:agent/fix-memory-retrieval-router-1345
