name: Aurora CodeQL Unified Analysis
'on':
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
  schedule:
  - cron: 30 5 * * 1
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        language:
        - python
        - javascript
        include:
        - language: python
          build-mode: none
        - language: javascript
          build-mode: none
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended
        config: .github/codeql/codeql-config.yml
        build-mode: ${{ matrix.build-mode }}
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: /language:${{matrix.language}}
        upload: true
    - name: Generate Symbolic Manifest
      if: always()
      continue-on-error: true
      run: |
        if [ -f "scripts/symbolic_manifest.py" ]; then
          python3 scripts/symbolic_manifest.py \
            --language "${{ matrix.language }}" \
            --anchor "T1-SCAN-${{ matrix.language }}" \
            --team "Aurora Dev" \
            --ethics-protocol "Picard_Delta_3" \
            --dlp-tag "SECURITY_SCAN" \
            --symbolic-tags SRB-CodeQL SECURITY_SCAN
        else
          echo "⚠️ symbolic_manifest.py not found, skipping manifest generation"
        fi
    - name: Upload Manifest Artifact
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: scan-manifest-${{ matrix.language }}
        path: scan_manifest_${{ matrix.language }}.json
