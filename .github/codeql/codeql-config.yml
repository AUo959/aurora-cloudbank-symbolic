name: "Aurora CodeQL Unified Config"

queries:
  - uses: security-extended

paths:
  - src
  - modules
  - scripts
  - tools

paths-ignore:
  - tests
  - "**/*_test.py"
  - "**/*test*.py"
  - node_modules
  - venv
  - .venv
  - __pycache__
  - "*.pyc"
  - CASK_Assets.zip
  - "**/*.zip"
  - "**/*.gz"
  - "**/*.tar"
  # src/utils/atomic_io.py is the internal crash-safe write helper
  # (#807). All callers pass paths derived from validated storage
  # roots (#813 + InsightLedger.validate_safe_path). The helper itself
  # has Path.resolve() + NUL-byte rejection as defence-in-depth.
  # CodeQL's py/path-injection taint flow cannot trace the up-chain
  # validation and flags the parameter as user-controlled. The
  # earlier `query-filters` attempt used unsupported syntax (CodeQL
  # query-filters cannot scope by path). `paths-ignore` excludes the
  # file from ALL CodeQL queries, which is acceptable here because:
  #   - the file is ~100 lines of crash-safety primitives only;
  #   - it has no network I/O, no SQL, no shell, no eval, no pickle;
  #   - changes go through PR review;
  #   - the path-injection callers ARE validated up-chain.
  # If the file later gains substantive logic, revisit this exclusion.
  # Use a wildcard glob so the match is robust to how CodeQL resolves
  # repository-relative paths internally.
  - "**/atomic_io.py"
