name: Constellation CI

on:
  push:
    branches: [main, copilot/create-constellation-architecture-pr]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: |
        set +e
        {
          echo "TypeScript version: $(npx tsc --version)"
          echo "--- Effective configuration ---"
          npx tsc --project tsconfig.constellation.json --showConfig
          echo "--- Type check ---"
          npx tsc --project tsconfig.constellation.json --noEmit --skipLibCheck --pretty false
        } > typescript-check.log 2>&1
        TYPECHECK_EXIT=$?
        set -e
        cat typescript-check.log
        exit "$TYPECHECK_EXIT"

    - name: Upload TypeScript diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: typescript-check
        path: typescript-check.log
        retention-days: 30
        if-no-files-found: error

    - name: Lint JavaScript/TypeScript (advisory; tracked in #1340)
      continue-on-error: true
      run: |
        set -o pipefail
        npm run lint:check 2>&1 | tee lint-check.log

    - name: Upload lint diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: lint-check
        path: lint-check.log
        retention-days: 30
        if-no-files-found: ignore

    - name: Build (advisory; blocked by lint baseline #1340)
      continue-on-error: true
      run: |
        set -o pipefail
        npm run build 2>&1 | tee build.log

    - name: Upload build diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: build-log
        path: build.log
        retention-days: 30
        if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        repository: AUo959/aurora-cloudbank-symbolic

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Run constellation health check
      run: |
        echo "Constellation integration tests would run here"
        echo "This requires all satellite repositories to be available"

  security:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit
      run: npm audit --audit-level=moderate --json > audit-results.json

    - name: Upload audit results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: security-audit
        path: audit-results.json
