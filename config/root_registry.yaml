# Root Registry — the declaration contract for the repository root.
#
# Aurora's complexity is the substrate (issue #1504); this registry is what
# keeps that complexity DECLARED rather than drifting. The declaration gate
# (scripts/check_root_declaration.py) fails any change that makes the tracked
# root differ from this file, in either direction:
#
#   - adding a root object without declaring it here fails;
#   - deleting a root object without removing its declaration fails;
#   - adding or removing a root-level requirements*.txt / requirements*.lock
#     file without updating dependency_files fails.
#
# To declare a new root object: add it under root_objects and say why it
# exists in the commit message. Declaration is the exemption path — there is
# no permission step, only a registration step.
#
# Generated from the tracked root at the time of the gate's introduction
# (142 root objects, 9 declared dependency files).
