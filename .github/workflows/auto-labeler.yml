name: Auto Labeler

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # Content-based labeling for issues and PRs
  content-labeling:
    runs-on: ubuntu-latest
    steps:
      - name: Label based on content
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue || context.payload.pull_request;
            const title = issue.title.toLowerCase();
            const body = (issue.body || '').toLowerCase();
            const text = title + ' ' + body;
            
            const labelMap = {
              security: ['security'],
              docs: ['docs', 'documentation'],
              enhancement: ['enhancement', 'feature'],
              critical: ['critical', 'urgent'],
              blocker: ['blocker', 'blocking']
            };
            
            const labelsToAdd = [];
            
            for (const [label, keywords] of Object.entries(labelMap)) {
              if (keywords.some(keyword => text.includes(keyword))) {
                labelsToAdd.push(label);
              }
            }
            
            if (labelsToAdd.length > 0) {
              if (context.payload.issue) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: labelsToAdd
                });
              } else {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  labels: labelsToAdd
                });
              }
            }

  # Path-based labeling for PRs only
  path-labeling:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Label based on changed files
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
