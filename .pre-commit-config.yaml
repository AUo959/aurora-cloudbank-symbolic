# Aurora CloudBank Pre-commit Configuration
# Simplified version focusing on essential checks

repos:
  # Essential file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(md|txt)$'
      - id: end-of-file-fixer
        exclude: '\.(min\.(js|css)|zip|pdf)$'
      - id: check-yaml
        files: '\.(yaml|yml)$'
      - id: check-json
        files: '\.json$'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=5120']

  # Python linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: [
          '--max-line-length=100',
          '--ignore=E203,W503,F401',
          '--exclude=.venv,__pycache__,.git,build,dist,*.egg-info,syntax_errors_archive',
          '--per-file-ignores=__init__.py:F401'
        ]
        files: '\.py$'
        exclude: '(migrations|\.venv|syntax_errors_archive)/.*\.py$'

  # Local hooks for project-specific checks
  - repo: local
    hooks:
      - id: eslint-if-available
        name: ESLint (if Node.js available)
        entry: bash -c 'if command -v npm >/dev/null 2>&1 && [ -f package.json ]; then npm run lint --silent || echo "ESLint warnings found"; else echo "Skipping ESLint"; fi'
        language: system
        files: '\.(js|ts)$'
        exclude: '(node_modules|\.min\.js)/.*'
        pass_filenames: false

default_stages: [pre-commit]
fail_fast: false
minimum_pre_commit_version: 3.0.0
