name: Gate-001A Run 001 Package Installation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out evidence branch
        uses: actions/checkout@v4
        with:
          ref: security/gate-001a-run-001-recovered-protocol-wiring
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and validate evidence
        shell: bash
        run: |
          set -euo pipefail
          python tools/security/_install_gate001a_run001.py
          python -m pip install --disable-pip-version-check pytest
          event="docs/security/assurance_runs/gate-001a/2026-07-27-run-001-recovered-protocol-wiring/AURORA_SECURITY__EVENT__GATE_001A_RECOVERED_PROTOCOL_WIRING__v1.0__2026-07-27.json"
          python tools/security/validate_institutional_assurance_event.py "$event"
          python -m pytest -q tests/test_gate_001a_run_001_package.py

      - name: Remove execution scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/gate-001a-run-001.yml
          rm -f .github/workflows/gate-001a-run-001-deterministic-replay.yml
          rm -f .github/workflows/gate-001a-run-001-package.yml
          rm -f tools/security/_install_gate001a_run001.py
          rm -rf tools/security/.gate001a_payload

      - name: Commit durable first-class run package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aurora-githubops"
          git config user.email "githubops@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "security: record Gate-001A Run 001 evidence package"
          git push origin HEAD:security/gate-001a-run-001-recovered-protocol-wiring
