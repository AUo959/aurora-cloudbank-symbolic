name: Auto Labeler

on:
  push:
    branches:
      - main

jobs:
  label:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d  # v6.2.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          config: .github/labeler.yml