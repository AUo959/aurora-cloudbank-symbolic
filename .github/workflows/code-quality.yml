---
name: Code Quality Analysis

# Comprehensive code quality workflow implementing Issue #258
# Runs flake8 analysis, generates reports, and creates issues for critical violations

on:
  push:
    branches: [main, develop]
    paths:
      - '**.py'
      - '.flake8'
      - '.github/workflows/code-quality.yml'
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      create_issues:
        description: 'Create GitHub issues for critical violations'
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: "Code Quality Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 requests
      
      - name: Run flake8 analysis
        id: flake8
        continue-on-error: true
        run: |
          echo "Running comprehensive flake8 analysis..."
          python src/core/code_quality_analyzer.py \
            --output reports/code_quality_report.json \
            --reflection
          
          # Capture exit code
          echo "exit_code=$?" >> $GITHUB_OUTPUT
      
      - name: Generate analysis summary
        if: always()
        run: |
          if [ -f reports/code_quality_report.json ]; then
            echo "## Code Quality Analysis Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Extract key metrics from report
            python -c "
          import json
          with open('reports/code_quality_report.json') as f:
              report = json.load(f)
              summary = report.get('analysis_summary', {})
              severity = summary.get('severity_breakdown', {})
              
              print(f\"**Status:** {'✅ Passed' if summary.get('passed') else '❌ Failed'}\")
              print(f\"**Total Violations:** {summary.get('total_violations', 0)}\")
              print()
              print('### Severity Breakdown')
              print(f\"- 🔴 Critical: {severity.get('critical', 0)}\")
              print(f\"- 🟠 High: {severity.get('high', 0)}\")
              print(f\"- 🟡 Medium: {severity.get('medium', 0)}\")
              print(f\"- 🟢 Low: {severity.get('low', 0)}\")
          " >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No code quality report generated" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload code quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-report
          path: reports/code_quality_report.json
          retention-days: 30
      
      - name: Create issues for critical violations
        if: |
          always() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          (github.event.inputs.create_issues == 'true' || steps.flake8.outputs.exit_code != '0')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f reports/code_quality_report.json ]; then
            python src/core/code_quality_issue_creator.py \
              --report reports/code_quality_report.json \
              --owner ${{ github.repository_owner }} \
              --repo ${{ github.event.repository.name }} \
              --commit ${{ github.sha }} \
              --max-issues 5
          fi
      
      - name: Comment on PR
        if: |
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            if (!fs.existsSync('reports/code_quality_report.json')) {
              console.log('No report found, skipping PR comment');
              return;
            }
            
            const report = JSON.parse(fs.readFileSync('reports/code_quality_report.json', 'utf8'));
            const summary = report.analysis_summary || {};
            const severity = summary.severity_breakdown || {};
            const passed = summary.passed || false;
            const total = summary.total_violations || 0;
            
            const statusEmoji = passed ? '✅' : '❌';
            
            let comment = `## ${statusEmoji} Code Quality Analysis Results\n\n`;
            comment += `**Status:** ${passed ? 'Passed' : 'Failed'}\n`;
            comment += `**Total Violations:** ${total}\n\n`;
            comment += '### Severity Breakdown\n';
            comment += `- 🔴 Critical: ${severity.critical || 0}\n`;
            comment += `- 🟠 High: ${severity.high || 0}\n`;
            comment += `- 🟡 Medium: ${severity.medium || 0}\n`;
            comment += `- 🟢 Low: ${severity.low || 0}\n\n`;
            
            if (severity.critical > 0) {
              comment += '### ⚠️ Action Required\n';
              comment += 'This PR contains **critical** code quality violations that must be fixed before merging.\n\n';
            }
            
            comment += '---\n';
            comment += '*Analysis performed by Aurora Code Quality Analyzer (Issue #258)*\n';
            
            // Post comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
      
      - name: Check quality gate
        if: always()
        run: |
          if [ -f reports/code_quality_report.json ]; then
            python -c "
          import json, sys
          with open('reports/code_quality_report.json') as f:
              report = json.load(f)
              if not report.get('analysis_summary', {}).get('passed', False):
                  print('❌ Quality gate FAILED - Critical violations detected')
                  sys.exit(1)
              else:
                  print('✅ Quality gate PASSED')
          "
          else
            echo "⚠️ No report to evaluate"
            exit 1
          fi

  sonarcloud:
    name: "SonarCloud Analysis"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true
        with:
          args: >
            -Dsonar.projectKey=AUo959_aurora-cloudbank-symbolic
            -Dsonar.organization=auo959
            -Dsonar.python.version=3.12
            -Dsonar.sources=src,modules
            -Dsonar.tests=tests
            -Dsonar.exclusions=**/*_test.py,**/test_*.py,**/__pycache__/**
