name: "CodeQL Security Analysis"

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 1 * * 0'  # Weekly on Sundays

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Pre-analysis cleanup
      run: |
        # Ensure clean environment for CodeQL analysis
        mkdir -p /home/runner/work/_temp
        touch /home/runner/work/_temp/proxy.log
        echo "Environment prepared for CodeQL analysis"

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: +security-and-quality
        # Enhance CodeQL configuration
        config: |
          name: "Aurora CodeQL Config"
          disable-default-path-filters: false
          paths-ignore:
            - "**/*.md"
            - "**/*.txt"
            - "**/docs/**"
            - "**/assets/**"

    - name: Setup Node.js (for JavaScript analysis)
      if: matrix.language == 'javascript-typescript'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Node.js dependencies
      if: matrix.language == 'javascript-typescript' && hashFiles('package.json') != ''
      run: npm ci || npm install

    - name: Setup Python (for Python analysis)
      if: matrix.language == 'python'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python dependencies
      if: matrix.language == 'python' && hashFiles('requirements.txt') != ''
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"
        upload: true

    - name: Cleanup temporary files
      if: always()
      run: |
        # Clean up any temporary files that might cause issues
        sudo rm -rf /tmp/codeql-* || true
        # Create proxy.log if it doesn't exist to prevent warnings
        mkdir -p /home/runner/work/_temp || true
        touch /home/runner/work/_temp/proxy.log || true
        echo "Cleanup completed successfully"
