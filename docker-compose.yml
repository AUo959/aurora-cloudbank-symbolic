version: '3.8'

services:
  aurora-cloudbank:
    build: .
    container_name: aurora-cloudbank
    ports:
      - "8000:8000"
    environment:
      - AURORA_VERSION=3.5.1
      - AURORA_PHASE=4
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./exports:/app/exports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  aurora-cli:
    build: .
    container_name: aurora-cli
    environment:
      - AURORA_VERSION=3.5.1
      - AURORA_PHASE=4
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
    command: python aurora_cli.py --interactive
    stdin_open: true
    tty: true

networks:
  default:
    name: aurora-network
