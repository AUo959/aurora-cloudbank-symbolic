name: "Constellation Event Router"

# Ref: Aurora Constellation Architecture Proposal v1.0.0 — Gap 3

on:
  repository_dispatch:
    types:
      - qgia.forecast.completed
      - qgia.forecast.requested
      - zipwiz.archive.processed
      - aurora.drift.detected
      - qgia.knowledge.updated
      - constellation.health.check
      - constellation.health.response
      - constellation.manifest.drift

permissions:
  contents: read

jobs:
  validate-event:
    name: Validate Event Payload
    runs-on: ubuntu-latest
    outputs:
      event_type: ${{ steps.parse.outputs.event_type }}
      source_node: ${{ steps.parse.outputs.source_node }}
      valid: ${{ steps.validate.outputs.valid }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Parse event
        id: parse
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          echo "event_type=${{ github.event.action }}" >> "$GITHUB_OUTPUT"
          echo "source_node=$(printf '%s' "$CLIENT_PAYLOAD" | jq -r '.source_node // "unknown"')" >> "$GITHUB_OUTPUT"
          echo "correlation_id=$(printf '%s' "$CLIENT_PAYLOAD" | jq -r '.correlation_id // "none"')" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate payload against schema
        id: validate
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from jsonschema import validate, ValidationError

          with open('constellation-contracts/schemas/constellation-event.schema.json', encoding='utf-8') as f:
              schema = json.load(f)

          raw_payload = os.environ.get('CLIENT_PAYLOAD', '{}')

          try:
              payload = json.loads(raw_payload)
          except json.JSONDecodeError as exc:
              print(f'Payload JSON decode failed: {exc}', file=sys.stderr)
              print(f'Raw payload: {raw_payload[:500]}', file=sys.stderr)
              sys.exit(1)

          try:
              validate(instance=payload, schema=schema)
              print('Payload is valid')
          except ValidationError as exc:
              print(f'Validation failed: {exc.message}', file=sys.stderr)
              sys.exit(1)
          PY
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Audit log
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          SOURCE=$(printf '%s' "$CLIENT_PAYLOAD" | jq -r '.source_node // "unknown"')
          CORR=$(printf '%s' "$CLIENT_PAYLOAD" | jq -r '.correlation_id // "none"')
          echo "::notice::Constellation Event received: type=${{ github.event.action }}, source=${SOURCE}, correlation_id=${CORR}"

  route-event:
    name: Route to ${{ matrix.subscriber }}
    needs: validate-event
    if: needs.validate-event.outputs.valid == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # qgia.forecast.completed → AURORA-RUNTIME, ZIPWIZ-ENGINE
          - event: qgia.forecast.completed
            subscriber: AuroraOS
            owner: AUo959
          - event: qgia.forecast.completed
            subscriber: zip_wizard
            owner: AUo959
          # qgia.forecast.requested → CONSTELLATION-PRIME (self, for logging)
          - event: qgia.forecast.requested
            subscriber: aurora-cloudbank-symbolic
            owner: AUo959
          # zipwiz.archive.processed → CONSTELLATION-PRIME
          - event: zipwiz.archive.processed
            subscriber: aurora-cloudbank-symbolic
            owner: AUo959
          # qgia.knowledge.updated → CONSTELLATION-PRIME, AURORA-RUNTIME
          - event: qgia.knowledge.updated
            subscriber: aurora-cloudbank-symbolic
            owner: AUo959
          - event: qgia.knowledge.updated
            subscriber: AuroraOS
            owner: AUo959
          # constellation.health.check → all spokes
          - event: constellation.health.check
            subscriber: AuroraOS
            owner: AUo959
          - event: constellation.health.check
            subscriber: cloudbank-quantum-en
            owner: AUo959
          - event: constellation.health.check
            subscriber: qgia-knowledge-library
            owner: AUo959
          - event: constellation.health.check
            subscriber: qgia-knowledge-spine
            owner: AUo959
          - event: constellation.health.check
            subscriber: zip_wizard
            owner: AUo959
    steps:
      - name: Route event
        if: needs.validate-event.outputs.event_type == matrix.event
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0  # v3.0.0
        with:
          token: ${{ secrets.CONSTELLATION_TOKEN }}
          repository: ${{ matrix.owner }}/${{ matrix.subscriber }}
          event-type: ${{ needs.validate-event.outputs.event_type }}
          client-payload: ${{ toJSON(github.event.client_payload) }}
