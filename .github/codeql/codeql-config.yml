name: 'Aurora CloudBank CodeQL Config'

# Paths to include in analysis
paths:
  - 'modules/'
  - 'scripts/'
  - 'aurora_api.py'
  - '*.py'
  - '*.js'
  - '*.ts'

# Paths to exclude from analysis
paths-ignore:
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/build/**'
  - '**/__pycache__/**'
  - '**/.*/**'
  - '**/*.min.js'
  - '**/*.bundle.js'
  - '**/vendor/**'
  - '**/third_party/**'
  - '**/*.zip'
  - '**/*.tar'
  - '**/*.tar.gz'
  - '**/*.tgz'
  - '**/*.7z'
  - '**/*.rar'
  - '**/*.jar'
  - '**/*.pdf'
  - '**/*.md'
  - '**/logs/**'
  - '**/temp/**'
  - '**/tmp/**'
  # Skip large archived assets checked into repo root
  - 'Aurora_*.zip'
  - 'Aurora*.zip'
  - 'CASK_Assets.zip'
  - 'AuroraLite_*.zip'
  - 'Quantum_*.zip'
  - 'QUANTUM_*.zip'
  - 'SRB_*.zip'
  - 'Symbolic_*.zip'
  - 'COMMAND_NODE_*.zip'
  - '*.zip'

# Use default queries only to fix enhanced analysis issues
disable-default-queries: false

# Note: Language setup is controlled by the workflow steps.
