name: GUMAS Unified P0 contract tests
on:
  pull_request:
    paths:
      - "simulation/runtime/gumas_unified/**"
      - "tests/test_gumas_unified.py"
      - "simulation/specs/GUMAS__SPEC__UNIFIED_CAUSAL_ENGINE__v0.1__2026-11-14.md"
      - ".github/workflows/gumas-unified-p0.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify P0 causal invariants
        run: python -m unittest discover -s tests -p 'test_gumas_unified.py' -v
      - name: Execute synthetic cross-scale scenario
        run: python -m simulation.runtime.gumas_unified.scenario > /dev/null
