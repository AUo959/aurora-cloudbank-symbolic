name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  code_quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install linting tools
        run: pip install flake8

      - name: Syntax errors (fail closed)
        run: |
          paths=""
          for d in api src tools tests modules/hr_system modules/resilience_sentinel modules/gumas modules/symbolic_core modules/aumemmanager modules/nexus modules/opal2; do
            [ -d "$d" ] && paths="$paths $d"
          done
          [ -z "$paths" ] && echo "No target directories" && exit 0
          flake8 $paths --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=.git,__pycache__,.pytest_cache,venv,env,.venv,.tox,dist,build

      - name: Style and complexity (informational)
        continue-on-error: true
        run: |
          paths=""
          for d in api src tools tests modules/hr_system modules/resilience_sentinel modules/gumas modules/symbolic_core modules/aumemmanager modules/nexus modules/opal2; do
            [ -d "$d" ] && paths="$paths $d"
          done
          [ -z "$paths" ] && echo "No target directories" && exit 0
          flake8 $paths --count --max-complexity=10 --max-line-length=120 --statistics \
            --exclude=.git,__pycache__,.pytest_cache,venv,env,.venv,.tox,dist,build
