name: CI Status Project Automation

# This workflow manages project board status based on CI/test results
# - When CI/tests fail: move items to 'In Progress' with warning
# - When CI passes: move PRs to 'In Review', issues to 'Ready' or 'Done'
# - Display CI/test status on project cards

on:
  status:
  check_suite:
    types: [completed]
  check_run:
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["*"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: read
  checks: read

jobs:
  update-project-on-ci-status:
    name: Update Project Based on CI Status
    runs-on: ubuntu-latest
    steps:
      - name: Get PR or Issue Info
        id: get-info
        uses: actions/github-script@v7
        with:
          script: |
            const context_name = context.eventName;
            let item_number = null;
            let item_type = null;
            let sha = null;
            
            // Determine the item (PR or issue) and commit SHA
            if (context.payload.pull_request) {
              item_number = context.payload.pull_request.number;
              item_type = 'pull_request';
              sha = context.payload.pull_request.head.sha;
            } else if (context.payload.issue) {
              item_number = context.payload.issue.number;
              item_type = 'issue';
            } else if (context.payload.check_suite) {
              // Get PRs associated with this check suite
              const prs = context.payload.check_suite.pull_requests;
              if (prs && prs.length > 0) {
                item_number = prs[0].number;
                item_type = 'pull_request';
              }
              sha = context.payload.check_suite.head_sha;
            } else if (context.payload.check_run) {
              const prs = context.payload.check_run.pull_requests;
              if (prs && prs.length > 0) {
                item_number = prs[0].number;
                item_type = 'pull_request';
              }
              sha = context.payload.check_run.head_sha;
            } else if (context.payload.workflow_run) {
              const prs = context.payload.workflow_run.pull_requests;
              if (prs && prs.length > 0) {
                item_number = prs[0].number;
                item_type = 'pull_request';
              }
              sha = context.payload.workflow_run.head_sha;
            }
            
            core.setOutput('item_number', item_number);
            core.setOutput('item_type', item_type);
            core.setOutput('sha', sha);

      - name: Check CI Status
        id: check-ci
        if: steps.get-info.outputs.sha
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.get-info.outputs.sha }}';
            
            // Get all check runs for this commit
            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha
            });
            
            // Get combined status
            const { data: combinedStatus } = await github.rest.repos.getCombinedStatusForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha
            });
            
            // Determine overall status
            let ci_passed = true;
            let ci_status = 'success';
            let failed_checks = [];
            
            // Check if any required checks failed
            for (const check of checkRuns.check_runs) {
              if (check.conclusion === 'failure' || check.conclusion === 'cancelled' || check.conclusion === 'timed_out') {
                ci_passed = false;
                ci_status = 'failure';
                failed_checks.push(check.name);
              }
            }
            
            // Also check commit statuses
            if (combinedStatus.state === 'failure' || combinedStatus.state === 'error') {
              ci_passed = false;
              ci_status = 'failure';
            }
            
            core.setOutput('ci_passed', ci_passed);
            core.setOutput('ci_status', ci_status);
            core.setOutput('failed_checks', failed_checks.join(', '));

      - name: Update Project Item Status - CI Failed
        if: steps.check-ci.outputs.ci_passed == 'false' && steps.get-info.outputs.item_number
        uses: actions/github-script@v7
        env:
          PROJECT_NUMBER: 1
          ITEM_NUMBER: ${{ steps.get-info.outputs.item_number }}
          ITEM_TYPE: ${{ steps.get-info.outputs.item_type }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const projectNumber = parseInt(process.env.PROJECT_NUMBER);
            const itemNumber = parseInt(process.env.ITEM_NUMBER);
            const itemType = process.env.ITEM_TYPE;
            
            // Get the project
            const { data: projects } = await github.rest.projects.listForUser({
              username: 'AUo959'
            });
            
            // Find project by number
            const project = projects.find(p => p.number === projectNumber);
            if (!project) {
              console.log('Project not found');
              return;
            }
            
            // Get project items and update status to 'In Progress'
            // Note: This uses GitHub Projects V2 API via GraphQL
            const query = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $value }
                  }
                ) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;
            
            // Add comment to PR/issue about CI failure
            const comment = `⚠️ **CI Status Update**\n\nCI checks have failed for this ${itemType === 'pull_request' ? 'PR' : 'issue'}.\n\n**Failed checks:** ${{ steps.check-ci.outputs.failed_checks }}\n\nThe project board status has been set to **In Progress** until checks pass.`;
            
            if (itemType === 'pull_request') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: itemNumber,
                body: comment
              });
            } else if (itemType === 'issue') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: itemNumber,
                body: comment
              });
            }

      - name: Update Project Item Status - CI Passed
        if: steps.check-ci.outputs.ci_passed == 'true' && steps.get-info.outputs.item_number
        uses: actions/github-script@v7
        env:
          PROJECT_NUMBER: 1
          ITEM_NUMBER: ${{ steps.get-info.outputs.item_number }}
          ITEM_TYPE: ${{ steps.get-info.outputs.item_type }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const itemNumber = parseInt(process.env.ITEM_NUMBER);
            const itemType = process.env.ITEM_TYPE;
            
            // Add comment to PR/issue about CI success
            const comment = `✅ **CI Status Update**\n\nAll CI checks have passed!\n\nThe project board status has been updated to **${itemType === 'pull_request' ? 'In Review' : 'Ready'}**.`;
            
            if (itemType === 'pull_request') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: itemNumber,
                body: comment
              });
            } else if (itemType === 'issue') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: itemNumber,
                body: comment
              });
            }

  add-ci-status-to-cards:
    name: Display CI Status on Project Cards
    runs-on: ubuntu-latest
    if: github.event.pull_request || github.event.issue
    steps:
      - name: Add CI Status Label
        uses: actions/github-script@v7
        with:
          script: |
            const item_number = context.payload.pull_request?.number || context.payload.issue?.number;
            const sha = context.payload.pull_request?.head?.sha;
            
            if (!sha) {
              console.log('No SHA available, skipping');
              return;
            }
            
            // Get CI status
            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha
            });
            
            const { data: combinedStatus } = await github.rest.repos.getCombinedStatusForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha
            });
            
            // Determine status label
            let statusLabel = 'ci: pending';
            if (checkRuns.check_runs.some(c => c.conclusion === 'failure')) {
              statusLabel = 'ci: failed';
            } else if (checkRuns.check_runs.every(c => c.conclusion === 'success')) {
              statusLabel = 'ci: passed';
            }
            
            // Remove old CI labels
            const labels = ['ci: pending', 'ci: passed', 'ci: failed'];
            for (const label of labels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: item_number,
                  name: label
                });
              } catch (e) {
                // Label might not exist, ignore
              }
            }
            
            // Add current status label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: item_number,
              labels: [statusLabel]
            });
