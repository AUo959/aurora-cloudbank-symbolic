name: Aurora Release Pipeline

permissions:
  contents: write         # Write releases and tags
  actions: read          # Read workflow status
  checks: write          # Write check results
  security-events: write # Write security events

'on':
  push:
    tags:
    - v*
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: v1.0.0

jobs:
  approval-gate:
    uses: ./.github/workflows/t1-approval-gate.yml
    with:
      reason: "Release pipeline approval"

  create-release:
    name: "\U0001F4E6 Create Release"
    runs-on: ubuntu-latest
    needs: approval-gate
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Generate changelog
      run: git log --oneline --since="1 month ago" > CHANGELOG.md || true
    # SRB-T1: Upgraded to softprops/action-gh-release due to actions/create-release@v1 deprecation (2025-08-19)
    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        name: Aurora CloudBank ${{ github.ref_name }}
        body_path: CHANGELOG.md
        draft: false
        prerelease: false
        generate_release_notes: true
