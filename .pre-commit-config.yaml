# Aurora CloudBank Essential Pre-commit Configuration
# Streamlined for performance and reliability

repos:
  - repo: local
    hooks:
      - id: aurora-pre-commit
        name: aurora-pre-commit
        entry: bash scripts/run_pre_commit.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: shallow-assertion-warning
        name: shallow-assertion-warning
        entry: python .github/hooks/check_shallow_assertions.py
        language: system
        files: '^tests/.*\.py$'
        stages: [pre-commit]

  # Essential file checks - fast and reliable
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(md|txt|zip|pdf)$'
      - id: end-of-file-fixer
        exclude: '\.(min\.(js|css)|zip|pdf|png|jpg|jpeg)$'
      - id: check-yaml
        files: '\.(yaml|yml)$'
      - id: check-json
        files: '\.json$'
      - id: check-merge-conflict

  # Python essentials - flake8 only for speed
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: [
          '--max-line-length=100',
          '--ignore=E203,W503,F401,E501',
          '--exclude=.venv,__pycache__,.git,build,dist,*.egg-info,syntax_errors_archive,venv_opal2',
          '--per-file-ignores=__init__.py:F401'
        ]
        files: '\.py$'
        exclude: '(migrations|\.venv|syntax_errors_archive|venv_opal2)/.*\.py$'

default_stages: [pre-commit]
fail_fast: false
minimum_pre_commit_version: 3.0.0
