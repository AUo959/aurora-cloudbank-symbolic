name: Stale Items and Blocked Report

on:
  schedule:
    # Run daily at 9 AM UTC to check for stale items
    - cron: '0 9 * * *'
    # Run weekly on Monday at 9 AM UTC for blocked items report
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale issues and pull requests
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue has been automatically marked as stale because it has not had activity for 30 days. It will be archived if no further activity occurs.'
          stale-pr-message: 'This pull request has been automatically marked as stale because it has not had activity for 30 days. It will be archived if no further activity occurs.'
          close-issue-message: 'This issue has been automatically archived due to inactivity.'
          close-pr-message: 'This pull request has been automatically archived due to inactivity.'
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'blocked,pinned,security'
          exempt-pr-labels: 'blocked,pinned,security'

  blocked-items-report:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 9 * * 1' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Generate Weekly Blocked Items Report
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Get all open issues with 'blocked' label
            const blockedIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'blocked',
              per_page: 100
            });
            
            // Get all open issues to check for aging items (30+ days)
            const allIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            
            const now = new Date();
            const thirtyDaysAgo = new Date(now - 30 * 24 * 60 * 60 * 1000);
            
            // Filter aging issues (no updates in 30+ days)
            const agingIssues = allIssues.data.filter(issue => {
              const updated = new Date(issue.updated_at);
              return updated < thirtyDaysAgo && !issue.labels.some(l => l.name === 'blocked' || l.name === 'stale');
            });
            
            // Filter backlogged items (no assignee, older than 14 days)
            const fourteenDaysAgo = new Date(now - 14 * 24 * 60 * 60 * 1000);
            const backloggedIssues = allIssues.data.filter(issue => {
              const created = new Date(issue.created_at);
              return !issue.assignee && created < fourteenDaysAgo && issue.state === 'open';
            });
            
            // Create report
            let report = '## 📊 Weekly Priority Tracker Report\n\n';
            report += `**Report Date:** ${now.toISOString().split('T')[0]}\n\n`;
            
            report += `### 🚫 Blocked Items (${blockedIssues.data.length})\n`;
            if (blockedIssues.data.length > 0) {
              blockedIssues.data.forEach(issue => {
                const age = Math.floor((now - new Date(issue.created_at)) / (1000 * 60 * 60 * 24));
                report += `- [#${issue.number}](${issue.html_url}) - ${issue.title} (${age} days old)\n`;
              });
            } else {
              report += 'No blocked items found.\n';
            }
            
            report += `\n### ⏳ Aging Items - No Activity 30+ Days (${agingIssues.length})\n`;
            if (agingIssues.length > 0) {
              agingIssues.slice(0, 10).forEach(issue => {
                const daysSinceUpdate = Math.floor((now - new Date(issue.updated_at)) / (1000 * 60 * 60 * 24));
                report += `- [#${issue.number}](${issue.html_url}) - ${issue.title} (${daysSinceUpdate} days since update)\n`;
              });
              if (agingIssues.length > 10) {
                report += `\n_... and ${agingIssues.length - 10} more_\n`;
              }
            } else {
              report += 'No aging items found.\n';
            }
            
            report += `\n### 📥 Backlogged Items - Unassigned 14+ Days (${backloggedIssues.length})\n`;
            if (backloggedIssues.length > 0) {
              backloggedIssues.slice(0, 10).forEach(issue => {
                const age = Math.floor((now - new Date(issue.created_at)) / (1000 * 60 * 60 * 24));
                report += `- [#${issue.number}](${issue.html_url}) - ${issue.title} (${age} days old)\n`;
              });
              if (backloggedIssues.length > 10) {
                report += `\n_... and ${backloggedIssues.length - 10} more_\n`;
              }
            } else {
              report += 'No backlogged items found.\n';
            }
            
            report += '\n---\n';
            report += '_This report is automatically generated weekly to help maintain project health._\n';
            
            // Create or update tracking issue for the weekly report
            const issueTitle = `[Weekly Report] Priority Tracker Status - ${now.toISOString().split('T')[0]}`;
            
            await github.rest.issues.create({
              owner,
              repo,
              title: issueTitle,
              body: report,
              labels: ['automated-report', 'weekly-status']
            });
            
            console.log('Weekly report created successfully!');
            console.log(report);
