# Aurora CloudBank Symbolic - Ingress Configuration
# Kubernetes Ingress for external HTTP/HTTPS access
#
# Ethics Protocol: Picard_Delta_3 - Secure external access
# T1: Ingress creation timestamp
# SRB: K8S_INGRESS_v1
# Chain Notation: #K8S//INGRESS//AURORA_GUI_CLOUDHUB//
#
# Features:
# - TLS termination
# - Path-based routing
# - Rate limiting
# - Authentication (optional)
# - CORS headers

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aurora-gui-cloudhub-ingress
  namespace: aurora-cloudbank
  labels:
    app: aurora-gui-cloudhub
    ethics-protocol: picard-delta-3
  annotations:
    # Aurora metadata
    aurora.io/chain-notation: "#K8S//INGRESS//AURORA_GUI_CLOUDHUB//"
    aurora.io/srb: "K8S_INGRESS_v1"
    aurora.io/ethics-protocol: "Picard_Delta_3"
    
    # Ingress class
    kubernetes.io/ingress.class: "nginx"
    
    # TLS configuration
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # Rate limiting (adjust based on your needs)
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    
    # CORS configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/cors-expose-headers: "Content-Length,Content-Range"
    nginx.ingress.kubernetes.io/cors-max-age: "3600"
    
    # SSL configuration
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # WebSocket support
    nginx.ingress.kubernetes.io/websocket-services: "aurora-gui-cloudhub"
    
    # Backend protocol
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    
    # Client body size (for file uploads)
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=()";
    
    # Authentication (optional - uncomment to enable)
    # nginx.ingress.kubernetes.io/auth-type: basic
    # nginx.ingress.kubernetes.io/auth-secret: aurora-basic-auth
    # nginx.ingress.kubernetes.io/auth-realm: 'Aurora CloudBank Authentication Required'

spec:
  # TLS configuration
  tls:
  - hosts:
    - aurora.example.com
    - www.aurora.example.com
    - api.aurora.example.com
    secretName: aurora-tls-cert  # TLS certificate secret (managed by cert-manager)
  
  # Routing rules
  rules:
  # Main domain
  - host: aurora.example.com
    http:
      paths:
      # Main application
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aurora-gui-cloudhub
            port:
              number: 80
      
      # Health check endpoint
      - path: /health
        pathType: Exact
        backend:
          service:
            name: aurora-gui-cloudhub-internal
            port:
              number: 8000
      
      # MCP Bridge endpoints
      - path: /mcp_bridge
        pathType: Prefix
        backend:
          service:
            name: aurora-gui-cloudhub
            port:
              number: 80
      
      # API endpoints
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: aurora-gui-cloudhub
            port:
              number: 80
      
      # WebSocket endpoint
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: aurora-gui-cloudhub
            port:
              number: 8080
  
  # API subdomain
  - host: api.aurora.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aurora-gui-cloudhub
            port:
              number: 80

