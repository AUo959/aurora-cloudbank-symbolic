name: "Constellation Event Router"

# Ref: Aurora Constellation Architecture Proposal v1.0.0 — Gap 3
#
# CONNECTIVITY PASS 2026-08-19:
#   - The route matrix contained entries whose subscriber is this repo
#     (aurora-cloudbank-symbolic) for event types this workflow itself
#     subscribes to. Routing dispatches with a PAT (CONSTELLATION_TOKEN), so
#     GitHub's same-token loop suppression does NOT apply and each self-route
#     would re-trigger this router indefinitely. Self-routes are removed and a
#     defensive guard rejects any future self-route at run time.
#   - A `hop` counter is enforced so a mis-configured spoke cannot ping-pong
#     events through the hub forever.

on:
  repository_dispatch:
    types:
      - qgia.forecast.completed
      - qgia.forecast.requested
      - zipwiz.archive.processed
      - aurora.drift.detected
      - qgia.knowledge.updated
      - constellation.health.check
      - constellation.health.response
      - constellation.manifest.drift

permissions:
  contents: read

jobs:
  validate-event:
    name: Validate Event Payload
    runs-on: ubuntu-latest
    outputs:
      event_type: ${{ steps.parse.outputs.event_type }}
      source_node: ${{ steps.parse.outputs.source_node }}
      valid: ${{ steps.validate.outputs.valid }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Parse event
        id: parse
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          # EVENT_ACTION is the repository_dispatch `event-type`, supplied by
          # whoever dispatched. It is never interpolated into this script body,
          # and it is shape-checked before reaching $GITHUB_OUTPUT: an embedded
          # newline would otherwise forge later output lines (e.g. `valid=true`)
          # and defeat the schema gate below. The `case` pattern tests the whole
          # string, so control characters cannot slip past a per-line match.
          case "$EVENT_ACTION" in
            "" | *[!a-z0-9._-]*)
              echo "::error::Rejecting malformed repository_dispatch event-type; expected [a-z0-9._-]+"
              exit 1
              ;;
          esac
          echo "event_type=$EVENT_ACTION" >> "$GITHUB_OUTPUT"
          echo "source_node=$(printf '%s' "$CLIENT_PAYLOAD" | jq -r '.source_node // "unknown"')" >> "$GITHUB_OUTPUT"
          echo "correlation_id=$(printf '%s' "$CLIENT_PAYLOAD" | jq -r '.correlation_id // "none"')" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate payload against schema
        id: validate
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from jsonschema import validate, ValidationError

          with open('constellation-contracts/schemas/constellation-event.schema.json', encoding='utf-8') as f:
              schema = json.load(f)

          raw_payload = os.environ.get('CLIENT_PAYLOAD', '{}')

          try:
              payload = json.loads(raw_payload)
          except json.JSONDecodeError as exc:
              print(f'Payload JSON decode failed: {exc}', file=sys.stderr)
              print(f'Raw payload: {raw_payload[:500]}', file=sys.stderr)
              sys.exit(1)

          try:
              validate(instance=payload, schema=schema)
              print('Payload is valid')
          except ValidationError as exc:
              print(f'Validation failed: {exc.message}', file=sys.stderr)
              sys.exit(1)
          PY
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Audit log
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          EVENT_TYPE: ${{ steps.parse.outputs.event_type }}
        run: |
          SOURCE=$(printf '%s' "$CLIENT_PAYLOAD" | jq -r '.source_node // "unknown"')
          CORR=$(printf '%s' "$CLIENT_PAYLOAD" | jq -r '.correlation_id // "none"')
          echo "::notice::Constellation Event received: type=${EVENT_TYPE}, source=${SOURCE}, correlation_id=${CORR}"

  route-event:
    name: Route to ${{ matrix.subscriber }}
    needs: validate-event
    if: needs.validate-event.outputs.valid == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # qgia.forecast.completed → AURORA-RUNTIME, ZIPWIZ-ENGINE
          - event: qgia.forecast.completed
            subscriber: AuroraOS
            owner: AUo959
          - event: qgia.forecast.completed
            subscriber: zip_wizard
            owner: AUo959
          # qgia.forecast.requested / zipwiz.archive.processed /
          # qgia.knowledge.updated are consumed IN-REPO by the hub's own
          # workflows (e.g. constellation-knowledge-aggregator.yml). They are
          # deliberately NOT re-dispatched to this repo — that was an
          # unbounded-loop edge.
          # qgia.knowledge.updated → AURORA-RUNTIME
          - event: qgia.knowledge.updated
            subscriber: AuroraOS
            owner: AUo959
          # constellation.health.check → all spokes
          - event: constellation.health.check
            subscriber: AuroraOS
            owner: AUo959
          - event: constellation.health.check
            subscriber: cloudbank-quantum-en
            owner: AUo959
          - event: constellation.health.check
            subscriber: qgia-knowledge-library
            owner: AUo959
          - event: constellation.health.check
            subscriber: qgia-knowledge-spine
            owner: AUo959
          - event: constellation.health.check
            subscriber: zip_wizard
            owner: AUo959
          - event: constellation.health.check
            subscriber: Aurora_ORIONCORE_Directory_Main
            owner: AUo959
    steps:
      - name: Reject self-route
        if: format('{0}/{1}', matrix.owner, matrix.subscriber) == github.repository
        env:
          EVENT_TYPE: ${{ needs.validate-event.outputs.event_type }}
          THIS_REPO: ${{ github.repository }}
        run: |
          echo "::error::Refusing to dispatch ${EVENT_TYPE} back to ${THIS_REPO} — self-routing creates an unbounded dispatch loop under a PAT."
          exit 1

      - name: Enforce hop limit
        if: needs.validate-event.outputs.event_type == matrix.event
        env:
          HOP: ${{ github.event.client_payload.hop }}
        run: |
          HOP="${HOP:-0}"
          if [ "$HOP" -ge 3 ]; then
            echo "::error::hop=$HOP exceeds the constellation hop limit (3); dropping event to break a routing loop."
            exit 1
          fi
          echo "Routing at hop $HOP (limit 3)"

      - name: Route event
        if: needs.validate-event.outputs.event_type == matrix.event
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
        with:
          token: ${{ secrets.CONSTELLATION_TOKEN }}
          repository: ${{ matrix.owner }}/${{ matrix.subscriber }}
          event-type: ${{ needs.validate-event.outputs.event_type }}
          client-payload: ${{ toJSON(github.event.client_payload) }}
