<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' ws: wss:; font-src 'self'; object-src 'none'; media-src 'self'; frame-src 'none';">
    <title>Aurora Collaboration Chamber</title>
    <style>
        :root {
            --bg: #061017;
            --panel: rgba(10, 20, 31, 0.86);
            --panel-strong: rgba(8, 16, 25, 0.96);
            --line: rgba(107, 202, 255, 0.18);
            --accent: #73d2ff;
            --accent-warm: #ffc567;
            --text: #eff8fd;
            --muted: #94a8b7;
            --ok: #4bd287;
            --error: #ff7a7a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Avenir Next", "Trebuchet MS", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(115, 210, 255, 0.16), transparent 28%),
                radial-gradient(circle at bottom right, rgba(255, 197, 103, 0.16), transparent 26%),
                linear-gradient(145deg, #03070b 0%, #07131c 44%, #040d14 100%);
            color: var(--text);
        }

        .layout {
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr) 320px;
            gap: 14px;
            min-height: 100vh;
            padding: 16px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 18px;
            backdrop-filter: blur(14px);
        }

        .sidebar h1 {
            margin: 0;
            font-size: 1.35rem;
        }

        .sidebar p,
        .meta,
        .trace-item,
        .channel-sub {
            color: var(--muted);
        }

        .section-label {
            margin-top: 22px;
            margin-bottom: 10px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.16em;
            font-size: 0.72rem;
        }

        .channel-list,
        .agent-list,
        .trace-list,
        .feed {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .channel,
        .agent {
            border-radius: 16px;
            padding: 14px;
            border: 1px solid transparent;
            background: rgba(115, 210, 255, 0.04);
            cursor: pointer;
            transition: border-color 140ms ease, transform 140ms ease, background 140ms ease;
        }

        .channel:hover,
        .agent:hover {
            border-color: rgba(115, 210, 255, 0.18);
            transform: translateY(-1px);
        }

        .channel.active,
        .agent.active {
            border-color: rgba(255, 197, 103, 0.26);
            background: rgba(255, 197, 103, 0.08);
        }

        .main {
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 14px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .topbar h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        .status-chip {
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(75, 210, 135, 0.14);
            color: var(--ok);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 700;
        }

        .feed {
            overflow-y: auto;
            min-height: 58vh;
            padding-right: 4px;
        }

        .bubble {
            border-radius: 18px;
            padding: 14px 16px;
            border: 1px solid var(--line);
            background: rgba(5, 12, 18, 0.7);
        }

        .bubble.user {
            background: rgba(115, 210, 255, 0.08);
            border-color: rgba(115, 210, 255, 0.18);
        }

        .bubble.reply {
            background: rgba(255, 197, 103, 0.07);
            border-color: rgba(255, 197, 103, 0.18);
        }

        .bubble.system {
            background: rgba(255, 255, 255, 0.03);
        }

        .bubble.error {
            border-color: rgba(255, 122, 122, 0.3);
            background: rgba(255, 122, 122, 0.08);
        }

        .bubble-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
            font-size: 0.86rem;
        }

        .bubble-title {
            font-weight: 700;
        }

        .composer {
            display: grid;
            gap: 12px;
        }

        .composer textarea {
            width: 100%;
            min-height: 120px;
            resize: vertical;
            border-radius: 18px;
            border: 1px solid var(--line);
            background: rgba(2, 9, 14, 0.9);
            color: var(--text);
            padding: 14px 16px;
            font: inherit;
        }

        .composer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .composer button {
            border: 0;
            border-radius: 999px;
            padding: 12px 18px;
            cursor: pointer;
            color: #071018;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), #bde8ff);
        }

        .composer button.secondary {
            color: var(--text);
            background: rgba(115, 210, 255, 0.08);
            border: 1px solid rgba(115, 210, 255, 0.2);
        }

        .trace-list {
            max-height: 70vh;
            overflow-y: auto;
        }

        .trace-item {
            border-radius: 14px;
            border: 1px solid rgba(115, 210, 255, 0.12);
            background: rgba(115, 210, 255, 0.04);
            padding: 12px 14px;
            line-height: 1.45;
            font-size: 0.9rem;
        }

        .typing-indicator {
            color: var(--accent);
            font-size: 0.92rem;
        }

        @media (max-width: 1120px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .feed {
                min-height: 42vh;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="panel sidebar">
            <h1>Aurora Chamber</h1>
            <p>Live chamber playback from the FastAPI mesh runtime. No simulated client replies.</p>

            <div class="section-label">Channels</div>
            <div class="channel-list" id="channelList"></div>

            <div class="section-label">Agents</div>
            <div class="agent-list" id="agentList"></div>
        </aside>

        <main class="panel main">
            <div class="topbar">
                <div>
                    <h2 id="channelTitle">Loading channel...</h2>
                    <div class="meta" id="channelMeta">Connecting to mesh runtime</div>
                </div>
                <div class="status-chip" id="socketStatus">offline</div>
            </div>

            <section class="feed" id="feed"></section>

            <section class="composer">
                <div class="typing-indicator" id="typingIndicator"></div>
                <textarea id="messageInput" placeholder="Type a message for the current line or channel..."></textarea>
                <div class="composer-row">
                    <div class="meta" id="composerMeta"></div>
                    <div style="display:flex; gap:10px;">
                        <button id="replayHistoryBtn" type="button" class="secondary">Replay History</button>
                        <button id="sendMessageBtn" type="button">Send</button>
                    </div>
                </div>
            </section>
        </main>

        <aside class="panel">
            <div class="section-label">Trace</div>
            <div class="trace-list" id="traceList"></div>
        </aside>
    </div>

    <script src="../../static/js/aurora-security.js"></script>
    <script>
        class MeshChamber {
            constructor() {
                this.status = null;
                this.socket = null;
                this.events = [];
                this.traceEvents = [];
                this.channelId = null;
                this.selectedAgent = null;
                this.typingAgents = new Set();
                this.feed = document.getElementById('feed');
                this.channelList = document.getElementById('channelList');
                this.agentList = document.getElementById('agentList');
                this.traceList = document.getElementById('traceList');
                this.channelTitle = document.getElementById('channelTitle');
                this.channelMeta = document.getElementById('channelMeta');
                this.socketStatus = document.getElementById('socketStatus');
                this.typingIndicator = document.getElementById('typingIndicator');
                this.composerMeta = document.getElementById('composerMeta');
                this.messageInput = document.getElementById('messageInput');
                this.replayHistoryButton = document.getElementById('replayHistoryBtn');
                this.sendMessageButton = document.getElementById('sendMessageBtn');
                this.replayHistoryButton.addEventListener('click', () => {
                    this.reloadHistory();
                });
                this.sendMessageButton.addEventListener('click', () => {
                    this.sendMessage();
                });
            }

            toText(value) {
                if (value === null || value === undefined) {
                    return '';
                }
                return String(value);
            }

            toArray(value) {
                return Array.isArray(value) ? value : [];
            }

            formatTimestamp(value) {
                if (!value) {
                    return 'unknown';
                }
                const date = new Date(value);
                return Number.isNaN(date.getTime()) ? this.toText(value) : date.toLocaleTimeString();
            }

            createElement(tagName, options = {}) {
                const element = document.createElement(tagName);
                if (options.className) {
                    element.className = options.className;
                }
                if (Object.prototype.hasOwnProperty.call(options, 'text')) {
                    element.textContent = this.toText(options.text);
                }
                return element;
            }

            stringifyPayload(payload) {
                if (typeof payload === 'string') {
                    return payload;
                }
                if (payload === null || payload === undefined) {
                    return '';
                }
                try {
                    return JSON.stringify(payload);
                } catch (error) {
                    return '[unserializable payload]';
                }
            }

            async init() {
                await this.loadStatus();
                this.applyQuerySelection();
                await this.reloadHistory();
                this.connectSocket();
            }

            async loadStatus() {
                const response = await fetch('/api/mesh/status');
                this.status = await response.json();
                this.renderChannels();
                this.renderAgents();
                if (!this.channelId) {
                    this.channelId = this.status.channels.includes('#crew_lounge') ? '#crew_lounge' : this.status.channels[0];
                }
                this.renderHeader();
            }

            applyQuerySelection() {
                const params = new URLSearchParams(window.location.search);
                const channel = params.get('channel');
                const agent = params.get('agent');
                if (agent) {
                    const manifest = this.status.agents.find((item) => item.agent_id === agent);
                    if (manifest) {
                        this.selectedAgent = manifest.agent_id;
                        this.channelId = channel || manifest.default_channel;
                    }
                } else if (channel) {
                    this.channelId = channel;
                    this.selectedAgent = null;
                }
            }

            renderChannels() {
                const fragment = document.createDocumentFragment();
                for (const channel of this.toArray(this.status.channels)) {
                    const item = this.createElement('div', {
                        className: `channel ${this.channelId === channel ? 'active' : ''}`,
                    });
                    item.addEventListener('click', () => {
                        this.selectChannel(channel);
                    });

                    item.append(
                        this.createElement('div', { text: channel }),
                        this.createElement('div', {
                            className: 'channel-sub',
                            text: channel.startsWith('#') ? 'Broadcast channel' : 'Direct line',
                        })
                    );
                    fragment.append(item);
                }
                this.channelList.replaceChildren(fragment);
            }

            renderAgents() {
                const fragment = document.createDocumentFragment();
                for (const agent of this.toArray(this.status.agents)) {
                    const item = this.createElement('div', {
                        className: `agent ${this.selectedAgent === agent.agent_id ? 'active' : ''}`,
                    });
                    item.addEventListener('click', () => {
                        this.selectAgent(agent.agent_id);
                    });

                    item.append(
                        this.createElement('div', { text: agent.display_name }),
                        this.createElement('div', {
                            className: 'channel-sub',
                            text: `${this.toText(agent.execution_mode)} | ${this.toText(agent.status)}`,
                        })
                    );
                    fragment.append(item);
                }
                this.agentList.replaceChildren(fragment);
            }

            renderHeader() {
                this.channelTitle.textContent = this.channelId || 'No channel selected';
                if (this.selectedAgent) {
                    const agent = this.status.agents.find((item) => item.agent_id === this.selectedAgent);
                    this.channelMeta.textContent = `${agent.display_name} | ${agent.execution_mode} | ${agent.status}`;
                } else {
                    this.channelMeta.textContent = 'Broadcast channel routing';
                }
                this.composerMeta.textContent = this.selectedAgent
                    ? `Direct target: ${this.selectedAgent}`
                    : `Broadcast target: ${this.channelId}`;
            }

            async selectChannel(channel) {
                this.channelId = channel;
                this.selectedAgent = null;
                this.typingAgents.clear();
                this.renderChannels();
                this.renderAgents();
                this.renderHeader();
                await this.reloadHistory();
            }

            async selectAgent(agentId) {
                this.selectedAgent = agentId;
                const agent = this.status.agents.find((item) => item.agent_id === agentId);
                this.channelId = agent.default_channel;
                this.typingAgents.clear();
                this.renderChannels();
                this.renderAgents();
                this.renderHeader();
                await this.reloadHistory();
            }

            async reloadHistory() {
                if (!this.channelId) {
                    return;
                }
                const response = await fetch(`/api/mesh/channels/${encodeURIComponent(this.channelId)}/history?limit=200`);
                const history = await response.json();
                this.events = history.events || [];
                this.traceEvents = this.events.filter((event) => event.event_type === 'trace_update');
                this.renderFeed();
                this.renderTrace();
            }

            connectSocket() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                this.socket = new WebSocket(`${protocol}//${window.location.host}/ws/mesh`);
                this.socket.addEventListener('open', () => {
                    this.socketStatus.textContent = 'online';
                });
                this.socket.addEventListener('close', () => {
                    this.socketStatus.textContent = 'offline';
                });
                this.socket.addEventListener('message', (event) => {
                    const envelope = JSON.parse(event.data);
                    if (envelope.event_type === 'trace_update') {
                        this.traceEvents.push(envelope);
                        this.traceEvents = this.traceEvents.slice(-60);
                        this.renderTrace();
                    }
                    if (envelope.channel_id === this.channelId) {
                        this.events.push(envelope);
                        this.events = this.events.slice(-250);
                        this.consumeTyping(envelope);
                        this.renderFeed();
                    }
                });
            }

            consumeTyping(envelope) {
                if (envelope.event_type === 'agent_typing' && envelope.agent_id) {
                    this.typingAgents.add(envelope.agent_id);
                }
                if (envelope.event_type === 'agent_reply' && envelope.agent_id) {
                    this.typingAgents.delete(envelope.agent_id);
                }
                if (envelope.event_type === 'delivery_error' && envelope.agent_id) {
                    this.typingAgents.delete(envelope.agent_id);
                }
                this.typingIndicator.textContent = this.typingAgents.size
                    ? `Typing: ${Array.from(this.typingAgents).join(', ')}`
                    : '';
            }

            renderFeed() {
                const fragment = document.createDocumentFragment();
                for (const event of this.events.filter((item) => item.event_type !== 'trace_update')) {
                    let bubbleClass = 'bubble system';
                    let title = event.event_type;
                    let body = this.stringifyPayload(event.payload);

                    if (event.event_type === 'message_accepted') {
                        bubbleClass = event.agent_id ? 'bubble system' : 'bubble user';
                        title = event.payload.sender_name || 'User';
                        body = event.payload.content;
                    } else if (event.event_type === 'agent_reply') {
                        bubbleClass = 'bubble reply';
                        title = event.payload.agent_name || event.agent_id;
                        body = event.payload.content;
                    } else if (event.event_type === 'agent_ack') {
                        title = event.payload.agent_name || event.agent_id;
                        body = `Acknowledged in ${event.payload.execution_mode}`;
                    } else if (event.event_type === 'agent_typing') {
                        title = event.payload.agent_name || event.agent_id;
                        body = 'Preparing reply';
                    } else if (event.event_type === 'delivery_error') {
                        bubbleClass = 'bubble error';
                        title = event.payload.agent_name || event.agent_id || 'Delivery error';
                        body = event.payload.error;
                    }

                    const article = this.createElement('article', { className: bubbleClass });
                    const head = this.createElement('div', { className: 'bubble-head' });
                    head.append(
                        this.createElement('div', { className: 'bubble-title', text: title }),
                        this.createElement('div', { className: 'meta', text: this.formatTimestamp(event.timestamp) })
                    );

                    const bodyNode = this.createElement('div', { text: body });
                    article.append(head, bodyNode);
                    fragment.append(article);
                }
                this.feed.replaceChildren(fragment);
                this.feed.scrollTop = this.feed.scrollHeight;
            }

            renderTrace() {
                const fragment = document.createDocumentFragment();
                for (const event of this.traceEvents.slice(-40)) {
                    const item = this.createElement('div', { className: 'trace-item' });
                    const phase = this.createElement('strong', {
                        text: event.payload.phase || event.event_type,
                    });
                    const detail = this.createElement('div', {
                        text: event.payload.detail || '',
                    });
                    const timestamp = this.createElement('span', {
                        className: 'meta',
                        text: this.formatTimestamp(event.timestamp),
                    });
                    item.append(phase, detail, timestamp);
                    fragment.append(item);
                }
                this.traceList.replaceChildren(fragment);
            }

            async sendMessage() {
                const content = this.messageInput.value.trim();
                if (!content) {
                    return;
                }
                const payload = this.selectedAgent
                    ? { to: this.selectedAgent, channel: this.channelId, content, type: 'direct' }
                    : { channel: this.channelId, content, type: this.channelId.startsWith('#') ? 'broadcast' : 'direct' };

                const response = await fetch('/api/mesh/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const error = await response.json();
                    this.traceEvents.push({
                        event_type: 'trace_update',
                        timestamp: new Date().toISOString(),
                        payload: { phase: 'send_failed', detail: error.detail || 'Unable to send message' }
                    });
                    this.renderTrace();
                    return;
                }

                this.messageInput.value = '';
            }
        }

        const chamber = new MeshChamber();
        chamber.init();
    </script>
</body>
</html>
