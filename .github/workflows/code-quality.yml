---
name: Code Quality Analysis

# Comprehensive code quality workflow implementing Issue #258
# Runs flake8 analysis, generates reports, and creates issues for critical violations

on:
  push:
    branches: [main, develop]
    paths:
      - '**.py'
      - '.flake8'
      - '.github/workflows/code-quality.yml'
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      create_issues:
        description: 'Create GitHub issues for critical violations'
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: "Code Quality Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Legacy references detector (non-blocking)
        continue-on-error: true
        run: |
          bash scripts/verify_removed_paths_unused.sh
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 requests
      
      - name: Run flake8 analysis
        id: flake8
        continue-on-error: true
        run: |
          echo "Running scoped flake8 analysis..."
          paths=""
          for d in api src tools tests modules/hr_system modules/resilience_sentinel modules/gumas modules/symbolic_core modules/aumemmanager; do
            [ -d "$d" ] && paths="$paths $d"
          done
          if [ -z "$paths" ]; then
            echo "No target directories found for analysis" && exit 0
          fi
          python src/core/code_quality_analyzer.py $paths \
            --output reports/code_quality_report.json \
            --reflection
          
          # Capture exit code
          echo "exit_code=$?" >> $GITHUB_OUTPUT
      
      - name: Generate analysis summary
        if: always()
        run: |
          if [ -f reports/code_quality_report.json ]; then
            echo "## Code Quality Analysis Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            python scripts/parse_code_quality_report.py reports/code_quality_report.json >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No code quality report generated" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload code quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-report
          path: reports/code_quality_report.json
          retention-days: 30
      
      - name: Create issues for critical violations
        if: |
          always() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          (github.event.inputs.create_issues == 'true' || steps.flake8.outputs.exit_code != '0')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f reports/code_quality_report.json ]; then
            python src/core/code_quality_issue_creator.py \
              --report reports/code_quality_report.json \
              --owner ${{ github.repository_owner }} \
              --repo ${{ github.event.repository.name }} \
              --commit ${{ github.sha }} \
              --max-issues 5
          fi
      
      - name: Comment on PR
        if: |
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request
        id: build_pr_comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            if (!fs.existsSync('reports/code_quality_report.json')) {
              console.log('No report found, skipping PR comment');
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'should_comment=false\n');
              return;
            }
            
            const report = JSON.parse(fs.readFileSync('reports/code_quality_report.json', 'utf8'));
            const summary = report.analysis_summary || {};
            const severity = summary.severity_breakdown || {};
            const passed = summary.passed || false;
            const total = summary.total_violations || 0;
            
            const statusEmoji = passed ? '✅' : '❌';
            
            let comment = `## ${statusEmoji} Code Quality Analysis Results\n\n`;
            comment += `**Status:** ${passed ? 'Passed' : 'Failed'}\n`;
            comment += `**Total Violations:** ${total}\n\n`;
            comment += '### Severity Breakdown\n';
            comment += `- 🔴 Critical: ${severity.critical || 0}\n`;
            comment += `- 🟠 High: ${severity.high || 0}\n`;
            comment += `- 🟡 Medium: ${severity.medium || 0}\n`;
            comment += `- 🟢 Low: ${severity.low || 0}\n\n`;
            
            if (severity.critical > 0) {
              comment += '### ⚠️ Action Required\n';
              comment += 'This PR contains **critical** code quality violations that must be fixed before merging.\n\n';
            }
            
            comment += '---\n';
            comment += '*Analysis performed by Aurora Code Quality Analyzer (Issue #258)*\n';
            
            // Write comment to file
            fs.writeFileSync('/tmp/code_quality_comment.md', comment);

            // Signal the next step to post/update the PR comment
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'should_comment=true\n');
      
      - name: Post Code Quality Comment
        if: steps.build_pr_comment.outputs.should_comment == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use smart comment handler to update existing comment
          bash .github/scripts/smart-comment.sh ${{ github.event.pull_request.number }} "CODE_QUALITY_REPORT" /tmp/code_quality_comment.md
      
      - name: Check quality gate
        if: always()
        run: |
          python scripts/parse_code_quality_report.py reports/code_quality_report.json --check-gate

  sonarcloud:
    name: "SonarCloud Analysis"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: SonarCloud Scan
        # Pinned for supply-chain security (v5.0.0)
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true
        with:
          args: >
            -Dsonar.projectKey=AUo959_aurora-cloudbank-symbolic
            -Dsonar.organization=auo959
            -Dsonar.python.version=3.12
            -Dsonar.sources=src,modules
            -Dsonar.tests=tests
            -Dsonar.exclusions=**/*_test.py,**/test_*.py,**/__pycache__/**
