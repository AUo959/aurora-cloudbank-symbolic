# queue-validation.yml
# Enforces projection freshness for the Aurora work queue.
#
# Trigger: any PR that touches ops/work_queue/** or this workflow file.
# Also available as a manual workflow_dispatch for on-demand audits.
#
# What it checks:
#   - queue.json validates against queue_schema.json
#     (blocking here; the same tests run non-blocking in the full-suite pass
#     of Aurora CI (Minimal) — see tests/test_work_queue_schema.py).
#   - QUEUE.md and NEXT_UP.md are in sync with queue.json.
#   - OPEN_GATES.md is in sync with queue.json + gate_registry.json, and the
#     two canonical sources do not contain an unacknowledged contradiction.
#
# If drift is detected the job fails with a clear remediation message.
# Fix: run  python ops/work_queue/sync_queue.py  and push the result.
#
# Tracked in: https://github.com/AUo959/aurora-cloudbank-symbolic/issues/1147
# Authority:  Aurora (aurora_authority: true)

name: Queue Validation

on:
  pull_request:
    paths:
      - 'ops/work_queue/**'
      - '.github/workflows/queue-validation.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual dispatch (optional)'
        required: false
        default: 'Manual audit'

jobs:
  queue-drift-check:
    name: Queue drift check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      # jsonschema + pytest are required by the schema-validation step below.
      # sync_queue.py itself has no third-party dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: \
            jsonschema==4.26.0 \
            pytest==9.0.3

      - name: Validate queue.json exists and is valid JSON
        run: |
          python - <<'EOF'
          import json, sys
          path = "ops/work_queue/queue.json"
          try:
              with open(path) as f:
                  data = json.load(f)
              print(f"queue.json is valid JSON ({len(data.get('active', []))} active items)")
          except Exception as e:
              print(f"ERROR: {path} is not valid JSON: {e}")
              sys.exit(1)
          EOF

      # Blocking schema validation, scoped to the only PRs that can break it
      # (this workflow triggers on ops/work_queue/** paths). Elsewhere the same
      # tests run in Aurora CI (Minimal)'s full-suite pass, which is
      # informational only (continue-on-error) — without this step a schema
      # violation could merge with green checks. Closes the "Queue validation
      # CI" roadmap item of issue #1131.
      # --noconftest: tests/conftest.py imports fastapi at collection time,
      # which would drag the full requirements.txt install into this job.
      # test_work_queue_schema.py needs only stdlib + jsonschema and no
      # conftest fixtures, so it runs standalone.
      - name: Validate queue.json against queue_schema.json
        run: |
          pytest --noconftest tests/test_work_queue_schema.py tests/test_queue_issue_ingestion.py tests/test_gate_escalation.py -q --no-header

      - name: Check generated views and gate authority are coherent
        id: drift_check
        run: |
          python ops/work_queue/sync_queue.py --check

      - name: Post drift remediation hint on failure
        if: failure() && steps.drift_check.outcome == 'failure'
        run: |
          echo ""
          echo "========================================"
          echo "  QUEUE VIEW DRIFT DETECTED"
          echo "========================================"
          echo ""
          echo "  A generated view is stale or queue/gate-registry authority diverges."
          echo ""
          echo "  To fix:"
          echo "    python ops/work_queue/sync_queue.py"
          echo "    git add ops/work_queue/QUEUE.md ops/work_queue/NEXT_UP.md ops/work_queue/OPEN_GATES.md"
          echo "    git commit -m 'aurora(queue): regenerate views'"
          echo "    git push"
          echo ""
          echo "  DO NOT edit QUEUE.md, NEXT_UP.md, or OPEN_GATES.md by hand."
          echo "  They are generated artifacts. Canonical task state is queue.json;"
          echo "  canonical human-gate state is gate_registry.json."
          echo ""
          echo "  See: https://github.com/AUo959/aurora-cloudbank-symbolic/issues/1147"
          echo "========================================"
