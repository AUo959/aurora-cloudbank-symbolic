# Git Pre-Commit Hook Manifest
module:
  name: git_pre_commit_hook
  version: 2.0.1
  type: validation_hook

symbolic_anchors:
  primary: EOS_SEED_ORION
  protocol: Picard_Delta_3
  tags:
    - T1_PRECOMMIT_VALIDATOR
    - SRB_VALIDATION_GATE

dependencies:
  preferred:
    - canonical_validator (harvest-modules)
  fallback:
    - validation.CanonicalValidator
  stub:
    - internal_minimal_validator

memory_protocol:
  sealing: SHA256
  state_export: .git/validation_seal.json
  entropy_tracking: ENABLED
  divergent_truth_logging: ENABLED

error_handling:
  import_failure: GRACEFUL_DEGRADATION
  validation_error: CONSERVATIVE_BLOCK
  missing_files: ALLOW_WITH_WARNING

team:
  primary: Aurora/GUMAS
  review: harvest-team

dlp_tags:
  - VALIDATION_CRITICAL
  - MEMORY_SEALED
  - ANCHOR_TRACKED