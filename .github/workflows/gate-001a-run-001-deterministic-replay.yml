name: Gate-001A Run 001 Deterministic Replay

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact subject baseline
        uses: actions/checkout@v4
        with:
          ref: 3142aa47afac0b8e63cc5bc46f9fa8ae40592354
          fetch-depth: 1

      - name: Compare canonical and deterministic scans
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          out="gate001a-replay"
          mkdir -p "$out"

          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "3142aa47afac0b8e63cc5bc46f9fa8ae40592354"
          printf '%s\n' "$actual_sha" > "$out/baseline_commit.txt"
          grep --version | head -n 1 > "$out/grep_version.txt"
          python --version > "$out/python_version.txt" 2>&1

          set +e
          grep -rniE 'sherlock|watson|moriarty|tribunal|shadowfax' \
            src/monitoring/ src/subroutines/ modules/ethics_field/ modules/cask/ api/ \
            --include='*.py' > "$out/step2.canonical.txt" 2>&1
          step2_status=$?
          grep -rniE 'sherlock|watson|moriarty|tribunal|shadowfax' \
            src/ modules/ api/ config/ \
            --include='*.py' --include='*.json' --include='*.yaml' --include='*.toml' \
            > "$out/step3.canonical.txt" 2>&1
          step3_status=$?
          set -e

          printf '%s\n' "$step2_status" > "$out/step2.exit_code.txt"
          printf '%s\n' "$step3_status" > "$out/step3.exit_code.txt"

          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          out = Path("gate001a-replay")
          pattern = re.compile(r"sherlock|watson|moriarty|tribunal|shadowfax", re.IGNORECASE)

          def scan(roots, suffixes):
              paths = set()
              for root in roots:
                  root = Path(root)
                  if root.is_dir():
                      paths.update(
                          p for p in root.rglob("*") if p.is_file() and p.suffix in suffixes
                      )
              matches = []
              for path in sorted(paths, key=lambda p: p.as_posix()):
                  for number, line in enumerate(
                      path.read_text(encoding="utf-8", errors="replace").splitlines(), start=1
                  ):
                      if pattern.search(line):
                          matches.append(f"{path.as_posix()}:{number}:{line}")
              return matches

          step2 = scan(
              ["src/monitoring", "src/subroutines", "modules/ethics_field", "modules/cask", "api"],
              {".py"},
          )
          step3 = scan(["src", "modules", "api", "config"], {".py", ".json", ".yaml", ".toml"})
          (out / "step2.deterministic.txt").write_text(
              ("\n".join(step2) + "\n") if step2 else "No matches\n", encoding="utf-8"
          )
          (out / "step3.deterministic.txt").write_text(
              ("\n".join(step3) + "\n") if step3 else "No matches\n", encoding="utf-8"
          )

          canonical2 = (out / "step2.canonical.txt").read_text(encoding="utf-8").splitlines()
          canonical3 = (out / "step3.canonical.txt").read_text(encoding="utf-8").splitlines()
          result = {
              "schema": "aurora.gate001a.deterministic_replay_receipt/v1",
              "event_id": "AURORA-GATE-001A-RECOVERED-PROTOCOL-WIRING-001",
              "run_id": "AURORA-GATE-001A-RUN-001-3142AA47",
              "baseline_commit": "3142aa47afac0b8e63cc5bc46f9fa8ae40592354",
              "seed": "AURORA-GATE-001A-RUN-001-3142AA47",
              "executed_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "runner": os.environ.get("RUNNER_NAME", "github-hosted-runner"),
              "step2": {
                  "canonical_exit_code": int((out / "step2.exit_code.txt").read_text().strip()),
                  "canonical_match_count": len(canonical2),
                  "deterministic_match_count": len(step2),
                  "set_equivalent": set(canonical2) == set(step2),
              },
              "step3": {
                  "canonical_exit_code": int((out / "step3.exit_code.txt").read_text().strip()),
                  "canonical_match_count": len(canonical3),
                  "deterministic_match_count": len(step3),
                  "set_equivalent": set(canonical3) == set(step3),
              },
          }
          files = {}
          for path in sorted(out.iterdir()):
              if path.is_file():
                  files[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          result["artifact_digests"] = files
          (out / "deterministic_replay_receipt.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          if not result["step2"]["set_equivalent"] or not result["step3"]["set_equivalent"]:
              raise SystemExit("canonical and deterministic scan records differ")
          PY

          if [ "$step2_status" -gt 1 ] || [ "$step3_status" -gt 1 ]; then
            exit 3
          fi

      - name: Upload deterministic replay receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-001a-run-001-deterministic-replay
          path: gate001a-replay/
          if-no-files-found: error
          retention-days: 90
