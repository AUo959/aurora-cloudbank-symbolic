---
name: "CodeQL Enhanced Analysis"

"on":
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '18 13 * * 1'
  workflow_dispatch:

# Minimal least-privilege permissions for this workflow
permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Reduced timeout to avoid hanging
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Shallow clone for faster checkout

      - name: "Guard: ensure default code scanning setup is disabled (warn-only)"
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${{ github.repository }}/code-scanning/default-setup"
          code=$(curl -sS -o /tmp/default_setup.json -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "$url" || true)
          if [[ "$code" == "200" ]]; then
            state=$(python3 -c "import json; print(json.load(open('/tmp/default_setup.json')).get('state',''))")
            if [[ "$state" == "configured" || "$state" == "enabled" ]]; then
              echo "::warning::Default Code Scanning setup is enabled (state=$state). Disable it to use this custom CodeQL workflow. Proceeding without failing."
            fi
          fi
          echo "Default setup not configured (status=$code); proceeding."

      - name: Pre-analysis cleanup
        run: |
          # Ensure clean environment for CodeQL analysis
          mkdir -p /home/runner/work/_temp
          touch /home/runner/work/_temp/proxy.log
          echo "Environment prepared for CodeQL analysis"

      # SRB-T1: Upgraded CodeQL Action to v3 due to deprecation notice (2025-08-19)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-and-quality
          # Use external config file to avoid conflicts
          config-file: ./.github/codeql/codeql-config.yml

      - name: Setup Node.js (for JavaScript analysis)
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        if: matrix.language == 'javascript-typescript' && hashFiles('package.json') != ''
        run: npm ci || npm install

      # SRB-T1: Upgraded setup-python@v4 to @v5 due to deprecation notice (2025-08-19)
      - name: Setup Python (for Python analysis)
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        if: matrix.language == 'python' && hashFiles('requirements.txt') != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # SRB-T1: Upgraded CodeQL Action to v3 due to deprecation notice (2025-08-19)
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true

      - name: Cleanup temporary files
        if: always()
        run: |
          # Clean up any temporary files that might cause issues
          sudo rm -rf /tmp/codeql-* || true
          # Create proxy.log if it doesn't exist to prevent warnings
          mkdir -p /home/runner/work/_temp || true
          touch /home/runner/work/_temp/proxy.log || true
          echo "Cleanup completed successfully"
