name: GitWiz Quality Gates
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

# Explicit permissions for security
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install isort black pylint flake8 bandit autopep8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Install Node.js dependencies
      run: |
        npm install -g markdownlint-cli prettier eslint
        
    - name: GitWiz Status Check
      run: |
        if [ -f scripts/gitwiz_integrated_command.py ]; then
          python scripts/gitwiz_integrated_command.py status || echo "::warning::GitWiz status check failed"
        else
          echo "::notice::GitWiz integrated command not found, skipping status check"
        fi
        
    - name: GitWiz Comprehensive Lint Scan
      run: |
        if [ -f scripts/gitwiz_integrated_command.py ]; then
          python scripts/gitwiz_integrated_command.py lint-scan --detailed --target scripts/ || echo "::warning::GitWiz lint scan failed"
        else
          echo "::notice::GitWiz integrated command not found, running basic linting"
          # Run basic Python linting
          find . -name "*.py" -exec python -m py_compile {} + || true
          # Run basic flake8 if available
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
        fi
        
    - name: GitWiz Quality Check
      run: |
        if [ -f scripts/gitwiz_integrated_command.py ]; then
          python scripts/gitwiz_integrated_command.py quality-check --output json > quality_report.json || echo "::warning::GitWiz quality check failed"
        else
          echo "::notice::GitWiz integrated command not found, running basic quality checks"
          # Run basic quality checks
          echo '{"status": "basic", "message": "GitWiz not available, ran basic checks"}' > quality_report.json
        fi
        
    - name: Upload Quality Report
      uses: actions/upload-artifact@v3
      with:
        name: quality-report
        path: quality_report.json
        
    - name: GitWiz Maintenance Check
      if: github.event_name == 'schedule'
      run: |
        if [ -f scripts/gitwiz_integrated_command.py ]; then
          python scripts/gitwiz_integrated_command.py maintenance --aggressive --output json > maintenance_report.json || echo "::warning::GitWiz maintenance failed"
        else
          echo '{"status": "skipped", "message": "GitWiz not available"}' > maintenance_report.json
        fi
        
    - name: Upload Maintenance Report
      if: github.event_name == 'schedule'
      uses: actions/upload-artifact@v3
      with:
        name: maintenance-report
        path: maintenance_report.json
        
    - name: Security Scan
      run: |
        python -m bandit -r scripts/ -f json -o bandit_report.json || true
        
    - name: Upload Security Report
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: bandit_report.json
        
    - name: Code Coverage Analysis
      run: |
        # Add coverage analysis if tests are present
        echo "Code coverage analysis placeholder"
        
    - name: Performance Benchmarks
      if: github.event_name == 'pull_request'
      run: |
        # Add performance benchmarking
        echo "Performance benchmarks placeholder"
        
    - name: Generate Summary Report
      run: |
        if [ -f scripts/generate_ci_summary.py ]; then
          python scripts/generate_ci_summary.py || echo "::warning::CI summary generation failed"
        else
          echo "# CI Summary" > ci_summary.md
          echo "Basic CI checks completed successfully." >> ci_summary.md
        fi
        
    - name: Comment PR with Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          if (fs.existsSync('ci_summary.md')) {
            const summary = fs.readFileSync('ci_summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
          }

  security-audit:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install security tools
      run: |
        pip install bandit safety
        
    - name: Run Security Audit
      run: |
        if [ -f scripts/gitwiz_integrated_command.py ]; then
          python scripts/gitwiz_integrated_command.py lint-scan --target scripts/ > security_scan.txt || echo "GitWiz scan failed" > security_scan.txt
        else
          echo "Basic security scan completed" > security_scan.txt
        fi
        bandit -r . -f json -o bandit_security.json || true
        
    - name: Upload Security Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: security-audit
        path: |
          security_scan.txt
          bandit_security.json

  deployment-quality-check:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [quality-gate]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install isort black pylint flake8 bandit autopep8
        
    - name: Pre-deployment Quality Gate
      run: |
        if [ -f scripts/gitwiz_integrated_command.py ]; then
          python scripts/gitwiz_integrated_command.py workflow --type enhanced --aggressive || echo "::warning::GitWiz workflow failed"
        else
          echo "::notice::GitWiz not available, skipping advanced quality gate"
        fi
        
    - name: Generate Deployment Report
      run: |
        if [ -f scripts/gitwiz_integrated_command.py ]; then
          python scripts/gitwiz_integrated_command.py status > deployment_status.json || echo '{"status": "error"}' > deployment_status.json
        else
          echo '{"status": "basic", "message": "GitWiz not available"}' > deployment_status.json
        fi
        
    - name: Upload Deployment Report
      uses: actions/upload-artifact@v3
      with:
        name: deployment-report
        path: deployment_status.json
