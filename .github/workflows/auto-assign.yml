name: Auto Assign Reviewers

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  add_reviewers:
    runs-on: ubuntu-latest
    steps:
      - uses: kentaro-m/auto-assign-action@v1.2.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/auto_assign.yml
