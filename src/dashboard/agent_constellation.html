<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' ws: wss:; font-src 'self'; object-src 'none'; media-src 'self'; frame-src 'none';">
    <title>Aurora Mesh Dashboard</title>
    <style>
        :root {
            --bg: #071018;
            --panel: rgba(7, 16, 24, 0.84);
            --panel-strong: rgba(10, 24, 38, 0.94);
            --line: rgba(113, 204, 255, 0.22);
            --accent: #78d4ff;
            --accent-2: #ffd27a;
            --text: #ebf5fb;
            --muted: #90a9b8;
            --good: #4bd287;
            --warn: #ffbb55;
            --bad: #ff6d6d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Avenir Next", "Trebuchet MS", sans-serif;
            background:
                radial-gradient(circle at top, rgba(56, 123, 186, 0.28), transparent 38%),
                radial-gradient(circle at bottom right, rgba(255, 210, 122, 0.18), transparent 30%),
                linear-gradient(160deg, #04070c 0%, #08121b 48%, #051018 100%);
            color: var(--text);
        }

        .shell {
            max-width: 1280px;
            margin: 0 auto;
            padding: 28px;
        }

        .hero {
            padding: 26px 28px;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: linear-gradient(180deg, rgba(11, 24, 38, 0.92), rgba(6, 13, 20, 0.84));
            box-shadow: 0 28px 90px rgba(0, 0, 0, 0.35);
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-size: 0.74rem;
            margin-bottom: 14px;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(2rem, 5vw, 3.5rem);
            line-height: 0.95;
        }

        .hero p {
            max-width: 780px;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.5;
            margin: 14px 0 0;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 22px;
        }

        button, .link-btn {
            border: 0;
            border-radius: 999px;
            padding: 12px 18px;
            cursor: pointer;
            color: #071018;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #bce9ff);
            text-decoration: none;
            transition: transform 140ms ease, opacity 140ms ease;
        }

        button.secondary, .link-btn.secondary {
            color: var(--text);
            background: rgba(120, 212, 255, 0.1);
            border: 1px solid rgba(120, 212, 255, 0.2);
        }

        button:hover, .link-btn:hover {
            transform: translateY(-1px);
            opacity: 0.94;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .card, .agent-card {
            padding: 20px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .card-label {
            color: var(--muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .card-value {
            margin-top: 10px;
            font-size: 2rem;
            font-weight: 800;
        }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 30px;
        }

        .section-head h2 {
            margin: 0;
            font-size: 1.3rem;
        }

        .agents {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 14px;
        }

        .agent-card {
            background: linear-gradient(180deg, rgba(10, 24, 38, 0.88), rgba(6, 13, 20, 0.88));
        }

        .agent-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .agent-name {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .status-pill {
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 700;
        }

        .status-active {
            background: rgba(75, 210, 135, 0.15);
            color: var(--good);
        }

        .status-ready {
            background: rgba(255, 187, 85, 0.15);
            color: var(--warn);
        }

        .status-disconnected {
            background: rgba(255, 109, 109, 0.15);
            color: var(--bad);
        }

        .meta {
            color: var(--muted);
            margin-top: 14px;
            line-height: 1.55;
            font-size: 0.95rem;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .chip {
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(120, 212, 255, 0.1);
            color: var(--accent);
            font-size: 0.78rem;
            border: 1px solid rgba(120, 212, 255, 0.18);
        }

        .agent-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .agent-actions button,
        .agent-actions a {
            font-size: 0.88rem;
        }

        .agent-actions .secondary {
            color: var(--text);
        }

        .footer-note {
            color: var(--muted);
            font-size: 0.88rem;
            margin-top: 24px;
        }

        @media (max-width: 720px) {
            .shell {
                padding: 18px;
            }

            .hero {
                padding: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <section class="hero">
            <div class="eyebrow">Aurora Mesh Router V1</div>
            <h1>Constellation status, one runtime, no split brain.</h1>
            <p>
                This dashboard is now backed by the FastAPI mesh runtime. Agent presence, activation,
                event cursor, and channel state all come from the same source of truth the chamber uses.
            </p>
            <div class="toolbar">
                <button id="refreshStatusBtn" type="button">Refresh Status</button>
                <button id="activateAllBtn" type="button" class="secondary">Activate All</button>
                <a class="link-btn secondary" href="/chamber">Open Chamber</a>
            </div>
        </section>

        <section class="grid" id="summaryCards"></section>

        <section class="section-head">
            <h2>Routable Agents</h2>
            <div id="lastRefresh" class="footer-note"></div>
        </section>
        <section class="agents" id="agentGrid"></section>
    </div>

    <script src="../../static/js/aurora-security.js"></script>
    <script>
        class MeshDashboard {
            constructor() {
                this.status = null;
                this.summaryCards = document.getElementById('summaryCards');
                this.agentGrid = document.getElementById('agentGrid');
                this.lastRefresh = document.getElementById('lastRefresh');
                this.refreshButton = document.getElementById('refreshStatusBtn');
                this.activateAllButton = document.getElementById('activateAllBtn');
                this.refreshButton.addEventListener('click', () => {
                    this.refresh();
                });
                this.activateAllButton.addEventListener('click', () => {
                    this.activateAll();
                });
            }

            toText(value) {
                if (value === null || value === undefined) {
                    return '';
                }
                return String(value);
            }

            toArray(value) {
                return Array.isArray(value) ? value : [];
            }

            statusClass(status) {
                const normalized = this.toText(status)
                    .toLowerCase()
                    .replace(/[^a-z0-9_-]+/g, '-')
                    .replace(/^-+|-+$/g, '');
                return normalized || 'disconnected';
            }

            formatTimestamp(value) {
                if (!value) {
                    return 'none';
                }
                const date = new Date(value);
                return Number.isNaN(date.getTime()) ? this.toText(value) : date.toLocaleString();
            }

            buildMetaLine(label, value) {
                const line = document.createElement('div');
                line.textContent = `${label}: ${value}`;
                return line;
            }

            async refresh() {
                const response = await fetch('/api/mesh/status');
                this.status = await response.json();
                this.renderSummary();
                this.renderAgents();
                this.lastRefresh.textContent = `Last refresh: ${new Date().toLocaleTimeString()}`;
            }

            renderSummary() {
                const cards = [
                    ['Mesh Status', this.status.mesh_status],
                    ['Event Cursor', this.status.event_cursor],
                    ['Total Agents', this.status.total_agents],
                    ['Active Agents', this.status.active_agents],
                    ['Channels', this.toArray(this.status.channels).length]
                ];

                // Build DOM nodes instead of injecting runtime values into HTML.
                const fragment = document.createDocumentFragment();
                for (const [label, value] of cards) {
                    const article = document.createElement('article');
                    article.className = 'card';

                    const labelNode = document.createElement('div');
                    labelNode.className = 'card-label';
                    labelNode.textContent = label;

                    const valueNode = document.createElement('div');
                    valueNode.className = 'card-value';
                    valueNode.textContent = this.toText(value);

                    article.append(labelNode, valueNode);
                    fragment.append(article);
                }

                this.summaryCards.replaceChildren(fragment);
            }

            renderAgents() {
                const fragment = document.createDocumentFragment();

                for (const agent of this.toArray(this.status.agents)) {
                    const article = document.createElement('article');
                    article.className = 'agent-card';

                    const top = document.createElement('div');
                    top.className = 'agent-top';

                    const identity = document.createElement('div');
                    const name = document.createElement('div');
                    name.className = 'agent-name';
                    name.textContent = this.toText(agent.display_name);

                    const mode = document.createElement('div');
                    mode.className = 'meta';
                    mode.textContent = `${this.toText(agent.execution_mode)} | default ${this.toText(agent.default_channel)}`;
                    identity.append(name, mode);

                    const status = document.createElement('div');
                    status.className = `status-pill status-${this.statusClass(agent.status)}`;
                    status.textContent = this.toText(agent.status);
                    top.append(identity, status);

                    const chips = document.createElement('div');
                    chips.className = 'chips';
                    for (const channel of this.toArray(agent.channels)) {
                        const chip = document.createElement('span');
                        chip.className = 'chip';
                        chip.textContent = this.toText(channel);
                        chips.append(chip);
                    }

                    const details = document.createElement('div');
                    details.className = 'meta';
                    const aliases = this.toArray(agent.aliases)
                        .map((alias) => this.toText(alias))
                        .filter(Boolean)
                        .join(', ') || 'none';
                    details.append(
                        this.buildMetaLine('Aliases', aliases),
                        this.buildMetaLine('Last heartbeat', this.formatTimestamp(agent.last_heartbeat))
                    );

                    const actions = document.createElement('div');
                    actions.className = 'agent-actions';

                    const activateButton = document.createElement('button');
                    activateButton.type = 'button';
                    activateButton.textContent = 'Activate';
                    const agentId = this.toText(agent.agent_id);
                    activateButton.addEventListener('click', () => {
                        this.activateAgent(agentId);
                    });

                    const openLine = document.createElement('a');
                    openLine.className = 'link-btn secondary';
                    openLine.textContent = 'Open Line';
                    const chamberUrl = new URL('/chamber', window.location.origin);
                    chamberUrl.searchParams.set('agent', agentId);
                    chamberUrl.searchParams.set('channel', this.toText(agent.default_channel));
                    openLine.href = `${chamberUrl.pathname}${chamberUrl.search}`;

                    actions.append(activateButton, openLine);
                    article.append(top, chips, details, actions);
                    fragment.append(article);
                }

                this.agentGrid.replaceChildren(fragment);
            }

            async activateAgent(agentId) {
                await fetch(`/api/mesh/agents/${encodeURIComponent(agentId)}/activate`, { method: 'POST' });
                await this.refresh();
            }

            async activateAll() {
                const agents = this.status ? this.status.agents : [];
                for (const agent of agents) {
                    await this.activateAgent(agent.agent_id);
                }
            }
        }

        const dashboard = new MeshDashboard();
        dashboard.refresh();
        window.setInterval(() => dashboard.refresh(), 8000);
    </script>
</body>
</html>
