# GitHub Actions configuration for suppressing known warnings
# This file helps manage non-critical warnings in CI/CD pipelines

# CodeQL Analysis Configuration
codeql:
  # Suppress proxy.log warnings that don't affect security analysis
  suppress_warnings:
    - 'start-proxy post-action step failed: File /home/runner/work/_temp/proxy.log does not exist'

  # Enhanced cleanup for better reliability
  cleanup_strategy: 'proactive'

  # Enable enhanced logging for debugging
  debug_mode: false

# CI/CD Pipeline Configuration
ci:
  # Continue on non-critical failures
  fail_fast: false

  # Upload artifacts even on partial failures
  always_upload_artifacts: true

  # Enhanced error reporting
  enhanced_logging: true
