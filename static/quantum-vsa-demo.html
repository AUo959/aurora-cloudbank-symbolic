<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-src 'none';">
    <title>Aurora VSA Demo Retired</title>
    <style>
        :root {
            --bg: #071014;
            --panel: rgba(14, 25, 32, 0.9);
            --border: rgba(116, 214, 234, 0.3);
            --text: #edf7f8;
            --muted: #9bb0b8;
            --cyan: #4cc9e8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                linear-gradient(180deg, rgba(10, 22, 28, 0.95), rgba(5, 11, 15, 1)),
                repeating-linear-gradient(90deg, rgba(76, 201, 232, 0.04) 0 1px, transparent 1px 72px);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(680px, 100%);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 28px;
            background: var(--panel);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.38);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
            line-height: 1.12;
        }

        p {
            margin: 0 0 16px;
            color: var(--muted);
            line-height: 1.55;
        }

        a {
            color: var(--cyan);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main>
        <h1>Quantum VSA Demo Retired</h1>
        <p>This static filename is preserved for compatibility only. The active Docker UI is now the Aurora Simulation Console.</p>
        <p><a href="/simulation-console">Open Simulation Console</a> or <a href="/synergy-dashboard">open Synergy Dashboard</a>.</p>
    </main>
</body>
</html>
