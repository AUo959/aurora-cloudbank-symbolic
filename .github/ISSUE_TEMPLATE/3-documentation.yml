name: 📚 Documentation Issue
description: Report issues or suggest improvements to documentation
title: "[Docs]: "
labels: ["documentation", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Help us improve Aurora's documentation!

  - type: dropdown
    id: type
    attributes:
      label: Documentation Type
      description: What kind of documentation issue is this?
      options:
        - Missing documentation
        - Incorrect/outdated information
        - Unclear explanation
        - Broken link
        - Code example needed
        - Architecture diagram needed
        - API reference incomplete
        - Other
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Documentation Location
      description: Where is the issue? (URL, file path, or section name)
      placeholder: e.g., docs/GEOMETRIC_ETHICS_ARCHITECTURE.md, line 45
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: Issue Description
      description: What's wrong or missing?
      placeholder: Describe the documentation issue...
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Improvement
      description: How should this be fixed or improved?
      placeholder: The documentation should explain...

  - type: dropdown
    id: audience
    attributes:
      label: Target Audience
      description: Who is this documentation for?
      options:
        - New users/contributors
        - Developers
        - API users
        - System administrators
        - All users
    validations:
      required: true

  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I can help improve this documentation
          required: false
