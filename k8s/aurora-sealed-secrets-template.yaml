# Aurora CloudBank - Sealed Secrets Template
# This is a TEMPLATE file demonstrating the structure of a SealedSecret
# 
# DO NOT USE THESE VALUES IN PRODUCTION
# Generate actual sealed secrets using: kubeseal --format=yaml < plaintext-secret.yaml
#
# Mission: HIGH-3 K8s Secrets Encryption
# Officer: OPS Rodriguez
# Chain: #005//003//SEC

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: aurora-api-keys
  namespace: aurora-cloudbank
  labels:
    app: aurora-gui-cloudhub
    component: sealed-secrets
    ethics-protocol: picard-delta-3
  annotations:
    aurora.io/chain-notation: "#K8S//SEALED_SECRET//API_KEYS//"
    aurora.io/srb: "K8S_SEALED_SECRET_v1"
    aurora.io/ethics-protocol: "Picard_Delta_3"
    aurora.io/encryption: "AES-256-GCM"
    sealedsecrets.bitnami.com/namespace-wide: "true"
    # This annotation makes the secret re-usable across namespace
    # Remove for cluster-wide secrets
spec:
  # The encryptedData field contains the sealed (encrypted) versions of your secrets
  # These values can ONLY be decrypted by the sealed-secrets controller
  # They are safe to commit to git
  encryptedData:
    # Replace these with actual sealed values generated by kubeseal
    # Format: AgA... (base64 encoded encrypted data)
    
    # Anthropic Claude API Key (sealed)
    anthropic-api-key: "REPLACE_WITH_SEALED_VALUE_FROM_KUBESEAL"
    
    # OpenAI GPT API Key (sealed)
    openai-api-key: "REPLACE_WITH_SEALED_VALUE_FROM_KUBESEAL"
    
    # CSRF Token Secret (sealed)
    csrf-secret-key: "REPLACE_WITH_SEALED_VALUE_FROM_KUBESEAL"
    
    # JWT Signing Key (sealed)
    jwt-secret-key: "REPLACE_WITH_SEALED_VALUE_FROM_KUBESEAL"
  
  # The template defines what the unsealed Secret will look like
  # The controller uses this to create the regular Kubernetes Secret
  template:
    metadata:
      name: aurora-api-keys
      namespace: aurora-cloudbank
      labels:
        app: aurora-gui-cloudhub
        component: api-credentials
      annotations:
        aurora.io/unsealed-from: "sealed-secret"
        aurora.io/rotation-date: "2025-11-11"
    
    type: Opaque
    # The data field will be populated by the controller after decryption

---
# Example of properly sealed secret (DO NOT USE - for reference only)
# This shows what a real sealed secret looks like after kubeseal processing
#
# apiVersion: bitnami.com/v1alpha1
# kind: SealedSecret
# metadata:
#   name: aurora-api-keys
#   namespace: aurora-cloudbank
# spec:
#   encryptedData:
#     anthropic-api-key: AgA7xV9k...encrypted-string-200+ chars...
#     openai-api-key: AgB2kP8f...encrypted-string-200+ chars...
#     csrf-secret-key: AgC9mL3h...encrypted-string-200+ chars...
#     jwt-secret-key: AgD4nQ2r...encrypted-string-200+ chars...

---
# INSTRUCTIONS FOR GENERATING SEALED SECRETS
#
# 1. Create plaintext secret (DO NOT COMMIT):
#    kubectl create secret generic aurora-api-keys \
#      --namespace=aurora-cloudbank \
#      --from-literal=anthropic-api-key='YOUR_ACTUAL_KEY' \
#      --from-literal=openai-api-key='YOUR_ACTUAL_KEY' \
#      --from-literal=csrf-secret-key='YOUR_ACTUAL_KEY' \
#      --from-literal=jwt-secret-key='YOUR_ACTUAL_KEY' \
#      --dry-run=client -o yaml > plaintext-secret.yaml
#
# 2. Seal the secret:
#    kubeseal --format=yaml < plaintext-secret.yaml > aurora-sealed-secrets.yaml
#
# 3. Apply to cluster:
#    kubectl apply -f aurora-sealed-secrets.yaml
#
# 4. Verify:
#    kubectl get sealedsecrets -n aurora-cloudbank
#    kubectl get secrets -n aurora-cloudbank | grep aurora-api-keys
#
# 5. Delete plaintext file securely:
#    shred -vfz -n 3 plaintext-secret.yaml
#
# See: k8s/SECRETS_MANAGEMENT.md for complete documentation
